/* =========================================================
   CREDIT CARD MANAGEMENT
   ---------------------------------------------------------
   Three different obligations, never merged into one number:
     current outstanding — everything owed on the card right now
     statement balance   — what the issuer billed for one cycle
     minimum due         — the least you must pay on that statement
   A billing cycle runs from the day after one closing date to
   the next closing date. Nothing is ever called "generated"
   until you confirm it, because this app has no link to your
   bank and cannot know what the issuer actually billed.
   ========================================================= */

/* How a card was used. This is only a label on the transaction —
   a RuPay card tapped through UPI is still the SAME card, with one
   limit, one outstanding balance and one bill. Never a second card. */
var CARD_CHANNELS = [
  { id:"swipe",  label:"Tapped or swiped", hint:"In a shop, on a card machine" },
  { id:"online", label:"Online",           hint:"Website or app checkout" },
  { id:"upi",    label:"Through UPI",      hint:"RuPay card linked in a UPI app" }
];
function channelLabel(x) {
  for (var i = 0; i < CARD_CHANNELS.length; i++) if (CARD_CHANNELS[i].id === x) return CARD_CHANNELS[i].label;
  return "";
}
/** Card spending split by how the card was used — one card, several channels. */
function channelSplit(cardId, fromIso, toIso) {
  var m = {};
  db.tx.forEach(function (t) {
    if (t.type !== "out" || t.acc !== cardId) return;
    if (fromIso && t.date < fromIso) return;
    if (toIso && t.date > toIso) return;
    var v = netSpend(t);
    if (!v) return;
    var k = channelLabel(t.channel) || (t.charge ? "Fees and interest" : "Not noted");
    m[k] = (m[k] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
var CHARGE_KINDS = [
  { id:"fee",      label:"Fee" },
  { id:"interest", label:"Interest" },
  { id:"emi",      label:"EMI instalment" },
  { id:"tax",      label:"Tax" },
  { id:"other",    label:"Other charge" }
];
var PAY_TYPES = [
  { id:"remaining", label:"Remaining statement amount" },
  { id:"full",      label:"Full statement balance" },
  { id:"min",       label:"Minimum amount due" },
  { id:"current",   label:"Current outstanding (everything)" },
  { id:"custom",    label:"Some other amount" }
];

function cards(includeArchived) {
  return db.accounts.filter(function (a) {
    return a.kind === "card" && (includeArchived || !a.archived);
  });
}
function isCard(x) { var a = acc(x); return !!(a && a.kind === "card"); }

/* ---------- dates ---------- */
/** The closing day for a given month, honouring "last day" and short months. */
function closingDay(card, year, monthIndex) {
  var dim = new Date(year, monthIndex + 1, 0).getDate();
  if (card.stmtDay === "last" || !card.stmtDay) return dim;
  var want = parseInt(card.stmtDay, 10);
  if (!want || want < 1) return dim;
  return Math.min(want, dim);
}
function closingDateFor(card, year, monthIndex) {
  return isoOf(new Date(year, monthIndex, closingDay(card, year, monthIndex)));
}
/** Was the configured day shortened to fit the month? */
function closingAdjusted(card, iso) {
  if (!card.stmtDay || card.stmtDay === "last") return false;
  var want = parseInt(card.stmtDay, 10);
  return !!want && parseInt(iso.slice(8), 10) !== want;
}
/** The next closing date strictly after the given day. */
function nextClosing(card, afterIso) {
  var base = dateFrom(afterIso || today());
  var y = base.getFullYear(), m = base.getMonth();
  for (var i = 0; i < 14; i++) {
    var candidate = closingDateFor(card, y, m + i);
    if (candidate > (afterIso || today())) return candidate;
  }
  return closingDateFor(card, y, m + 1);
}
/** The most recent closing date on or before today, whether or not it was confirmed. */
function lastExpectedClosing(card) {
  var base = new Date();
  for (var i = 0; i < 14; i++) {
    var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    var candidate = closingDateFor(card, d.getFullYear(), d.getMonth());
    if (candidate <= today()) return candidate;
  }
  return "";
}
function expectedDue(card, closeIso) {
  if (!closeIso) return "";
  if (card.dueRule === "days") {
    var n = parseInt(card.dueDays, 10) || 20;
    return isoOf(new Date(dateFrom(closeIso).getTime() + n * 86400000));
  }
  var want = parseInt(card.dueDay, 10);
  if (!want) return isoOf(new Date(dateFrom(closeIso).getTime() + 20 * 86400000));
  var c = dateFrom(closeIso);
  for (var i = 0; i < 3; i++) {
    var y = c.getFullYear(), m = c.getMonth() + i;
    var dim = new Date(y, m + 1, 0).getDate();
    var candidate = isoOf(new Date(y, m, Math.min(want, dim)));
    if (candidate > closeIso) return candidate;
  }
  return isoOf(new Date(c.getTime() + 20 * 86400000));
}
function daysBetweenIso(a, b) {
  return Math.round((dateFrom(b) - dateFrom(a)) / 86400000);
}
function dayPhrase(prefix, days, overduePrefix) {
  if (days === 0) return prefix + " today";
  if (days === 1) return prefix + " tomorrow";
  if (days > 1) return prefix + " in " + days + " days";
  var over = Math.abs(days);
  return (overduePrefix || "Overdue by") + " " + over + " day" + (over === 1 ? "" : "s");
}

/* ---------- statements ---------- */
function statementsOf(cardId) {
  return (db.statements || []).filter(function (s) { return s.cardId === cardId; })
    .sort(function (a, b) { return b.closeDate.localeCompare(a.closeDate); });
}
function statementById(x) {
  var all = db.statements || [];
  for (var i = 0; i < all.length; i++) if (all[i].id === x) return all[i];
  return null;
}
function latestStatement(cardId) { return statementsOf(cardId)[0] || null; }
/** Payments recorded against one statement. */
function statementPayments(stmtId) {
  return db.tx.filter(function (t) { return t.type === "bill" && t.stmtId === stmtId; });
}
function paidOnStatement(stmtId) {
  return statementPayments(stmtId).reduce(function (s, t) { return s + Math.round(t.amt || 0); }, 0);
}
/** Refunds that landed on the card after the statement closed reduce what you owe. */
function statementCredits(st) {
  var total = 0;
  db.tx.forEach(function (t) {
    (t.refunds || []).forEach(function (r) {
      if (r.to !== st.cardId) return;
      if (r.date > st.closeDate && (!st.dueDate || r.date <= st.dueDate)) total += Math.round(r.amt || 0);
    });
  });
  return total;
}
function statementRemaining(st) {
  return Math.max(0, Math.round(st.balance || 0) - paidOnStatement(st.id) - statementCredits(st));
}
function minStillDue(st) {
  var paid = paidOnStatement(st.id) + statementCredits(st);
  return Math.max(0, Math.round(st.minDue || 0) - paid);
}
function statementState(st) {
  var remaining = statementRemaining(st);
  var paid = paidOnStatement(st.id);
  if (remaining <= 0) return "paid";
  if (st.dueDate && st.dueDate < today()) return "overdue";
  return paid > 0 ? "partial" : "open";
}
function unpaidStatements(cardId) {
  return statementsOf(cardId).filter(function (s) { return statementRemaining(s) > 0; })
    .sort(function (a, b) { return a.closeDate.localeCompare(b.closeDate); });
}

/* ---------- card money ---------- */
/** Everything charged to the card between two dates (purchases + fees - refunds). */
function cardActivity(cardId, fromIso, toIso) {
  var charges = 0, refunds = 0, payments = 0, rows = [];
  db.tx.forEach(function (t) {
    var inRange = (!fromIso || t.date >= fromIso) && (!toIso || t.date <= toIso);
    if (t.type === "out" && t.acc === cardId && inRange) {
      var amount = moneyOut(t);
      if (amount) { charges += amount; rows.push(t); }
    }
    if ((t.type === "bill" || t.type === "move") && t.to === cardId && inRange) {
      payments += Math.round(t.amt || 0);
      rows.push(t);
    }
    (t.refunds || []).forEach(function (r) {
      if (r.to !== cardId) return;
      if ((!fromIso || r.date >= fromIso) && (!toIso || r.date <= toIso)) {
        refunds += Math.round(r.amt || 0);
        if (rows.indexOf(t) === -1) rows.push(t);
      }
    });
  });
  return { charges: charges, refunds: refunds, payments: payments, net: charges - refunds, rows: rows };
}
/** The cycle currently running: day after the last close, up to the next close. */
function currentCycle(card) {
  var last = latestStatement(card.id);
  var from = last ? isoOf(new Date(dateFrom(last.closeDate).getTime() + 86400000))
                  : (card.openedOn || "");
  var to = nextClosing(card, last ? last.closeDate : (lastExpectedClosing(card) || today()));
  if (!last) {
    var prev = lastExpectedClosing(card);
    to = prev && prev >= today() ? prev : nextClosing(card, prev || yesterday());
  }
  return { from: from, to: to };
}
function unbilled(card) {
  var last = latestStatement(card.id);
  if (!last) return cardOutstanding(card);
  var from = isoOf(new Date(dateFrom(last.closeDate).getTime() + 86400000));
  var a = cardActivity(card.id, from, "");
  return Math.max(0, a.net);
}
function emis() { db.emis = db.emis || []; return db.emis; }
/** Instalments still to run on a card. They hold up limit before being billed. */
function emiLeft(cardId) {
  return emis().filter(function (e) { return e.cardId === cardId && Math.round(e.left || 0) > 0; })
    .reduce(function (n, e) { return n + Math.round(e.left); }, 0);
}
/** Cards that share one pool of credit — a shared limit is ONE limit,
    not one each. Spending on either card reduces the same pool. */
function limitFamily(card) {
  if (!card) return [];
  if (card.sharedLimit) {
    return db.accounts.filter(function (a) {
      return a.kind === "card" && !a.archived && a.sharedLimit === card.sharedLimit;
    });
  }
  return [card];
}
function sharedLimitOf(card) {
  var fam = limitFamily(card);
  /* every card in the family carries the same figure, so take the largest */
  return fam.reduce(function (n, a) { return Math.max(n, Math.round(a.limit || 0)); }, 0);
}
function familyUsed(card) {
  return limitFamily(card).reduce(function (n, a) {
    return n + cardOutstanding(a) + emiLeft(a.id);
  }, 0);
}
function cardMoney(card) {
  var limit = sharedLimitOf(card);
  var outstanding = cardOutstanding(card);
  var emi = emiLeft(card.id);
  var st = latestStatement(card.id);
  var fam = limitFamily(card);
  var shared = fam.length > 1;
  var poolUsed = familyUsed(card);
  return {
    limit: limit,
    shared: shared,
    family: fam,
    outstanding: outstanding,
    emi: emi,
    held: outstanding + emi,
    poolUsed: poolUsed,
    unbilled: unbilled(card),
    available: limit > 0 ? limit - poolUsed : null,
    utilisation: limit > 0 ? (poolUsed / limit) * 100 : null,
    statement: st,
    statementBalance: st ? Math.round(st.balance || 0) : 0,
    statementPaid: st ? paidOnStatement(st.id) + statementCredits(st) : 0,
    statementRemaining: st ? statementRemaining(st) : 0,
    minDue: st ? Math.round(st.minDue || 0) : 0,
    minRemaining: st ? minStillDue(st) : 0,
    pastDue: unpaidStatements(card.id).filter(function (s2) {
      return st && s2.id !== st.id;
    }).reduce(function (sum, s2) { return sum + statementRemaining(s2); }, 0)
  };
}
/** Which of the six states the tile should show. */
function cardState(card) {
  var st = latestStatement(card.id);
  var nextClose = st ? nextClosing(card, st.closeDate) : (lastExpectedClosing(card) >= today()
    ? lastExpectedClosing(card) : nextClosing(card, yesterday()));
  if (st && statementRemaining(st) > 0) {
    return { id: statementState(st), statement: st, nextClose: nextClose };
  }
  var expected = st ? nextClosing(card, st.closeDate) : lastExpectedClosing(card);
  if (st && statementRemaining(st) <= 0 && st.closeDate >= (lastExpectedClosing(card) || "")) {
    /* everything settled and no newer statement is due yet */
    if (expected && expected <= today()) return { id:"expected", expectedDate: expected, statement: st, nextClose: expected };
    return { id: "paid", statement: st, nextClose: expected };
  }
  if (expected && expected <= today()) {
    return { id: "expected", expectedDate: expected, statement: st, nextClose: expected };
  }
  return { id: "before", nextClose: nextClose || expected, statement: st };
}
function stateWords(id) {
  return { before:"Nothing billed yet", expected:"Statement expected", open:"Bill generated",
           partial:"Bill partly paid", paid:"Bill paid", overdue:"Payment overdue" }[id] || "";
}
function stateTag(id) {
  return { before:"", expected:"w", open:"w", partial:"w", paid:"g", overdue:"r" }[id] || "";
}

/* ---------- the card tile ---------- */
function cardTile(card) {

  if (m.limit > 0) {
    var klass = m.utilisation > 70 ? "o" : m.utilisation > 30 ? "w" : "";
    h += '<div class="bar"><i class="' + klass + '" style="inline-size:' +
      Math.min(100, Math.max(0, m.utilisation)).toFixed(1) + '%"></i></div>' +
      '<div class="grid" style="margin-block:8px">' +
      '<div><span class="lbl">' + (m.shared ? "Shared limit" : "Total limit") + '</span><p class="mid">' +
        money(m.limit) + "</p></div>" +
      '<div><span class="lbl">Used</span><p class="mid creditc">' + money(m.poolUsed) + "</p></div>" +
      '<div><span class="lbl">Left to borrow</span><p class="mid creditc">' + money(m.available) +

        m.family.map(function (a) {
          var own = cardOutstanding(a) + emiLeft(a.id);

    }

      h += '<div class="note"><span aria-hidden="true">\ud83d\udcc5</span><div>' +

      "</div></div></div>";
  }

  h += "<table>";
  if (s.id === "before" || s.id === "expected") {
    h += row2("Current outstanding", money(m.outstanding)) +
      row2("Not yet billed", money(m.unbilled));
    if (m.limit > 0) h += row2("Available credit", money(m.available));
  } else {
    h += row2("Statement balance", money(m.statementBalance)) +
      row2("Amount paid", money(m.statementPaid)) +
      row2("Remaining amount", money(m.statementRemaining));
    if (m.minDue > 0) h += row2(s.id === "overdue" ? "Minimum still due" : "Minimum amount due",
      money(s.id === "paid" ? m.minDue : m.minRemaining));
    h += row2("Current outstanding", money(m.outstanding)) +
      row2("Of that, not yet billed", money(m.unbilled));
  }
  h += "</table>";

  if (s.id === "before") {

    h += '<p class="sub" style="margin-block-start:8px">' + esc(dayPhrase("Bill generates", days)) +
      " · expected " + esc(fDateLong(s.nextClose)) +
      (closingAdjusted(card, s.nextClose) ? " (moved to the last day of that month)" : "") + "</p>" +
      '<div class="btns" style="margin-block-start:8px">' +
      '<button type="button" class="btn g s" data-act="openCard" data-id="' + esc(card.id) + '">Open card</button>' +
      '<button type="button" class="btn g s" data-act="cardCycle" data-id="' + esc(card.id) + '">This billing cycle</button>' +

      '<button type="button" class="btn g s" data-act="openStmt" data-id="' + esc(st.id) + '">View statement</button>' +
      '<button type="button" class="btn g s" data-act="openCard" data-id="' + esc(card.id) + '">Open card</button></div>';

/* ---------- downloads ---------- */
function cycleCsv(card, from, to) {
  var a = cardActivity(card.id, from, to);
  var lines = [];
  lines.push(q("Credit card billing cycle"));
  lines.push([q("Card"), q(card.name + (card.last4 ? " ****" + card.last4 : ""))].join(","));
  lines.push([q("Cycle from"), q(from || "since the card was added"), q("Cycle to"), q(to)].join(","));
  lines.push([q("Currency"), q(currencyWord()), q("Generated"), q(fStamp(stamp()))].join(","));
  lines.push("");
  lines.push([q("Purchases and charges"), q(plainMoney(a.charges))].join(","));
  lines.push([q("Refunds received"), q(plainMoney(a.refunds))].join(","));
  lines.push([q("Payments made"), q(plainMoney(a.payments))].join(","));
  lines.push([q("Cycle total"), q(plainMoney(a.net))].join(","));
  var m = cardMoney(card);
  lines.push([q("Current outstanding"), q(plainMoney(m.outstanding))].join(","));
  lines.push([q("Not yet billed"), q(plainMoney(m.unbilled))].join(","));
  lines.push([q("Credit limit"), q(m.limit ? plainMoney(m.limit) : "not set")].join(","));
  lines.push([q("Available credit"), q(m.available === null ? "not known" : plainMoney(m.available))].join(","));
  lines.push([q("Utilisation %"), q(m.utilisation === null ? "not known" : m.utilisation.toFixed(2))].join(","));
  lines.push("");
  lines.push([q("Date"), q("Time"), q("Description"), q("Category"), q("Kind"), q("Card used"),
    q("Amount"), q("Refunded"), q("Net"), q("Status")].join(","));
  sortTx(a.rows).forEach(function (t) {
    lines.push([q(t.date), q(t.noTime ? "" : t.time || ""), q(txTitle(t)), q(t.cat || ""),
      q(t.type === "bill" ? "Payment" : t.charge ? "Charge" : "Purchase"),
      q(t.type === "out" ? (channelLabel(t.channel) || "Not noted") : ""),
      q(plainMoney(t.amt)), q(plainMoney(refundTotal(t))),
      q(plainMoney(t.type === "out" ? netSpend(t) : t.amt)), q(longStatus(t))].join(","));
  });
  return lines.join("\r\n");
}
function stmtCsv(st) {
  var card = acc(st.cardId);
  var lines = [];
  lines.push(q("Credit card statement"));
  lines.push([q("Card"), q(card ? card.name : "Card")].join(","));
  lines.push([q("Statement closed"), q(st.closeDate), q("Payment due"), q(st.dueDate || "")].join(","));
  lines.push([q("Cycle from"), q(st.cycleFrom || ""), q("Cycle to"), q(st.closeDate)].join(","));
  lines.push([q("Confirmed by user at"), q(st.confirmedAt || "")].join(","));
  lines.push("");
  [["Previous balance", st.prevBalance], ["New purchases", st.purchases], ["Fees", st.fees],
   ["Interest", st.interest], ["EMI", st.emi], ["Refunds and credits", st.credits],
   ["Past due", st.pastDue], ["Statement balance", st.balance], ["Minimum amount due", st.minDue],
   ["Paid so far", paidOnStatement(st.id)], ["Credits after closing", statementCredits(st)],
   ["Remaining amount", statementRemaining(st)], ["Minimum still due", minStillDue(st)]
  ].forEach(function (r) { lines.push([q(r[0]), q(plainMoney(r[1] || 0))].join(",")); });
  lines.push([q("Status"), q(stateWords(statementState(st)))].join(","));
  lines.push("");
  lines.push([q("Transactions in this statement")].join(","));
  lines.push([q("Date"), q("Description"), q("Category"), q("Amount"), q("Net")].join(","));
  cardActivity(st.cardId, st.cycleFrom || "", st.closeDate).rows
    .filter(function (t) { return t.type === "out"; })
    .forEach(function (t) {
      lines.push([q(t.date), q(txTitle(t)), q(t.cat || ""), q(plainMoney(t.amt)), q(plainMoney(netSpend(t)))].join(","));
    });
  lines.push("");
  lines.push([q("Payments against this statement")].join(","));
  lines.push([q("Date"), q("From account"), q("Amount"), q("Reference")].join(","));
  statementPayments(st.id).forEach(function (t) {
    lines.push([q(t.date), q(accName(t.acc)), q(plainMoney(t.amt)), q(t.ref || "")].join(","));
  });
  return lines.join("\r\n");
}

/* ---------- alerts for the dashboard ---------- */
function cardAlerts() {
  var out = [];
  cards().forEach(function (card) {
    var s = cardState(card), m = cardMoney(card);
    if (s.id === "expected") {
      out.push({ k:"", i:"📄", t:"<b>" + esc(card.name) + "</b> — statement expected " +
        (s.expectedDate === today() ? "today" : "on " + esc(fDateLong(s.expectedDate))) +
        ". Confirm what was actually billed.", card: card.id });
    } else if (s.id === "before" && s.nextClose) {
      var d = daysBetweenIso(today(), s.nextClose);
      if (d <= 3) out.push({ k:"", i:"💳", t:esc(card.name) + " — " + esc(dayPhrase("bill generates", d)) + ".", card: card.id });
    } else if (s.statement) {
      var st = s.statement, dd = st.dueDate ? daysBetweenIso(today(), st.dueDate) : null;
      if (s.id === "overdue") {
        out.push({ k:"bad", i:"🔴", t:"<b>" + esc(card.name) + "</b> payment is " +
          esc(dayPhrase("", dd, "overdue by").trim()) + " — " + money(statementRemaining(st)) + " still to pay.", card: card.id });
      } else if (dd !== null && dd <= 7 && statementRemaining(st) > 0) {
        out.push({ k:"", i:"💳", t:esc(card.name) + " — " + esc(dayPhrase("payment due", dd)) + ", " +
          money(statementRemaining(st)) + " to pay.", card: card.id });
      }
    }
    if (m.utilisation !== null && m.utilisation >= 70) {
      out.push({ k:"", i:"📈", t:"You've used " + m.utilisation.toFixed(0) + "% of your " +
        esc(card.name) + " limit.", card: card.id });
    }
  });
  return out;
}

/* =========================================================
   RECEIPTS AND SCREENSHOTS
   ---------------------------------------------------------
   The golden rule: a transaction is dated by WHEN THE MONEY MOVED,
   read from inside the bill — never by when the screenshot was
   taken, uploaded, or when the record was saved.
   Order date, payment date, invoice date and delivery date are all
   kept, because returns, warranties and refunds need them.
   ========================================================= */

var DATE_KINDS = [
  { id:"payment",  label:"Payment date",  hint:"When the money was actually charged" },
  { id:"order",    label:"Order date",    hint:"When you placed the order" },
  { id:"invoice",  label:"Invoice date",  hint:"The date printed on the invoice" },
  { id:"delivery", label:"Delivery date", hint:"When it arrived" }
];
var MONTH_WORDS = {
  jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3, may:4,
  jun:5, june:5, jul:6, july:6, aug:7, august:7, sep:8, sept:8, september:8,
  oct:9, october:9, nov:10, november:10, dec:11, december:11
};
/* =========================================================
   TYPE IT IN — one line becomes an entry
   ---------------------------------------------------------

  var m = window.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])\.?m\.?/i);
  if (m) {
    var h = parseInt(m[1], 10) % 12;
    if (m[3].toLowerCase() === "p") h += 12;
    return p2(h) + ":" + m[2];
  }
  m = window.match(/\b(\d{1,2}):(\d{2})\b/);
  if (m) {
    var h2 = parseInt(m[1], 10);
    if (h2 >= 0 && h2 <= 23 && +m[2] <= 59) return p2(h2) + ":" + m[2];
  }

}
/** Pull every useful field out of pasted or typed receipt text. */
function readReceipt(text) {
  var src = String(text || "");
  var low = src.toLowerCase();
  var out = { dates: {}, times: {}, amount: 0, merchant: "", cat: "", order: "", notes: [] };

  /* dates, labelled by the words that sit just before them */
  var labels = [
    { key:"payment",  re:/(payment|paid|charged|debited|txn|transaction)[^\n]{0,40}/gi },
    { key:"order",    re:/(order(ed)?\s*(placed|date|on)?)[^\n]{0,40}/gi },
    { key:"invoice",  re:/(invoice|bill)\s*(date|no|number)?[^\n]{0,40}/gi },
    { key:"delivery", re:/(deliver(ed|y)|shipped|arriv)[^\n]{0,40}/gi }
  ];
  labels.forEach(function (l) {
    var m;
    l.re.lastIndex = 0;
    while ((m = l.re.exec(src))) {
      var chunk = src.slice(m.index, m.index + 120);
      var d = findDates(chunk)[0];
      if (d && !out.dates[l.key]) {
        out.dates[l.key] = d.iso;
        var t = findTimeNear(chunk, d.at);
        if (t) out.times[l.key] = t;
      }
    }
  });
  /* any unlabelled date, as a fallback */
  if (!Object.keys(out.dates).length) {
    var any = findDates(src)[0];
    if (any) {
      out.dates.unknown = any.iso;
      var t2 = findTimeNear(src, any.at);
      if (t2) out.times.unknown = t2;
    }
  }

  /* amount: prefer a labelled total */
  var amtRe = /(grand\s*total|total\s*amount|order\s*total|amount\s*paid|you\s*paid|net\s*payable|total)[^\d₹]{0,14}(?:₹|rs\.?|inr)?\s*([\d,]+(?:\.\d{1,2})?)/gi;
  var best = 0, am;
  while ((am = amtRe.exec(src))) {
    var v = toMinor(am[2].replace(/,/g, ""));
    if (v > best) best = v;
  }
  if (!best) {
    var rupee = /(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/gi, r;
    while ((r = rupee.exec(src))) {
      var v2 = toMinor(r[1].replace(/,/g, ""));
      if (v2 > best) best = v2;
    }
  }
  out.amount = best;

  /* merchant + a sensible category */
  for (var i = 0; i < MERCHANT_HINTS.length; i++) {
    var hit = src.match(MERCHANT_HINTS[i].match);
    if (hit) {
      out.merchant = hit[0].replace(/\s+/g, " ").trim();
      out.merchant = out.merchant.charAt(0).toUpperCase() + out.merchant.slice(1);
      out.cat = MERCHANT_HINTS[i].cat;
      break;
    }
  }
  if (!out.merchant) {
    var line = src.split(/\n/).map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length > 2 && x.length < 40 && !/\d{4}/.test(x); })[0];
    if (line) out.merchant = line;
  }

  var ord = src.match(/order\s*(?:id|no\.?|number)?\s*[:#]?\s*([A-Za-z0-9\-]{6,24})/i);
  if (ord) out.order = ord[1];

  /* how it was paid, if the receipt says */
  if (/upi|google ?pay|phonepe|paytm|gpay|bhim/i.test(low)) out.how = "app";
  else if (/credit ?card/i.test(low)) out.how = "card";
  else if (/debit ?card/i.test(low)) out.how = "debit";
  else if (/net ?banking|bank transfer|neft|imps/i.test(low)) out.how = "bank";
  else if (/cash on delivery|\bcod\b|cash/i.test(low)) out.how = "cash";
  if (/rupay/i.test(low) && /upi/i.test(low)) out.channel = "upi";
  else if (/\bupi\b/i.test(low)) out.channel = "upi";
  else if (/swipe|pos |card present|in ?store|counter/i.test(low)) out.channel = "swipe";
  else if (/online|website|checkout/i.test(low)) out.channel = "online";
  /* match the app the bill names against the ones you actually use */
  for (var k = 0; k < db.apps.length; k++) {
    var nm = String(db.apps[k].name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (nm && low.replace(/[^a-z0-9]/g, "").indexOf(nm) > -1) { out.appId = db.apps[k].id; break; }
  }
  /* a shop counter receipt rather than an online order */
  if (/\bcounter\b|\bin ?store\b|\bpos\b|table no|dine ?in|cashier/i.test(low)) out.billKind = "shop";
  return out;
}
/** Which date should the transaction use, and how sure are we? */
function chooseDate(read) {
  var order = ["payment", "invoice", "order", "delivery", "unknown"];
  for (var i = 0; i < order.length; i++) {
    if (read.dates[order[i]]) {
      return { key: order[i], iso: read.dates[order[i]], time: read.times[order[i]] || "" };
    }
  }
  return null;
}

   SIGN IN
   ---------------------------------------------------------
   Honest note: this runs entirely in your browser. It keeps
   casual eyes out of the app on this device. It is NOT real
   security — anyone with the device and some know-how can read

/** Scramble a password so it is never stored as readable text. */
function scramble(pw) {
  var str = "moneytracker:" + String(pw || "");
  var a = 5381, b = 7919, i;
  for (i = 0; i < str.length; i++) a = ((a * 33) ^ str.charCodeAt(i)) >>> 0;
  for (i = str.length - 1; i >= 0; i--) b = (((b * 31) >>> 0) + str.charCodeAt(i)) >>> 0;
  return a.toString(36) + "-" + b.toString(36) + "-" + str.length;
}
function passwordProblem(pw) {
  var p = String(pw || "");
  if (p.length < 8) return "Use at least 8 characters.";
  if (!/[A-Za-z]/.test(p)) return "Include at least one letter.";
  if (!/[0-9]/.test(p)) return "Include at least one number.";
  return "";
}
function usernameProblem(u) {

  if (v.length > 24) return "Username is too long.";
  if (!/^[A-Za-z0-9._-]+$/.test(v)) return "Use letters, numbers, dot, underscore or hyphen only.";
  return "";

  if (isNaN(d.getTime())) return "That date doesn't look right.";
  if (iso > today()) return "That date is in the future.";
  var years = (now - d) / (365.25 * 86400000);
  if (years > 120) return "That date doesn't look right.";

/* ---------- actions ---------- */
function authAct(name) {
  var v = grabAuth(), a = ui.auth;
  a.error = ""; a.info = "";

  if (name === "auShow") { a.show = !a.show; drawAuth(); return true; }
  if (name === "auGoSignIn") { a.view = "signin"; a.stage = "ask"; drawAuth(); return true; }
  if (name === "auGoCreate") { a.view = "create"; drawAuth(); return true; }
  if (name === "auGoForgot") {
    a.view = "forgot"; a.stage = "ask";
    a.values = Object.assign(a.values || {}, { user: v.user || "" });
    drawAuth(); return true;
  }

  if (name === "auSignIn") {
    if (!sameUser(v.user, db.auth.user)) {
      a.error = "That username and password don't match.";
      a.values.pw = "";
      drawAuth(); return true;
    }
    if (isEncrypted()) {
      a.info = "Unlocking…";
      drawAuth();
      unlockWith(v.pw).then(function (okNow) {
        if (!okNow) {
          a.info = "";
          a.error = "That username and password don't match.";
          a.values.pw = "";
          drawAuth();
          return;
        }
        db.auth.lastSignIn = stamp();
        saveLocalOnly();
        hideAuth();
        afterSignIn();
      });
      return true;
    }
    if (scramble(v.pw) !== db.auth.pwHash) {
      a.error = "That username and password don't match.";
      a.values.pw = "";
      drawAuth(); return true;
    }
    db.auth.lastSignIn = stamp();
    save();
    hideAuth();
    afterSignIn();
    return true;
  }

  if (name === "auCreate") {
    var p1 = usernameProblem(v.user) || passwordProblem(v.pw) || dobProblem(v.dob);
    if (!p1 && v.pw !== v.pw2) p1 = "The two passwords don't match.";
    if (p1) { a.error = p1; drawAuth(); return true; }
    db.auth = {
      user: String(v.user).trim(), pwHash: "", dob: v.dob,
      gender: v.gender || "Prefer not to say", createdAt: stamp(), lastSignIn: stamp()
    };
    db.profile.name = String(v.user).trim();
    if (cryptoAvailable()) {
      a.info = "Setting up encryption…";
      drawAuth();
      setupEncryption(v.pw).then(function (recovery) {
        ui.recovery = recovery;
        return saveEncrypted();
      }).then(function () {
        hideAuth();
        afterSignIn();
        openSheet(recoverySheet(ui.recovery));
      });
      return true;
    }
    db.auth.pwHash = scramble(v.pw);
    save();
    hideAuth();
    afterSignIn();
    return true;
  }

  if (name === "auRecover") {
    a.info = "Checking…";
    drawAuth();
    unlockWithRecovery(String(v.recovery || "").trim().toUpperCase()).then(function (okNow) {
      a.info = "";
      if (!okNow) { a.error = "That recovery key doesn't match."; drawAuth(); return; }
      a.stage = "reset";
      a.values.pw = ""; a.values.pw2 = "";
      a.info = "Recovery key accepted. Choose a new password.";
      drawAuth();
    });
    return true;
  }
  if (name === "auCheck") {
    if (isEncrypted()) {
      a.error = "Your data is encrypted, so a birthday cannot unlock it. Use your recovery key below.";
      a.stage = "recovery";
      drawAuth(); return true;
    }
    if (!sameUser(v.user, db.auth.user) || String(v.dob) !== String(db.auth.dob)) {
      a.error = "Those details don't match the account on this device.";
      drawAuth(); return true;
    }
    a.stage = "reset";
    a.values.pw = ""; a.values.pw2 = "";
    drawAuth(); return true;
  }

  if (name === "auReset") {
    var p2 = passwordProblem(v.pw);
    if (!p2 && v.pw !== v.pw2) p2 = "The two passwords don't match.";
    if (p2) { a.error = p2; drawAuth(); return true; }
    if (isEncrypted() && isUnlocked()) {
      a.info = "Re-encrypting with your new password…";
      drawAuth();
      setupEncryption(v.pw).then(function (recovery) {
        ui.recovery = recovery;
        db.auth.pwHash = "";
        db.auth.changedAt = stamp();
        return saveEncrypted();
      }).then(function () {
        a.view = "signin"; a.stage = "ask";
        a.values = { user: db.auth.user, pw: "" };
        a.info = "Password changed. Write down your NEW recovery key after signing in.";
        drawAuth();
      });
      return true;
    }
    db.auth.pwHash = scramble(v.pw);
    db.auth.changedAt = stamp();
    save();
    a.view = "signin"; a.stage = "ask";
    a.values = { user: db.auth.user, pw: "" };
    a.info = "Password changed. Sign in with your new password.";
    drawAuth(); return true;
  }
  return false;
}
function afterSignIn() {
  runBills(true);
  if (syncReady()) { pullFromGithub(true); startSyncTimer(); }
  paintSync();
  render();
  if (db.settings.pin) showLock();
  if (!db.settings.setupDone) startSetup();
}
function signOut() {
  lockUp();
  ui.authed = false;
  ui.auth = null;
  closeSheet();
  showAuth("signin");
}

/* =========================================================
   ENCRYPTION
   ---------------------------------------------------------
   Real encryption, using the browser's own Web Crypto API.
     - your password is stretched into a key with PBKDF2
       (310,000 rounds, deliberately slow to guess)
     - everything is then encrypted with AES-GCM, 256-bit
     - a fresh random salt per install, fresh random IV per save
   The password itself is NEVER stored, anywhere.
   Without it, the saved data is unreadable — including by me,
   by GitHub, and by anyone who picks up your phone.
   ========================================================= */

var CRYPTO_KEY = "moneytracker.enc";   /* the encrypted blob */
var CRYPTO_META = "moneytracker.meta"; /* salt + settings, not secret */
var PBKDF2_ROUNDS = 310000;

var cryptoKey = null;      /* the derived key, held only while signed in */
var cryptoMaster = null;   /* raw master key bytes, memory only */
var cryptoSalt = null;

function webCrypto() {
  return (typeof crypto !== "undefined" && crypto.subtle) ? crypto : null;
}
function cryptoAvailable() { return !!webCrypto(); }

function randomBytes(n) {
  var a = new Uint8Array(n);
  webCrypto().getRandomValues(a);
  return a;
}
function bytesToB64(bytes) {
  var s = "", i;
  for (i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBytes(b64) {
  var s = atob(b64), a = new Uint8Array(s.length), i;
  for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function textBytes(str) {
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(str);
  var utf = unescape(encodeURIComponent(str)), a = new Uint8Array(utf.length), i;
  for (i = 0; i < utf.length; i++) a[i] = utf.charCodeAt(i);
  return a;
}
function bytesText(bytes) {
  if (typeof TextDecoder !== "undefined") return new TextDecoder().decode(bytes);
  var s = "", i;
  for (i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return decodeURIComponent(escape(s));
}

/** Stretch a password into an AES key. Slow on purpose. */
function deriveKey(password, salt) {
  var c = webCrypto();
  return c.subtle.importKey("raw", textBytes(password), { name: "PBKDF2" }, false, ["deriveKey"])
    .then(function (base) {
      return c.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: PBKDF2_ROUNDS, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    });
}
function encryptWith(key, plainText) {
  var c = webCrypto(), iv = randomBytes(12);
  return c.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, textBytes(plainText))
    .then(function (buf) {
      return { v: 1, alg: "AES-GCM", kdf: "PBKDF2-SHA256", rounds: PBKDF2_ROUNDS,
        iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(buf)) };
    });
}
function decryptWith(key, blob) {
  var c = webCrypto();
  return c.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.data))
    .then(function (buf) { return bytesText(new Uint8Array(buf)); });
}

/* ---------- what the app calls ---------- */
function readMeta() {
  try {
    var raw = localStorage.getItem(CRYPTO_META);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeMeta(meta) {
  try { localStorage.setItem(CRYPTO_META, JSON.stringify(meta)); } catch (e) {}
}
function isEncrypted() {
  var m = readMeta();
  return !!(m && m.salt);
}
/** First-time setup.
    A random master key encrypts the data. That master key is then wrapped
    twice: once with your password, once with the recovery key. Either one
    opens the same vault — and changing the password only re-wraps the key. */
function setupEncryption(password) {
  if (!cryptoAvailable()) return Promise.reject(new Error("This browser has no encryption support"));
  var meta = readMeta();
  var salt = meta && meta.salt ? b64ToBytes(meta.salt) : randomBytes(16);
  var master = cryptoMaster || randomBytes(32);
  var recovery = makeRecoveryKey();
  var out = { salt: bytesToB64(salt), rounds: PBKDF2_ROUNDS, alg: "AES-GCM", createdAt: stamp() };
  return deriveKey(password, salt).then(function (pk) {
    return encryptWith(pk, bytesToB64(master));
  }).then(function (wrapped) {
    out.byPassword = wrapped;
    return deriveKey(recovery, salt);
  }).then(function (rk) {
    return encryptWith(rk, bytesToB64(master));
  }).then(function (wrapped2) {
    out.byRecovery = wrapped2;
    return importMaster(master);
  }).then(function (key) {
    cryptoKey = key;
    cryptoMaster = master;
    cryptoSalt = salt;
    writeMeta(out);
    return recovery;
  });
}
function importMaster(masterBytes) {
  return webCrypto().subtle.importKey("raw", masterBytes, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
}
/** Open the vault with either the password or the recovery key. */
function unwrapWith(secret, which) {

    return decryptWith(k, meta[which]);
  }).then(function (masterB64) {
    var master = b64ToBytes(masterB64);
    return importMaster(master).then(function (key) {
      cryptoKey = key;
      cryptoMaster = master;
      cryptoSalt = salt;

      try { raw = localStorage.getItem(CRYPTO_KEY); } catch (e) { raw = null; }
      if (!raw) return true;
      var blob;
      try { blob = JSON.parse(raw); } catch (e) { return true; }
      return decryptWith(key, blob).then(function (text) {
        applyLoaded(JSON.parse(text));
        return true;

}

}
function makeRecoveryKey() {
  var bytes = randomBytes(15), out = [], i;
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; /* no look-alikes */
  for (i = 0; i < bytes.length; i++) out.push(chars[bytes[i] % chars.length]);

}
function lockUp() { cryptoKey = null; cryptoMaster = null; cryptoSalt = null; }
function isUnlocked() { return !!cryptoKey; }

/** Encrypt and store. Called after every change. */
function saveEncrypted() {
  if (!cryptoKey) return Promise.resolve(false);
  var text = JSON.stringify(db);
  return encryptWith(cryptoKey, text).then(function (blob) {
    try {
      localStorage.setItem(CRYPTO_KEY, JSON.stringify(blob));
      localStorage.removeItem(KEY); /* remove any old readable copy */
      return true;
    } catch (e) { return false; }
  });
}
/** Produce the blob to put in GitHub — encrypted, safe to publish. */
function encryptedBlob() {
  if (!cryptoKey) return Promise.reject(new Error("locked"));
  var meta = readMeta() || {};
  return encryptWith(cryptoKey, JSON.stringify(db)).then(function (blob) {
    return JSON.stringify({
      app: "money-tracker",
      note: "Encrypted with AES-GCM. Unreadable without the key that unlocks it.",
      salt: meta.salt, rounds: meta.rounds || PBKDF2_ROUNDS,
      byPassword: meta.byPassword, byRecovery: meta.byRecovery,
      updatedAt: stamp(), device: deviceName(),
      payload: blob

/** Read a blob that came from GitHub. */
function openBlob(text, password) {
  var outer;
  try { outer = JSON.parse(text); } catch (e) { return Promise.resolve(null); }
  if (!outer || !outer.payload || !outer.salt) return Promise.resolve(null);
  var salt = b64ToBytes(outer.salt);
  var getKey;
  if (password && outer.byPassword) {
    getKey = deriveKey(password, salt)
      .then(function (pk) { return decryptWith(pk, outer.byPassword); })
      .then(function (b64) { return importMaster(b64ToBytes(b64)); });
  } else if (cryptoKey) {
    getKey = Promise.resolve(cryptoKey);
  } else {
    return Promise.resolve(null);
  }
  return getKey.then(function (key) {
    return decryptWith(key, outer.payload).then(function (plain) {
      return { data: JSON.parse(plain), updatedAt: outer.updatedAt, device: outer.device };
    });
  }).catch(function () { return null; });
}
function deviceName() {
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  if (/android/i.test(ua)) return "Android phone";
  if (/iphone|ipad/i.test(ua)) return "iPhone or iPad";
  if (/mac/i.test(ua)) return "Mac";
  if (/windows/i.test(ua)) return "Windows PC";
  return "this device";
}

/* =========================================================
   GITHUB SYNC
   ---------------------------------------------------------
   Your data lives in GitHub as an encrypted file.
     READING is automatic — the app fetches it on open and every
     few minutes. No token, no login, nothing to leak.
     WRITING is three clicks — copy, paste, commit. That is
     deliberate: writing automatically would need an access token
     inside this page, which anyone could read from the source,
     and which GitHub would auto-revoke anyway.
   Everything sent to GitHub is already encrypted. GitHub only
   ever holds ciphertext.
   ========================================================= */

function syncCfg() {
  db.sync = db.sync || { user:"", repo:"", branch:"main", file:"data.json.enc",
    on:false, auto:false, lastPull:"", lastPush:"", lastSeen:"", sha:"" };
  if (db.sync.auto === undefined) db.sync.auto = false;
  return db.sync;
}
function syncReady() {
  var c = syncCfg();
  return !!(c.on && c.user && c.repo && c.file);
}
/* The token and passphrase live only in this browser's storage.
   They are NEVER part of the published page and never leave the device
   except as an Authorization header to github.com. */
var TOKEN_KEY = "moneytracker.token";
var PHRASE_KEY = "moneytracker.phrase";
function savedToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
}
function setToken(v) {
  try {
    if (v) localStorage.setItem(TOKEN_KEY, v);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}
function savedPhrase() {
  try { return localStorage.getItem(PHRASE_KEY) || ""; } catch (e) { return ""; }
}
function setPhrase(v) {
  try {
    if (v) localStorage.setItem(PHRASE_KEY, v);
    else localStorage.removeItem(PHRASE_KEY);
  } catch (e) {}
}
function canWrite() { return !!(savedToken() && syncReady()); }
/** Derive the encryption key from the saved passphrase. Runs on open. */
function unlockSync() {
  var phrase = savedPhrase();
  if (!phrase || !cryptoAvailable()) return Promise.resolve(false);
  if (isUnlocked()) return Promise.resolve(true);
  if (!isEncrypted()) {
    return setupEncryption(phrase).then(function () { return true; })
      .catch(function () { return false; });
  }
  return unlockWith(phrase).then(function (okNow) {
    if (okNow) return true;
    /* the local vault is from a different phrase — rebuild it from this one */
    return setupEncryption(phrase).then(function () { return true; })
      .catch(function () { return false; });
  });
}
function rawUrl() {
  var c = syncCfg();
  return "https://raw.githubusercontent.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/" + encodeURIComponent(c.branch || "main") + "/" + c.file;
}
function apiUrl() {
  var c = syncCfg();
  return "https://api.github.com/repos/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/contents/" + c.file;
}
function editUrl() {
  var c = syncCfg();
  return "https://github.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/edit/" + encodeURIComponent(c.branch || "main") + "/" + c.file;
}
function newFileUrl() {
  var c = syncCfg();
  return "https://github.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/new/" + encodeURIComponent(c.branch || "main");
}
function b64encode(text) {
  var bytes = textBytes(text), bin = "", i;
  for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

/** Write the encrypted file straight to GitHub. Needs the saved token. */
function autoPush() {
  var c = syncCfg();
  if (!canWrite() || !isUnlocked()) return Promise.resolve("noauth");
  if (ui.pushing) { ui.pushAgain = true; return Promise.resolve("busy"); }
  ui.pushing = true;
  ui.syncState = "saving";
  paintSync();
  return encryptedBlob().then(function (text) {
    var body = {
      message: "Update tracker data (" + deviceName() + ")",
      content: b64encode(text),
      branch: c.branch || "main"
    };
    if (c.sha) body.sha = c.sha;
    return fetch(apiUrl(), {
      method: "PUT",
      headers: { "Authorization": "Bearer " + savedToken(),
                 "Accept": "application/vnd.github+json",
                 "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  }).then(function (res) {
    if (res.status === 409 || res.status === 422) {
      /* someone else wrote first — refresh the file id and retry once */
      return refreshSha().then(function () {
        ui.pushing = false;
        return autoPush();
      });
    }
    if (!res.ok) throw new Error("http " + res.status);
    return res.json().then(function (out) {
      c.sha = out && out.content ? out.content.sha : c.sha;
      c.lastPush = stamp();
      c.lastSeen = c.lastPush;
      saveLocalOnly();
      ui.pushing = false;
      ui.syncState = "ok";
      paintSync();
      if (ui.pushAgain) { ui.pushAgain = false; autoPush(); }
      return "saved";
    });
  }).catch(function (e) {
    ui.pushing = false;
    ui.syncState = String(e.message).indexOf("401") > -1 ? "badtoken" : "offline";
    paintSync();
    return "failed";
  });
}
function refreshSha() {
  var c = syncCfg();
  if (!savedToken()) return Promise.resolve();
  return fetch(apiUrl() + "?ref=" + encodeURIComponent(c.branch || "main"), {
    headers: { "Authorization": "Bearer " + savedToken(), "Accept": "application/vnd.github+json" },
    cache: "no-store"
  }).then(function (res) {
    if (!res.ok) return null;
    return res.json();
  }).then(function (out) {
    if (out && out.sha) { c.sha = out.sha; saveLocalOnly(); }
  }).catch(function () {});
}
/** Save automatically, a moment after you stop making changes. */
function scheduleAutoPush() {
  var c = syncCfg();
  if (!c.auto || !canWrite()) return;
  if (typeof setTimeout !== "function") return;
  clearTimeout(ui.pushTimer);
  ui.syncState = "ahead";
  paintSync();
  ui.pushTimer = setTimeout(function () {
    if (isUnlocked()) autoPush();
  }, 2500);
}

/** Fetch the encrypted file from GitHub and merge it in if it is newer. */
function pullFromGithub(quiet) {
  if (!syncReady()) return Promise.resolve("off");
  if (!isUnlocked()) return Promise.resolve("locked");
  if (typeof fetch !== "function") return Promise.resolve("nofetch");
  ui.syncState = "checking";
  paintSync();
  /* cache-buster so the browser never serves a stale copy */
  return fetch(rawUrl() + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("http " + res.status);
      return res.text();
    })
    .then(function (text) {
      if (!text) { ui.syncState = "empty"; paintSync(); return "empty"; }
      return openBlob(text).then(function (opened) {
        if (!opened) { ui.syncState = "badkey"; paintSync(); return "badkey"; }
        var c = syncCfg();
        var mine = c.lastPush || "";
        var theirs = opened.updatedAt || "";
        if (theirs && theirs <= (c.lastSeen || "")) {
          ui.syncState = "ok"; c.lastPull = stamp(); paintSync(); return "same";
        }
        /* the copy in GitHub is newer than anything this device has sent */
        if (!mine || theirs > mine) {
          var keepSync = JSON.parse(JSON.stringify(c));
          applyLoaded(opened.data);
          db.sync = keepSync;
          c = db.sync;
          c.lastSeen = theirs;
          c.lastPull = stamp();
          saveLocalOnly();
          ui.syncState = "ok";
          render();
          paintSync();
          toast("Updated from GitHub" + (opened.device ? " (saved on " + opened.device + ")" : ""));
          return "pulled";
        }
        ui.syncState = "ahead";
        c.lastPull = stamp();
        paintSync();
        return "ahead";
      });
    })
    .catch(function () { ui.syncState = "offline"; paintSync(); return "offline"; });
}

/** Put the encrypted blob on the clipboard and open GitHub's editor. */
function pushToGithub() {
  if (!syncReady()) { toast("Set up GitHub sync first"); return Promise.resolve(false); }
  if (!isUnlocked()) { toast("Unlock the app first"); return Promise.resolve(false); }
  return encryptedBlob().then(function (text) {
    var c = syncCfg();
    c.lastPush = stamp();
    c.lastSeen = c.lastPush;
    saveLocalOnly();
    return copyText(text).then(function (copied) {
      openSheet(pushSheet(copied, text.length));
      return true;
    });
  });
}
function copyText(text) {
  try {
    if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return false; });
    }
  } catch (e) {}
  return Promise.resolve(false);
}

/* =========================================================
   WHAT YOU HAVE, WHAT YOU OWE, WHAT YOU CAN SPEND
   ---------------------------------------------------------
   Kept deliberately separate, because they answer different
   questions:
     spendable  — cash and bank money you can actually use
     set aside  — FD and savings pots, yours but not for spending
     invested   — mutual funds, not spending money at all
     owed       — credit card outstanding, money you must pay back
   ========================================================= */

function pots() { db.pots = db.pots || []; return db.pots; }
function funds() { db.funds = db.funds || []; return db.funds; }
function pot(x) {
  var list = pots();
  for (var i = 0; i < list.length; i++) if (list[i].id === x) return list[i];
  return null;
}
function fund(x) {
  var list = funds();
  for (var i = 0; i < list.length; i++) if (list[i].id === x) return list[i];
  return null;
}
function spendAccounts() {

}

/* =========================================================
   WHAT CHANGED, AND WHY
   ---------------------------------------------------------
   Every number here is derived from recorded transactions.
   When the history is too short to support a claim, the
   claim is not made — the app says so instead.
   ========================================================= */
function monthList(mk, n) {
  var out = [];
  for (var i = 1; i <= n; i++) out.push(mShift(mk, -i));
  return out;
}
/** Spending only — savings, investments and card bills excluded. */
function spendIn(mk, cat) {
  return db.tx.filter(function (t) {
    if (mOf(t.date) !== mk) return false;
    if (t.potId || t.fundId) return false;
    if (cat && t.cat !== cat) return false;
    return true;
  }).reduce(function (s, t) { return s + netSpend(t); }, 0);
}
function txIn2(mk, cat) {
  return db.tx.filter(function (t) {
    if (mOf(t.date) !== mk) return false;
    if (t.potId || t.fundId) return false;
    if (cat && t.cat !== cat) return false;
    return netSpend(t) > 0;
  });
}
/** Which months actually hold data — never average over months you did not use. */
function monthsWithData() {
  var seen = {};
  db.tx.forEach(function (t) { if (t.date) seen[mOf(t.date)] = 1; });
  return Object.keys(seen).sort();
}
function haveMonth(mk) { return monthsWithData().indexOf(mk) > -1; }

/** Average of the last n months that actually have data. Reports how many it used. */
function averageOver(mk, n, cat) {
  var months = monthList(mk, n).filter(haveMonth);
  if (!months.length) return { avg: 0, used: 0, months: [] };
  var total = months.reduce(function (s, m) { return s + spendIn(m, cat); }, 0);
  return { avg: Math.round(total / months.length), used: months.length, months: months };
}
/** Compare like with like when the month is still running. */
function elapsedShare(mk) {
  var now = new Date();
  if (mk !== mKey(now)) return 1;
  return now.getDate() / mDays(mk);
}
/** One comparison, stated honestly. */
function compare(mk, cat, kind) {
  var now = spendIn(mk, cat);
  var base = null, label = "", used = 0;
  if (kind === "prev") {
    var pm = mShift(mk, -1);
    if (!haveMonth(pm)) return { ok: false, why: "no previous month recorded", kind: kind };
    base = spendIn(pm, cat); label = "last month"; used = 1;
  } else if (kind === "avg3" || kind === "avg6") {
    var n = kind === "avg3" ? 3 : 6;
    var a = averageOver(mk, n, cat);
    if (!a.used) return { ok: false, why: "no earlier months recorded", kind: kind };
    base = a.avg; used = a.used;
    label = a.used === n ? "your " + n + "-month average"
      : "your average of the " + a.used + " month" + (a.used === 1 ? "" : "s") + " before";
  } else if (kind === "year") {
    var ym = mShift(mk, -12);
    if (!haveMonth(ym)) return { ok: false, why: "no data from a year ago", kind: kind };
    base = spendIn(ym, cat); label = mLabel(ym); used = 1;
  }
  var share = elapsedShare(mk);
  var partial = share < 1;
  var fairBase = partial ? Math.round(base * share) : base;
  var diff = now - fairBase;
  /* A percentage off a zero base is meaningless — say so rather than print infinity. */
  var pct = fairBase > 0 ? (diff / fairBase) * 100 : null;
  return {
    ok: true, kind: kind, label: label, cat: cat || "", mk: mk,
    now: now, base: base, fairBase: fairBase, diff: diff, pct: pct,
    partial: partial, share: share, used: used,
    isNew: fairBase === 0 && now > 0,
    stopped: now === 0 && fairBase > 0,
    /* rank by rupees, not percent: 10% of 20,000 matters more than 50% of 100 */
    weight: Math.abs(diff)
  };
}
/** Plain words for a comparison. */
function compareWords(c) {
  if (!c.ok) return "";
  var what = c.cat || "Spending";
  if (c.isNew) return what + " is new this month at " + money(c.now) +
    " \u2014 there was none in " + c.label + ".";
  if (c.stopped) return "You spent nothing on " + what.toLowerCase() + " this month, down from " +
    money(c.base) + " in " + c.label + ".";
  if (c.diff === 0) return what + " is exactly level with " + c.label + " at " + money(c.now) + ".";
  var dir = c.diff > 0 ? "up" : "down";
  var s = what + " is " + dir + " " + money(Math.abs(c.diff));
  if (c.pct !== null && Math.abs(c.pct) >= 1) s += " (" + (c.pct > 0 ? "+" : "") + Math.round(c.pct) + "%)";
  s += " against " + c.label;
  if (c.partial) s += ", comparing the same stretch of days";
  return s + ".";
}

/* ---------- why it changed ---------- */
/** Look for a real driver. Returns null rather than guessing. */
function explainChange(mk, cat) {
  var pm = mShift(mk, -1);
  if (!haveMonth(pm)) return null;
  var nowTx = txIn2(mk, cat), oldTx = txIn2(pm, cat);
  var nowSum = nowTx.reduce(function (s, t) { return s + netSpend(t); }, 0);
  var oldSum = oldTx.reduce(function (s, t) { return s + netSpend(t); }, 0);
  var diff = nowSum - oldSum;
  if (!diff) return null;
  var nowAvg = nowTx.length ? Math.round(nowSum / nowTx.length) : 0;
  var oldAvg = oldTx.length ? Math.round(oldSum / oldTx.length) : 0;
  var reasons = [];

  /* one purchase far bigger than the rest */
  var biggest = nowTx.slice().sort(function (a, b) { return netSpend(b) - netSpend(a); })[0];
  if (biggest && diff > 0 && netSpend(biggest) >= Math.abs(diff) * 0.6 && nowTx.length > 1) {
    reasons.push({
      kind: "one-off", weight: netSpend(biggest),
      text: "One purchase of " + money(netSpend(biggest)) +
        (biggest.note ? " (" + String(biggest.note).slice(0, 40) + ")" : "") +
        " accounts for most of it.",
      tx: [biggest.id]
    });
  }
  /* more or fewer purchases */
  if (nowTx.length !== oldTx.length) {
    var n = Math.abs(nowTx.length - oldTx.length);
    reasons.push({
      kind: "count", weight: Math.abs(n * (oldAvg || nowAvg)),
      text: "You made " + n + " " + (nowTx.length > oldTx.length ? "more" : "fewer") +
        " purchase" + (n === 1 ? "" : "s") + " than last month (" +
        nowTx.length + " against " + oldTx.length + ").",
      tx: nowTx.map(function (t) { return t.id; })
    });
  }
  /* each purchase costing more or less */
  if (oldAvg > 0 && nowAvg > 0 && Math.abs(nowAvg - oldAvg) > oldAvg * 0.1) {
    reasons.push({
      kind: "average", weight: Math.abs((nowAvg - oldAvg) * nowTx.length),
      text: "Your average purchase moved from " + money(oldAvg) + " to " + money(nowAvg) + ".",
      tx: nowTx.map(function (t) { return t.id; })
    });
  }
  /* one merchant or note driving it */
  var byName = {};
  nowTx.forEach(function (t) {
    var k = merchantKey(t);
    if (!k) return;
    byName[k] = (byName[k] || 0) + netSpend(t);
  });
  var names = Object.keys(byName).sort(function (a, b) { return byName[b] - byName[a]; });
  if (names.length && diff > 0 && byName[names[0]] >= Math.abs(diff) * 0.5) {
    reasons.push({
      kind: "merchant", weight: byName[names[0]],
      text: money(byName[names[0]]) + " of it went to " + names[0] + ".",
      tx: nowTx.filter(function (t) { return merchantKey(t) === names[0]; })
             .map(function (t) { return t.id; })
    });
  }
  if (!reasons.length) {
    return { diff: diff, reasons: [], plain: "No single cause stands out \u2014 it is spread across " +
      nowTx.length + " purchase" + (nowTx.length === 1 ? "" : "s") + ".", tx: nowTx.map(function (t) { return t.id; }) };
  }
  reasons.sort(function (a, b) { return b.weight - a.weight; });
  return { diff: diff, reasons: reasons, plain: reasons[0].text, tx: reasons[0].tx };
}

/* ---------- the month, in short ---------- */
/** Every category that moved, biggest rupee change first. */
function categoryMoves(mk, kind) {
  var cats = {};
  [mk, mShift(mk, -1)].forEach(function (m) {
    txIn2(m).forEach(function (t) { if (t.cat) cats[t.cat] = 1; });
  });
  return Object.keys(cats).map(function (c) {
    return compare(mk, c, kind || "prev");
  }).filter(function (c) {
    return c.ok && c.diff !== 0;
  }).sort(function (a, b) { return b.weight - a.weight; });
}
/** Things that genuinely went well. Only claims what the data shows. */
function goodNews(mk) {
  var out = [];
  var moves = categoryMoves(mk, "prev");
  moves.filter(function (c) { return c.diff < 0; }).slice(0, 3).forEach(function (c) {
    out.push({ kind: "down", text: "You spent " + money(Math.abs(c.diff)) + " less on " +
      c.cat.toLowerCase() + " than last month.", weight: Math.abs(c.diff) });
  });
  /* budgets kept, several months running */
  Object.keys(db.budgets || {}).forEach(function (cat) {
    var lim = Math.round(db.budgets[cat] || 0);
    if (lim <= 0) return;
    var run = 0;
    for (var i = 1; i <= 6; i++) {
      var m = mShift(mk, -i);
      if (!haveMonth(m)) break;
      if (spendIn(m, cat) <= lim) run++; else break;
    }
    if (run >= 2) out.push({ kind: "budget", weight: lim,
      text: "You stayed inside your " + cat.toLowerCase() + " budget " + run + " months running." });
  });
  /* every card bill paid on time */
  var late = db.statements.filter(function (s) {
    return s.dueDate && s.dueDate < today() && statementRemaining(s) > 0;
  });
  if (db.statements.length && !late.length) {
    out.push({ kind: "cards", weight: 1,
      text: "Every card bill you have recorded was settled before its due date." });
  }
  /* refunds actually recovered */
  var got = db.tx.filter(function (t) { return mOf(t.date) === mk; })
    .reduce(function (s, t) { return s + refundTotal(t); }, 0);
  if (got > 0) out.push({ kind: "refund", weight: got,
    text: "You got " + money(got) + " back in refunds this month." });
  return out.sort(function (a, b) { return b.weight - a.weight; });
}

/* ---------- what each category is FOR ----------
   Essential      you cannot easily avoid it this month (rent, bills, health)
   Flexible       you control the amount, not whether (groceries, travel, fuel)
   Discretionary  you could skip it entirely (fun, shopping, eating out)
   Savings        money you keep, not money you lose
   Debt           repayments
   Investment     SIPs and funds
   Nothing is guessed at spend time: a category with no role behaves as Flexible. */
/* Each role owns one colour and keeps it on every page. A colour that moves
   about \u2014 teal on Home, orange in Reports \u2014 teaches nothing, because the
   reader has to re-learn the key each time. These never shift. */
var ROLES = [
  { id:"essential",     label:"Essential",     icon:"\ud83d\udd12", hint:"hard to avoid this month", c:"#3b82f6" },
  { id:"flexible",      label:"Flexible",      icon:"\u2696\ufe0f", hint:"you control the amount",    c:"#6366f1" },
  { id:"discretionary", label:"Discretionary", icon:"\u2728",        hint:"you could skip it",         c:"#f97316" },
  { id:"savings",       label:"Savings",       icon:"\ud83d\udcb0", hint:"kept, not spent",           c:"#22c55e" },
  { id:"debt",          label:"Debt",          icon:"\ud83c\udfe6", hint:"repayments",                c:"#f43f5e" },
  { id:"investment",    label:"Investment",    icon:"\ud83d\udcc8", hint:"put to work",               c:"#14b8a6" }
];
function roleColour(id) {
  for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i].c;
  return "#6366f1";
}
/* Sensible starting points. The user can change any of them. */
var ROLE_DEFAULTS = {
  Rent:"essential", Bills:"essential", Health:"essential", Education:"essential",
  Groceries:"flexible", Travel:"flexible", Fuel:"flexible", Food:"flexible", Other:"flexible",
  Shopping:"discretionary", Fun:"discretionary", Subscriptions:"discretionary",
  Savings:"savings", "Loan/EMI":"debt"
};
function roleMap() {
  if (!db.roles || typeof db.roles !== "object") db.roles = {};
  return db.roles;
}
function roleOf(cat) {
  var c = String(cat || "");
  if (!c) return "flexible";
  var m = roleMap();
  if (m[c]) return m[c];
  return ROLE_DEFAULTS[c] || "flexible";
}
function roleInfo(id) {
  for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
  return ROLES[1];
}
function setRole(cat, role) {
  if (!cat) return false;
  var ok = ROLES.some(function (r) { return r.id === role; });
  if (!ok) return false;
  roleMap()[String(cat)] = role;
  save();
  return true;
}
/** Categories you can actually spend from, income excluded. */
function spendCats() {
  var seen = {}, out = [];
  db.cats.forEach(function (c) {
    if (c.k !== "out" || seen[c.n]) return;
    seen[c.n] = 1;
    out.push(c.n);
  });
  return out;
}
/** Totals for a set of transactions, split by what the money was for. */
function byRole(list) {
  var out = {};
  ROLES.forEach(function (r) { out[r.id] = 0; });
  (list || []).forEach(function (t) {
    var amt = netSpend(t);
    if (!amt) return;
    out[roleOf(t.cat)] = (out[roleOf(t.cat)] || 0) + amt;
  });
  return out;
}
/** Money that genuinely left your control: essential + flexible + discretionary + debt. */
function trueSpend(list) {
  var r = byRole(list);
  return r.essential + r.flexible + r.discretionary + r.debt;
}
/** What you could still cut this month if you had to. */
function cuttable(list) {
  var r = byRole(list);
  return r.discretionary + r.flexible;
}

function safeToSpend() {
  return spendable() - cardsDueNow() - bufferTotal();
}
/** Budget remaining, but never more than the money that actually exists. */
function leftToSpend() {
  var budget = budgetTotal();
  var spentThisMonth = totalsFor(txIn(mKey(new Date()))).out;
  var free = safeToSpend();
  if (budget <= 0) return { amount: free, basis: "money", budget: 0, spent: spentThisMonth };
  var byBudget = budget - spentThisMonth;
  if (byBudget <= free) return { amount: byBudget, basis: "budget", budget: budget, spent: spentThisMonth };
  return { amount: free, basis: "money", budget: budget, spent: spentThisMonth };
}

/* ---------- SIPs: reminders, never automatic ---------- */
function sipDue() {
  var out = [], td = new Date().getDate(), mk = mKey(new Date());
  funds().forEach(function (f) {
    if (!f.sip || !f.day || f.oneOff) return;
    var paid = db.tx.some(function (t) {
      return t.fundId === f.id && mOf(t.date) === mk;
    });
    var days = daysToDay(f.day);
    out.push({ fund: f, paid: paid, days: days, due: !paid && days !== null && days <= 3 });
  });
  return out.sort(function (a, b) { return (a.days === null ? 99 : a.days) - (b.days === null ? 99 : b.days); });
}

/* ---------- SIP check-in, and the money-must-be-there warning ----------
   Nothing is ever taken automatically. On the SIP day the app asks whether
   you actually paid. Two days before, it checks the account really holds
   enough for the SIPs that come out of it. */
var SIP_WARN_DAYS = 2;

function sipSkips() {
  if (!db.sipSkip || typeof db.sipSkip !== "object") db.sipSkip = {};
  return db.sipSkip;
}
function sipFunds() {
  return funds().filter(function (f) {
    return !f.oneOff && Math.round(f.sip || 0) > 0 && parseInt(f.day, 10) > 0;
  });
}
/** The day this month a SIP falls on. Short months pull it to the last day. */
function sipDateFor(day, ref) {
  var d = ref || new Date(), n = parseInt(day, 10);
  if (!n || n < 1 || n > 31) return "";
  var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return isoOf(new Date(d.getFullYear(), d.getMonth(), Math.min(n, dim)));
}
function daysBetween(a, b) {
  return Math.round((dateFrom(b) - dateFrom(a)) / 86400000);
}
function sipPaidTx(f, mk) {
  return db.tx.filter(function (t) { return t.fundId === f.id && mOf(t.date) === mk; });
}
/** paid | skipped | open — for one fund in one month. */
function sipStatus(f, ref) {
  var mk = mKey(ref || new Date());
  if (sipPaidTx(f, mk).length) return "paid";
  if (sipSkips()[f.id + ":" + mk]) return "skipped";
  return "open";
}
function sipSkip(f, ref, on) {
  var mk = mKey(ref || new Date());
  if (on === false) delete sipSkips()[f.id + ":" + mk];
  else sipSkips()[f.id + ":" + mk] = true;
  save();
}
/** Every SIP this month, with where it stands. */
function sipMonth(ref) {
  var d = ref || new Date(), mk = mKey(d), td = isoOf(d);
  return sipFunds().map(function (f) {
    var date = sipDateFor(f.day, d);
    var st = sipStatus(f, d);
    var paidAmt = sipPaidTx(f, mk).reduce(function (s, t) { return s + Math.round(t.amt || 0); }, 0);
    return {
      fund: f, date: date, mk: mk, status: st, paid: paidAmt,
      away: date ? daysBetween(td, date) : null,
      overdue: st === "open" && !!date && date < td
    };
  }).sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
}
/** Which SIPs the app should ask about right now — the day has come or gone. */
function sipAsk(ref) {
  return sipMonth(ref).filter(function (x) { return x.status === "open" && x.away !== null && x.away <= 0; });
}
/** Group the SIPs still to come into "this much must sit in this account". */
function sipNeeds(ref, within) {
  var win = within === undefined ? SIP_WARN_DAYS : within, byAcc = {};
  sipMonth(ref).forEach(function (x) {
    if (x.status !== "open" || x.away === null || x.away < 0 || x.away > win) return;
    var k = x.fund.acc || "";
    if (!byAcc[k]) byAcc[k] = { accId: k, need: 0, items: [], date: x.date, away: x.away };
    var g = byAcc[k];
    g.need += Math.round(x.fund.sip || 0);
    g.items.push(x);
    if (String(x.date) < String(g.date)) { g.date = x.date; g.away = x.away; }
  });
  return Object.keys(byAcc).map(function (k) {
    var g = byAcc[k];
    g.have = balance(g.accId);
    g.short = Math.max(0, g.need - g.have);
    g.enough = g.have >= g.need;
    g.spare = g.have - g.need;
    return g;
  }).sort(function (a, b) { return a.away - b.away || b.need - a.need; });
}
/* ---------- dismissing a reminder without answering it ----------
   Banks do not always move the money on the day. It can land the next
   morning, or after a weekend. Closing a reminder just hides it for a
   while — it never means "paid" and it never means "skipped". */
var SNOOZE_HOURS = 20;

function sipSnoozes() {
  if (!db.sipSnooze || typeof db.sipSnooze !== "object") db.sipSnooze = {};
  return db.sipSnooze;
}
function snoozeKey(a) {
  return (a.kind === "ask" ? "ask:" + a.fundId : a.kind + ":" + a.accId + ":" + a.date);
}
function snoozeUntil(hours) {
  var d = new Date();
  d.setHours(d.getHours() + (hours === undefined ? SNOOZE_HOURS : hours));
  return isoOf(d) + "T" + hm(d);
}
function sipHidden(a, ref) {
  var until = sipSnoozes()[snoozeKey(a)];
  if (!until) return false;
  var now = ref ? isoOf(ref) + "T00:00" : stamp();
  return String(until) > now;
}
function sipDismiss(a, hours) {
  sipSnoozes()[snoozeKey(a)] = snoozeUntil(hours);
  save();
}
function sipUndismiss(a) {
  delete sipSnoozes()[snoozeKey(a)];
  save();
}
/** Forget snoozes whose time has passed, so the store stays small. */
function sipTidySnooze() {
  var s = sipSnoozes(), now = stamp(), n = 0;
  Object.keys(s).forEach(function (k) { if (String(s[k]) <= now) { delete s[k]; n++; } });
  if (n) save();
  return n;
}
/** Everything currently hidden, so you can bring it back. */
function sipDismissed(ref) {
  return sipAlerts(ref, true).filter(function (a) { return sipHidden(a, ref); });
}
function sipBringBack(ref) {
  sipDismissed(ref).forEach(function (a) { delete sipSnoozes()[snoozeKey(a)]; });
  save();
}

/** Plain-language reminders. kind: ask | short | ready */
function sipAlerts(ref, showAll) {
  var out = [];
  sipAsk(ref).forEach(function (x) {
    out.push({
      kind: "ask", fundId: x.fund.id, amt: Math.round(x.fund.sip || 0), date: x.date,
      title: "Did you pay " + x.fund.name + "?",
      body: money(x.fund.sip) + " was due " + (x.away === 0 ? "today" : "on " + fDate(x.date) +
        ", " + Math.abs(x.away) + (Math.abs(x.away) === 1 ? " day" : " days") + " ago") +
        " from " + accName(x.fund.acc) + "."
    });
  });
  sipNeeds(ref).forEach(function (g) {
    var when = g.away === 0 ? "today" : g.away === 1 ? "tomorrow" : "on " + fDate(g.date);
    var names = g.items.map(function (x) { return x.fund.name; });
    if (!g.enough) {
      out.push({
        kind: "short", accId: g.accId, need: g.need, have: g.have, short: g.short, date: g.date,
        title: "Put " + money(g.short) + " into " + accName(g.accId),
        body: money(g.need) + " of SIPs is set to go out of " + accName(g.accId) + " " + when +
          ", but it holds " + money(g.have) + ". You are " + money(g.short) + " short.",
        funds: names
      });
    } else {
      out.push({
        kind: "ready", accId: g.accId, need: g.need, have: g.have, spare: g.spare, date: g.date,
        title: money(g.need) + " will go out of " + accName(g.accId) + " " + when,
        body: accName(g.accId) + " holds " + money(g.have) + ", so " + money(g.need) + " for " +
          names.length + (names.length === 1 ? " SIP" : " SIPs") + " is covered with " +
          money(g.spare) + " to spare.",
        funds: names
      });
    }
  });
  return showAll ? out : out.filter(function (a) { return !sipHidden(a, ref); });
}
/** One short line for the top of Home. */
function sipHeadline(ref) {
  var a = sipAlerts(ref);
  var ask = a.filter(function (x) { return x.kind === "ask"; }).length;
  var short = a.filter(function (x) { return x.kind === "short"; });
  if (ask) return { tone: "ask", text: ask === 1 ? "1 SIP to confirm" : ask + " SIPs to confirm" };
  if (short.length) {
    var need = short.reduce(function (s, x) { return s + x.short; }, 0);
    return { tone: "short", text: money(need) + " short for your SIPs" };
  }
  var ready = a.filter(function (x) { return x.kind === "ready"; });
  if (ready.length) return { tone: "ready", text: "SIPs covered" };
  return null;
}

/* ---------- month-by-month record for one fund ----------
   Only counts months the fund could actually have been paid in:
   from its first recorded payment (or the day you added it) to now. */
function fundStartMonth(f) {
  var months = db.tx.filter(function (t) { return t.fundId === f.id; })
    .map(function (t) { return mOf(t.date); }).sort();
  if (f.since) return mOf(f.since);
  if (months.length) return months[0];
  return mKey(new Date());
}
/** paid | skipped | missed | upcoming, for every month up to now. */
function fundHistory(f, ref) {
  if (f.oneOff || !f.sip || !f.day) return [];
  var now = ref || new Date(), nowMk = mKey(now), out = [];
  var mk = fundStartMonth(f), guard = 0;
  while (guard++ < 240) {
    var paidTx = db.tx.filter(function (t) { return t.fundId === f.id && mOf(t.date) === mk; });
    var amt = paidTx.reduce(function (s, t) { return s + Math.round(t.amt || 0); }, 0);
    var parts = mk.split("-");
    var dt = sipDateFor(f.day, new Date(+parts[0], +parts[1] - 1, 1));
    var state = paidTx.length ? "paid"
      : sipSkips()[f.id + ":" + mk] ? "skipped"
      : dt > isoOf(now) ? "upcoming"
      : "missed";
    out.push({ mk: mk, label: mLabel(mk), due: dt, state: state, amt: amt,
               on: paidTx.length ? paidTx[0].date : "" });
    if (mk === nowMk) break;
    mk = mShift(mk, 1);
  }
  return out;
}
/** How steady you have been with one fund. */
function fundRecord(f, ref) {
  var h = fundHistory(f, ref).filter(function (x) { return x.state !== "upcoming"; });
  var paid = h.filter(function (x) { return x.state === "paid"; }).length;
  var skipped = h.filter(function (x) { return x.state === "skipped"; }).length;
  var missed = h.filter(function (x) { return x.state === "missed"; }).length;
  var streak = 0;
  for (var i = h.length - 1; i >= 0; i--) {
    if (h[i].state === "paid") streak++;
    else break;
  }
  return { months: h.length, paid: paid, skipped: skipped, missed: missed, streak: streak,
           gaps: h.filter(function (x) { return x.state !== "paid"; }),
           rate: h.length ? Math.round((paid / h.length) * 100) : 100, rows: h };
}
/** The same picture across every SIP you run. */
function sipRecord(ref) {
  var per = sipFunds().map(function (f) {
    var r = fundRecord(f, ref);
    r.fund = f;
    return r;
  });
  var months = per.reduce(function (s, r) { return s + r.months; }, 0);
  var paid = per.reduce(function (s, r) { return s + r.paid; }, 0);
  var skipped = per.reduce(function (s, r) { return s + r.skipped; }, 0);
  var missed = per.reduce(function (s, r) { return s + r.missed; }, 0);
  var rate = months ? Math.round((paid / months) * 100) : 100;
  var verdict = !months ? "No SIP months to judge yet."
    : missed + skipped === 0 ? "Going strong \u2014 you have not missed a single SIP."
    : missed + skipped === 1 ? "Nearly perfect \u2014 1 month went unpaid."
    : rate >= 80 ? "Mostly steady \u2014 " + (missed + skipped) + " months went unpaid."
    : "Patchy \u2014 " + (missed + skipped) + " of " + months + " months went unpaid.";
  var tone = !months ? "info" : missed + skipped === 0 ? "good"
    : rate >= 80 ? "ok" : "bad";
  return { per: per, months: months, paid: paid, skipped: skipped, missed: missed,
           unpaid: skipped + missed, rate: rate, verdict: verdict, tone: tone,
           worst: per.slice().sort(function (a, b) { return a.rate - b.rate; })[0] || null,
           best: per.filter(function (r) { return r.months; })
                    .sort(function (a, b) { return b.streak - a.streak; })[0] || null };
}

/** Record a SIP payment. Money leaves the account and goes into the fund. */
function payFund(f, amount, accId, dateIso) {
  var amt = Math.round(amount || 0);
  if (amt <= 0) return false;
  db.tx.push({
    id: id("t"), type: "move", amt: amt, cat: "", acc: accId || f.acc, to: "",
    how: "bank", appId: "", channel: "", date: dateIso || today(), time: hm(new Date()),
    noTime: false, note: "Invested in " + f.name, fundId: f.id,
    status: "done", deducted: 0, refunds: [], createdAt: stamp(), updatedAt: stamp()
  });
  f.invested = Math.round(f.invested || 0) + amt;
  f.lastPaid = dateIso || today();
  save();
  return true;
}

/* ---------- locking after a while away ----------
   Only does anything when you have set a PIN. It watches for you coming
   back to the tab, and locks if enough time has gone by. */
function lockAfter() { return Math.max(0, parseInt(db.settings.lockAfter, 10) || 0); }
function setLockAfter(mins) {
  db.settings.lockAfter = Math.max(0, Math.min(120, parseInt(mins, 10) || 0));
  save();
  return db.settings.lockAfter;
}
function touchActivity() { ui.lastSeen = Date.now(); }
function shouldLock() {
  if (!db.settings.pin || !lockAfter()) return false;
  if (!ui.lastSeen) return false;
  return (Date.now() - ui.lastSeen) > lockAfter() * 60000;
}
function watchIdle() {
  if (ui.idleWatch) return;
  ui.idleWatch = true;
  touchActivity();
  var check = function () {
    if (shouldLock()) showLock();
    touchActivity();
  };
  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) touchActivity();
      else check();
    });
    document.addEventListener("click", touchActivity);
    document.addEventListener("keydown", touchActivity);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("focus", check);
    window.addEventListener("blur", touchActivity);
  }
  if (typeof setInterval === "function") {
    setInterval(function () { if (shouldLock()) showLock(); }, 30000);
  }
}

/* ---------- knowing when a newer copy is published ----------
   Checks the page it was itself served from. If the file on the server
   carries a newer build than the one running, it says so. It never
   reloads on its own — that would lose what you were typing. */
function checkForUpdate() {
  if (typeof fetch !== "function" || typeof location === "undefined") return Promise.resolve("");
  return fetch(location.href, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (text) {
      if (!text) return "";
      var m = text.match(/var BUILD = "([^"]+)"/);
      if (!m || m[1] === BUILD) return "";
      ui.newBuild = m[1];
      paintUpdate();
      return m[1];
    })
    .catch(function () { return ""; });
}
function paintUpdate() {
  var box = el("updateBar");
  if (!box) return;
  if (!ui.newBuild) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = '<div class="note info"><span aria-hidden="true">\u2b06\ufe0f</span><div>' +
    "<b>A newer version of this page is available.</b><br>You are running " + esc(BUILD) +
    "; the server has " + esc(ui.newBuild) + ". Reloading keeps everything you have " +
    "entered \u2014 your data is stored separately from the page.<br>" +
    '<button type="button" class="btn s" data-act="reloadNow" style="margin-block-start:8px">' +
    "Reload now</button> " +
    '<button type="button" class="btn g s" data-act="updateLater" ' +
    'style="margin-block-start:8px">Later</button></div></div>';
}

/* ---------- sections you can fold away ----------
   What you open is remembered, so the page looks the same next time. */
function foldMap() {
  if (!db.settings.folds || typeof db.settings.folds !== "object") db.settings.folds = {};
  return db.settings.folds;
}
function isOpen(key, byDefault) {
  var m = foldMap();
  return m[key] === undefined ? !!byDefault : !!m[key];

function toggleFold(key, byDefault) {

}
/** A heading that opens and closes what follows it. */

    '<button type="button" class="foldhead" data-act="fold" data-k="' + esc(key) + '"' +
