/* =========================================================
   RECEIPTS AND SCREENSHOTS
   ---------------------------------------------------------
   The golden rule: a transaction is dated by WHEN THE MONEY MOVED,
   read from inside the bill — never by when the screenshot was
   taken, uploaded, or when the record was saved.
   Order date, payment date, invoice date and delivery date are all
   kept, because returns, warranties and refunds need them.
   ========================================================= */

var DATE_KINDS = [
  { id:"payment",  label:"Payment date",  hint:"When the money was actually charged" },
  { id:"order",    label:"Order date",    hint:"When you placed the order" },
  { id:"invoice",  label:"Invoice date",  hint:"The date printed on the invoice" },
  { id:"delivery", label:"Delivery date", hint:"When it arrived" }
];
var MONTH_WORDS = {
  jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3, may:4,
  jun:5, june:5, jul:6, july:6, aug:7, august:7, sep:8, sept:8, september:8,
  oct:9, october:9, nov:10, november:10, dec:11, december:11
};
var MERCHANT_HINTS = [
  { match:/swiggy|zomato|eatsure|dominos|pizza|kfc|mcdonald/i,        cat:"Food",         name:null },
  { match:/bigbasket|blinkit|zepto|instamart|dmart|grocer|supermarket/i, cat:"Groceries", name:null },
  { match:/amazon|flipkart|myntra|ajio|meesho|nykaa|tatacliq/i,        cat:"Shopping",     name:null },
  { match:/uber|ola|rapido|irctc|indigo|vistara|air ?india|makemytrip|goibibo|redbus/i, cat:"Travel", name:null },
  { match:/oyo|treebo|booking\.com|airbnb|hotel/i,                     cat:"Travel",       name:null },
  { match:/netflix|prime video|hotstar|spotify|youtube premium|subscription/i, cat:"Subscriptions", name:null },
  { match:/apollo|pharmeasy|1mg|netmeds|hospital|clinic|pharmacy/i,    cat:"Health",       name:null },
  { match:/electricity|gas bill|water bill|broadband|airtel|jio|vodafone|bsnl/i, cat:"Bills", name:null },
  { match:/petrol|fuel|indian oil|hp ?petrol|bharat petroleum/i,       cat:"Fuel",         name:null }
];

/** Read a date out of receipt text. Returns { iso, time, label } or null. */
function findDates(text) {
  var found = [], src = String(text || "");
  var push = function (y, m, d, index) {
    if (!(y > 1900 && y < 2200)) return;
    if (m < 0 || m > 11) return;
    var dim = new Date(y, m + 1, 0).getDate();
    if (d < 1 || d > dim) return;
    found.push({ iso: isoOf(new Date(y, m, d)), at: index });
  };
  var re, mm;

  /* 29 August 2026 / 29 Aug, 2026 / August 29, 2026 */
  re = /(\d{1,2})\s*(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,9})[\s,\-]+(\d{4})/g;
  while ((mm = re.exec(src))) {
    var w1 = MONTH_WORDS[mm[2].toLowerCase()];
    if (w1 !== undefined) push(+mm[3], w1, +mm[1], mm.index);
  }
  re = /([A-Za-z]{3,9})\s+(\d{1,2})\s*(?:st|nd|rd|th)?[\s,]+(\d{4})/g;
  while ((mm = re.exec(src))) {
    var w2 = MONTH_WORDS[mm[1].toLowerCase()];
    if (w2 !== undefined) push(+mm[3], w2, +mm[2], mm.index);
  }
  /* 2026-08-29 */
  re = /(\d{4})-(\d{1,2})-(\d{1,2})/g;
  while ((mm = re.exec(src))) push(+mm[1], +mm[2] - 1, +mm[3], mm.index);
  /* 29/08/2026 and 29-08-26 (day first, as used in India) */
  re = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g;
  while ((mm = re.exec(src))) {
    var yr = +mm[3];
    if (yr < 100) yr += 2000;
    push(yr, +mm[2] - 1, +mm[1], mm.index);
  }
  return found;
}
/** Read a time near a position in the text. */
function findTimeNear(text, at) {
  var src = String(text || "");
  var window = src.slice(Math.max(0, at - 60), Math.min(src.length, at + 90));
  var m = window.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])\.?m\.?/i);
  if (m) {
    var h = parseInt(m[1], 10) % 12;
    if (m[3].toLowerCase() === "p") h += 12;
    return p2(h) + ":" + m[2];
  }
  m = window.match(/\b(\d{1,2}):(\d{2})\b/);
  if (m) {
    var h2 = parseInt(m[1], 10);
    if (h2 >= 0 && h2 <= 23 && +m[2] <= 59) return p2(h2) + ":" + m[2];
  }
  return "";
}
/** Pull every useful field out of pasted or typed receipt text. */
function readReceipt(text) {
  var src = String(text || "");
  var low = src.toLowerCase();
  var out = { dates: {}, times: {}, amount: 0, merchant: "", cat: "", order: "", notes: [] };

  /* dates, labelled by the words that sit just before them */
  var labels = [
    { key:"payment",  re:/(payment|paid|charged|debited|txn|transaction)[^\n]{0,40}/gi },
    { key:"order",    re:/(order(ed)?\s*(placed|date|on)?)[^\n]{0,40}/gi },
    { key:"invoice",  re:/(invoice|bill)\s*(date|no|number)?[^\n]{0,40}/gi },
    { key:"delivery", re:/(deliver(ed|y)|shipped|arriv)[^\n]{0,40}/gi }
  ];
  labels.forEach(function (l) {
    var m;
    l.re.lastIndex = 0;
    while ((m = l.re.exec(src))) {
      var chunk = src.slice(m.index, m.index + 120);
      var d = findDates(chunk)[0];
      if (d && !out.dates[l.key]) {
        out.dates[l.key] = d.iso;
        var t = findTimeNear(chunk, d.at);
        if (t) out.times[l.key] = t;
      }
    }
  });
  /* any unlabelled date, as a fallback */
  if (!Object.keys(out.dates).length) {
    var any = findDates(src)[0];
    if (any) {
      out.dates.unknown = any.iso;
      var t2 = findTimeNear(src, any.at);
      if (t2) out.times.unknown = t2;
    }
  }

  /* amount: prefer a labelled total */
  var amtRe = /(grand\s*total|total\s*amount|order\s*total|amount\s*paid|you\s*paid|net\s*payable|total)[^\d₹]{0,14}(?:₹|rs\.?|inr)?\s*([\d,]+(?:\.\d{1,2})?)/gi;
  var best = 0, am;
  while ((am = amtRe.exec(src))) {
    var v = toMinor(am[2].replace(/,/g, ""));
    if (v > best) best = v;
  }
  if (!best) {
    var rupee = /(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/gi, r;
    while ((r = rupee.exec(src))) {
      var v2 = toMinor(r[1].replace(/,/g, ""));
      if (v2 > best) best = v2;
    }
  }
  out.amount = best;

  /* merchant + a sensible category */
  for (var i = 0; i < MERCHANT_HINTS.length; i++) {
    var hit = src.match(MERCHANT_HINTS[i].match);
    if (hit) {
      out.merchant = hit[0].replace(/\s+/g, " ").trim();
      out.merchant = out.merchant.charAt(0).toUpperCase() + out.merchant.slice(1);
      out.cat = MERCHANT_HINTS[i].cat;
      break;
    }
  }
  if (!out.merchant) {
    var line = src.split(/\n/).map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length > 2 && x.length < 40 && !/\d{4}/.test(x); })[0];
    if (line) out.merchant = line;
  }

  var ord = src.match(/order\s*(?:id|no\.?|number)?\s*[:#]?\s*([A-Za-z0-9\-]{6,24})/i);
  if (ord) out.order = ord[1];

  /* how it was paid, if the receipt says */
  if (/upi|google ?pay|phonepe|paytm|gpay|bhim/i.test(low)) out.how = "app";
  else if (/credit ?card/i.test(low)) out.how = "card";
  else if (/debit ?card/i.test(low)) out.how = "debit";
  else if (/net ?banking|bank transfer|neft|imps/i.test(low)) out.how = "bank";
  else if (/cash on delivery|\bcod\b|cash/i.test(low)) out.how = "cash";
  if (/rupay/i.test(low) && /upi/i.test(low)) out.channel = "upi";
  else if (/\bupi\b/i.test(low)) out.channel = "upi";
  else if (/swipe|pos |card present|in ?store|counter/i.test(low)) out.channel = "swipe";
  else if (/online|website|checkout/i.test(low)) out.channel = "online";
  /* match the app the bill names against the ones you actually use */
  for (var k = 0; k < db.apps.length; k++) {
    var nm = String(db.apps[k].name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (nm && low.replace(/[^a-z0-9]/g, "").indexOf(nm) > -1) { out.appId = db.apps[k].id; break; }
  }
  /* a shop counter receipt rather than an online order */
  if (/\bcounter\b|\bin ?store\b|\bpos\b|table no|dine ?in|cashier/i.test(low)) out.billKind = "shop";
  return out;
}
/** Which date should the transaction use, and how sure are we? */
function chooseDate(read) {
  var order = ["payment", "invoice", "order", "delivery", "unknown"];
  for (var i = 0; i < order.length; i++) {
    if (read.dates[order[i]]) {
      return { key: order[i], iso: read.dates[order[i]], time: read.times[order[i]] || "" };
    }
  }
  return null;
}

/* =========================================================
   SIGN IN
   ---------------------------------------------------------
   Honest note: this runs entirely in your browser. It keeps
   casual eyes out of the app on this device. It is NOT real
   security — anyone with the device and some know-how can read
   the stored data. The password is stored as a scrambled value,
   never as plain text, but that is still not encryption.
   ========================================================= */

var GENDERS = ["Male", "Female", "Other", "Prefer not to say"];

/** Scramble a password so it is never stored as readable text. */
function scramble(pw) {
  var str = "moneytracker:" + String(pw || "");
  var a = 5381, b = 7919, i;
  for (i = 0; i < str.length; i++) a = ((a * 33) ^ str.charCodeAt(i)) >>> 0;
  for (i = str.length - 1; i >= 0; i--) b = (((b * 31) >>> 0) + str.charCodeAt(i)) >>> 0;
  return a.toString(36) + "-" + b.toString(36) + "-" + str.length;
}
function passwordProblem(pw) {
  var p = String(pw || "");
  if (p.length < 8) return "Use at least 8 characters.";
  if (!/[A-Za-z]/.test(p)) return "Include at least one letter.";
  if (!/[0-9]/.test(p)) return "Include at least one number.";
  return "";
}
function usernameProblem(u) {
  var v = String(u || "").trim();
  if (v.length < 3) return "Username needs at least 3 characters.";
  if (v.length > 24) return "Username is too long.";
  if (!/^[A-Za-z0-9._-]+$/.test(v)) return "Use letters, numbers, dot, underscore or hyphen only.";
  return "";
}
function dobProblem(iso) {
  if (!iso) return "Enter your date of birth.";
  var d = dateFrom(iso), now = new Date();
  if (isNaN(d.getTime())) return "That date doesn't look right.";
  if (iso > today()) return "That date is in the future.";
  var years = (now - d) / (365.25 * 86400000);
  if (years > 120) return "That date doesn't look right.";
  if (years < 13) return "You need to be at least 13.";
  return "";
}
function hasAccount() { return !!(db.auth && db.auth.user); }
function sameUser(a, b) {
  return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
}

/* ---------- actions ---------- */
function authAct(name) {
  var v = grabAuth(), a = ui.auth;
  a.error = ""; a.info = "";

  if (name === "auShow") { a.show = !a.show; drawAuth(); return true; }
  if (name === "auGoSignIn") { a.view = "signin"; a.stage = "ask"; drawAuth(); return true; }
  if (name === "auGoCreate") { a.view = "create"; drawAuth(); return true; }
  if (name === "auGoForgot") {
    a.view = "forgot"; a.stage = "ask";
    a.values = Object.assign(a.values || {}, { user: v.user || "" });
    drawAuth(); return true;
  }

  if (name === "auSignIn") {
    if (!sameUser(v.user, db.auth.user)) {
      a.error = "That username and password don't match.";
      a.values.pw = "";
      drawAuth(); return true;
    }
    if (isEncrypted()) {
      a.info = "Unlocking…";
      drawAuth();
      unlockWith(v.pw).then(function (okNow) {
        if (!okNow) {
          a.info = "";
          a.error = "That username and password don't match.";
          a.values.pw = "";
          drawAuth();
          return;
        }
        db.auth.lastSignIn = stamp();
        saveLocalOnly();
        hideAuth();
        afterSignIn();
      });
      return true;
    }
    if (scramble(v.pw) !== db.auth.pwHash) {
      a.error = "That username and password don't match.";
      a.values.pw = "";
      drawAuth(); return true;
    }
    db.auth.lastSignIn = stamp();
    save();
    hideAuth();
    afterSignIn();
    return true;
  }

  if (name === "auCreate") {
    var p1 = usernameProblem(v.user) || passwordProblem(v.pw) || dobProblem(v.dob);
    if (!p1 && v.pw !== v.pw2) p1 = "The two passwords don't match.";
    if (p1) { a.error = p1; drawAuth(); return true; }
    db.auth = {
      user: String(v.user).trim(), pwHash: "", dob: v.dob,
      gender: v.gender || "Prefer not to say", createdAt: stamp(), lastSignIn: stamp()
    };
    db.profile.name = String(v.user).trim();
    if (cryptoAvailable()) {
      a.info = "Setting up encryption…";
      drawAuth();
      setupEncryption(v.pw).then(function (recovery) {
        ui.recovery = recovery;
        return saveEncrypted();
      }).then(function () {
        hideAuth();
        afterSignIn();
        openSheet(recoverySheet(ui.recovery));
      });
      return true;
    }
    db.auth.pwHash = scramble(v.pw);
    save();
    hideAuth();
    afterSignIn();
    return true;
  }

  if (name === "auRecover") {
    a.info = "Checking…";
    drawAuth();
    unlockWithRecovery(String(v.recovery || "").trim().toUpperCase()).then(function (okNow) {
      a.info = "";
      if (!okNow) { a.error = "That recovery key doesn't match."; drawAuth(); return; }
      a.stage = "reset";
      a.values.pw = ""; a.values.pw2 = "";
      a.info = "Recovery key accepted. Choose a new password.";
      drawAuth();
    });
    return true;
  }
  if (name === "auCheck") {
    if (isEncrypted()) {
      a.error = "Your data is encrypted, so a birthday cannot unlock it. Use your recovery key below.";
      a.stage = "recovery";
      drawAuth(); return true;
    }
    if (!sameUser(v.user, db.auth.user) || String(v.dob) !== String(db.auth.dob)) {
      a.error = "Those details don't match the account on this device.";
      drawAuth(); return true;
    }
    a.stage = "reset";
    a.values.pw = ""; a.values.pw2 = "";
    drawAuth(); return true;
  }

  if (name === "auReset") {
    var p2 = passwordProblem(v.pw);
    if (!p2 && v.pw !== v.pw2) p2 = "The two passwords don't match.";
    if (p2) { a.error = p2; drawAuth(); return true; }
    if (isEncrypted() && isUnlocked()) {
      a.info = "Re-encrypting with your new password…";
      drawAuth();
      setupEncryption(v.pw).then(function (recovery) {
        ui.recovery = recovery;
        db.auth.pwHash = "";
        db.auth.changedAt = stamp();
        return saveEncrypted();
      }).then(function () {
        a.view = "signin"; a.stage = "ask";
        a.values = { user: db.auth.user, pw: "" };
        a.info = "Password changed. Write down your NEW recovery key after signing in.";
        drawAuth();
      });
      return true;
    }
    db.auth.pwHash = scramble(v.pw);
    db.auth.changedAt = stamp();
    save();
    a.view = "signin"; a.stage = "ask";
    a.values = { user: db.auth.user, pw: "" };
    a.info = "Password changed. Sign in with your new password.";
    drawAuth(); return true;
  }
  return false;
}

/* =========================================================
   ENCRYPTION
   ---------------------------------------------------------
   Real encryption, using the browser's own Web Crypto API.
     - your password is stretched into a key with PBKDF2
       (310,000 rounds, deliberately slow to guess)
     - everything is then encrypted with AES-GCM, 256-bit
     - a fresh random salt per install, fresh random IV per save
   The password itself is NEVER stored, anywhere.
   Without it, the saved data is unreadable — including by me,
   by GitHub, and by anyone who picks up your phone.
   ========================================================= */

var CRYPTO_KEY = "moneytracker.enc";   /* the encrypted blob */
var CRYPTO_META = "moneytracker.meta"; /* salt + settings, not secret */
var PBKDF2_ROUNDS = 310000;

var cryptoKey = null;      /* the derived key, held only while signed in */
var cryptoMaster = null;   /* raw master key bytes, memory only */
var cryptoSalt = null;

function webCrypto() {
  return (typeof crypto !== "undefined" && crypto.subtle) ? crypto : null;
}
function cryptoAvailable() { return !!webCrypto(); }

function randomBytes(n) {
  var a = new Uint8Array(n);
  webCrypto().getRandomValues(a);
  return a;
}
function bytesToB64(bytes) {
  var s = "", i;
  for (i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBytes(b64) {
  var s = atob(b64), a = new Uint8Array(s.length), i;
  for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function textBytes(str) {
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(str);
  var utf = unescape(encodeURIComponent(str)), a = new Uint8Array(utf.length), i;
  for (i = 0; i < utf.length; i++) a[i] = utf.charCodeAt(i);
  return a;
}
function bytesText(bytes) {
  if (typeof TextDecoder !== "undefined") return new TextDecoder().decode(bytes);
  var s = "", i;
  for (i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return decodeURIComponent(escape(s));
}

/** Stretch a password into an AES key. Slow on purpose. */
function deriveKey(password, salt) {
  var c = webCrypto();
  return c.subtle.importKey("raw", textBytes(password), { name: "PBKDF2" }, false, ["deriveKey"])
    .then(function (base) {
      return c.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: PBKDF2_ROUNDS, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    });
}
function encryptWith(key, plainText) {
  var c = webCrypto(), iv = randomBytes(12);
  return c.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, textBytes(plainText))
    .then(function (buf) {
      return { v: 1, alg: "AES-GCM", kdf: "PBKDF2-SHA256", rounds: PBKDF2_ROUNDS,
        iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(buf)) };
    });
}
function decryptWith(key, blob) {
  var c = webCrypto();
  return c.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.data))
    .then(function (buf) { return bytesText(new Uint8Array(buf)); });
}

/* ---------- what the app calls ---------- */
function readMeta() {
  try {
    var raw = localStorage.getItem(CRYPTO_META);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeMeta(meta) {
  try { localStorage.setItem(CRYPTO_META, JSON.stringify(meta)); } catch (e) {}
}
function isEncrypted() {
  var m = readMeta();
  return !!(m && m.salt);
}
/** First-time setup.
    A random master key encrypts the data. That master key is then wrapped
    twice: once with your password, once with the recovery key. Either one
    opens the same vault — and changing the password only re-wraps the key. */
function setupEncryption(password) {
  if (!cryptoAvailable()) return Promise.reject(new Error("This browser has no encryption support"));
  var meta = readMeta();
  var salt = meta && meta.salt ? b64ToBytes(meta.salt) : randomBytes(16);
  var master = cryptoMaster || randomBytes(32);
  var recovery = makeRecoveryKey();
  var out = { salt: bytesToB64(salt), rounds: PBKDF2_ROUNDS, alg: "AES-GCM", createdAt: stamp() };
  return deriveKey(password, salt).then(function (pk) {
    return encryptWith(pk, bytesToB64(master));
  }).then(function (wrapped) {
    out.byPassword = wrapped;
    return deriveKey(recovery, salt);
  }).then(function (rk) {
    return encryptWith(rk, bytesToB64(master));
  }).then(function (wrapped2) {
    out.byRecovery = wrapped2;
    return importMaster(master);
  }).then(function (key) {
    cryptoKey = key;
    cryptoMaster = master;
    cryptoSalt = salt;
    writeMeta(out);
    return recovery;
  });
}
function importMaster(masterBytes) {
  return webCrypto().subtle.importKey("raw", masterBytes, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
}
/** Open the vault with either the password or the recovery key. */
function unwrapWith(secret, which) {
  var meta = readMeta();
  if (!meta || !meta.salt || !meta[which]) return Promise.resolve(false);
  var salt = b64ToBytes(meta.salt);
  return deriveKey(secret, salt).then(function (k) {
    return decryptWith(k, meta[which]);
  }).then(function (masterB64) {
    var master = b64ToBytes(masterB64);
    return importMaster(master).then(function (key) {
      cryptoKey = key;
      cryptoMaster = master;
      cryptoSalt = salt;
      var raw;
      try { raw = localStorage.getItem(CRYPTO_KEY); } catch (e) { raw = null; }
      if (!raw) return true;
      var blob;
      try { blob = JSON.parse(raw); } catch (e) { return true; }
      return decryptWith(key, blob).then(function (text) {
        applyLoaded(JSON.parse(text));
        return true;
      }).catch(function () {
        cryptoKey = null; cryptoMaster = null;
        return false;
      });
    });
  }).catch(function () { return false; });
}
function unlockWith(password) {
  if (!cryptoAvailable()) return Promise.resolve(false);
  return unwrapWith(password, "byPassword");
}
function unlockWithRecovery(recovery) {
  if (!cryptoAvailable()) return Promise.resolve(false);
  return unwrapWith(String(recovery || "").trim().toUpperCase(), "byRecovery");
}
function makeRecoveryKey() {
  var bytes = randomBytes(15), out = [], i;
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; /* no look-alikes */
  for (i = 0; i < bytes.length; i++) out.push(chars[bytes[i] % chars.length]);
  return out.join("").replace(/(.{5})(?=.)/g, "$1-");
}
function lockUp() { cryptoKey = null; cryptoMaster = null; cryptoSalt = null; }
function isUnlocked() { return !!cryptoKey; }

/** Encrypt and store. Called after every change. */
function saveEncrypted() {
  if (!cryptoKey) return Promise.resolve(false);
  var text = JSON.stringify(db);
  return encryptWith(cryptoKey, text).then(function (blob) {
    try {
      localStorage.setItem(CRYPTO_KEY, JSON.stringify(blob));
      localStorage.removeItem(KEY); /* remove any old readable copy */
      return true;
    } catch (e) { return false; }
  });
}
/** Produce the blob to put in GitHub — encrypted, safe to publish. */
function encryptedBlob() {
  if (!cryptoKey) return Promise.reject(new Error("locked"));
  var meta = readMeta() || {};
  return encryptWith(cryptoKey, JSON.stringify(db)).then(function (blob) {
    return JSON.stringify({
      app: "money-tracker",
      note: "Encrypted with AES-GCM. Unreadable without the key that unlocks it.",
      salt: meta.salt, rounds: meta.rounds || PBKDF2_ROUNDS,
      byPassword: meta.byPassword, byRecovery: meta.byRecovery,
      updatedAt: stamp(), device: deviceName(),
      payload: blob
    }, null, 2);
  });
}
/** Read a blob that came from GitHub. */
function openBlob(text, password) {
  var outer;
  try { outer = JSON.parse(text); } catch (e) { return Promise.resolve(null); }
  if (!outer || !outer.payload || !outer.salt) return Promise.resolve(null);
  var salt = b64ToBytes(outer.salt);
  var getKey;
  if (password && outer.byPassword) {
    getKey = deriveKey(password, salt)
      .then(function (pk) { return decryptWith(pk, outer.byPassword); })
      .then(function (b64) { return importMaster(b64ToBytes(b64)); });
  } else if (cryptoKey) {
    getKey = Promise.resolve(cryptoKey);
  } else {
    return Promise.resolve(null);
  }
  return getKey.then(function (key) {
    return decryptWith(key, outer.payload).then(function (plain) {
      return { data: JSON.parse(plain), updatedAt: outer.updatedAt, device: outer.device };
    });
  }).catch(function () { return null; });
}
function deviceName() {
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  if (/android/i.test(ua)) return "Android phone";
  if (/iphone|ipad/i.test(ua)) return "iPhone or iPad";
  if (/mac/i.test(ua)) return "Mac";
  if (/windows/i.test(ua)) return "Windows PC";
  return "this device";
}

/* =========================================================
   GITHUB SYNC
   ---------------------------------------------------------
   Your data lives in GitHub as an encrypted file.
     READING is automatic — the app fetches it on open and every
     few minutes. No token, no login, nothing to leak.
     WRITING is three clicks — copy, paste, commit. That is
     deliberate: writing automatically would need an access token
     inside this page, which anyone could read from the source,
     and which GitHub would auto-revoke anyway.
   Everything sent to GitHub is already encrypted. GitHub only
   ever holds ciphertext.
   ========================================================= */

function syncCfg() {
  db.sync = db.sync || { user:"", repo:"", branch:"main", file:"data.json.enc",
    on:false, auto:false, lastPull:"", lastPush:"", lastSeen:"", sha:"" };
  if (db.sync.auto === undefined) db.sync.auto = false;
  return db.sync;
}
function syncReady() {
  var c = syncCfg();
  return !!(c.on && c.user && c.repo && c.file);
}
/* The token and passphrase live only in this browser's storage.
   They are NEVER part of the published page and never leave the device
   except as an Authorization header to github.com. */
var TOKEN_KEY = "moneytracker.token";
var PHRASE_KEY = "moneytracker.phrase";
function savedToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
}
function setToken(v) {
  try {
    if (v) localStorage.setItem(TOKEN_KEY, v);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}
function savedPhrase() {
  try { return localStorage.getItem(PHRASE_KEY) || ""; } catch (e) { return ""; }
}
function setPhrase(v) {
  try {
    if (v) localStorage.setItem(PHRASE_KEY, v);
    else localStorage.removeItem(PHRASE_KEY);
  } catch (e) {}
}
function canWrite() { return !!(savedToken() && syncReady()); }
/** Derive the encryption key from the saved passphrase. Runs on open. */
function unlockSync() {
  var phrase = savedPhrase();
  if (!phrase || !cryptoAvailable()) return Promise.resolve(false);
  if (isUnlocked()) return Promise.resolve(true);
  if (!isEncrypted()) {
    return setupEncryption(phrase).then(function () { return true; })
      .catch(function () { return false; });
  }
  return unlockWith(phrase).then(function (okNow) {
    if (okNow) return true;
    /* the local vault is from a different phrase — rebuild it from this one */
    return setupEncryption(phrase).then(function () { return true; })
      .catch(function () { return false; });
  });
}
function rawUrl() {
  var c = syncCfg();
  return "https://raw.githubusercontent.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/" + encodeURIComponent(c.branch || "main") + "/" + c.file;
}
function apiUrl() {
  var c = syncCfg();
  return "https://api.github.com/repos/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/contents/" + c.file;
}
function editUrl() {
  var c = syncCfg();
  return "https://github.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/edit/" + encodeURIComponent(c.branch || "main") + "/" + c.file;
}
function newFileUrl() {
  var c = syncCfg();
  return "https://github.com/" + encodeURIComponent(c.user) + "/" +
    encodeURIComponent(c.repo) + "/new/" + encodeURIComponent(c.branch || "main");
}
function b64encode(text) {
  var bytes = textBytes(text), bin = "", i;
  for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

/** Write the encrypted file straight to GitHub. Needs the saved token. */
function autoPush() {
  var c = syncCfg();
  if (!canWrite() || !isUnlocked()) return Promise.resolve("noauth");
  if (ui.pushing) { ui.pushAgain = true; return Promise.resolve("busy"); }
  ui.pushing = true;
  ui.syncState = "saving";
  paintSync();
  return encryptedBlob().then(function (text) {
    var body = {
      message: "Update tracker data (" + deviceName() + ")",
      content: b64encode(text),
      branch: c.branch || "main"
    };
    if (c.sha) body.sha = c.sha;
    return fetch(apiUrl(), {
      method: "PUT",
      headers: { "Authorization": "Bearer " + savedToken(),
                 "Accept": "application/vnd.github+json",
                 "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  }).then(function (res) {
    if (res.status === 409 || res.status === 422) {
      /* someone else wrote first — refresh the file id and retry once */
      return refreshSha().then(function () {
        ui.pushing = false;
        return autoPush();
      });
    }
    if (!res.ok) throw new Error("http " + res.status);
    return res.json().then(function (out) {
      c.sha = out && out.content ? out.content.sha : c.sha;
      c.lastPush = stamp();
      c.lastSeen = c.lastPush;
      saveLocalOnly();
      ui.pushing = false;
      ui.syncState = "ok";
      paintSync();
      if (ui.pushAgain) { ui.pushAgain = false; autoPush(); }
      return "saved";
    });
  }).catch(function (e) {
    ui.pushing = false;
    ui.syncState = String(e.message).indexOf("401") > -1 ? "badtoken" : "offline";
    paintSync();
    return "failed";
  });
}
function refreshSha() {
  var c = syncCfg();
  if (!savedToken()) return Promise.resolve();
  return fetch(apiUrl() + "?ref=" + encodeURIComponent(c.branch || "main"), {
    headers: { "Authorization": "Bearer " + savedToken(), "Accept": "application/vnd.github+json" },
    cache: "no-store"
  }).then(function (res) {
    if (!res.ok) return null;
    return res.json();
  }).then(function (out) {
    if (out && out.sha) { c.sha = out.sha; saveLocalOnly(); }
  }).catch(function () {});
}
/** Save automatically, a moment after you stop making changes. */
function scheduleAutoPush() {
  var c = syncCfg();
  if (!c.auto || !canWrite()) return;
  if (typeof setTimeout !== "function") return;
  clearTimeout(ui.pushTimer);
  ui.syncState = "ahead";
  paintSync();
  ui.pushTimer = setTimeout(function () {
    if (isUnlocked()) autoPush();
  }, 2500);
}

/** Fetch the encrypted file from GitHub and merge it in if it is newer. */
function pullFromGithub(quiet) {
  if (!syncReady()) return Promise.resolve("off");
  if (!isUnlocked()) return Promise.resolve("locked");
  if (typeof fetch !== "function") return Promise.resolve("nofetch");
  ui.syncState = "checking";
  paintSync();
  /* cache-buster so the browser never serves a stale copy */
  return fetch(rawUrl() + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("http " + res.status);
      return res.text();
    })
    .then(function (text) {
      if (!text) { ui.syncState = "empty"; paintSync(); return "empty"; }
      return openBlob(text).then(function (opened) {
        if (!opened) { ui.syncState = "badkey"; paintSync(); return "badkey"; }
        var c = syncCfg();
        var mine = c.lastPush || "";
        var theirs = opened.updatedAt || "";
        if (theirs && theirs <= (c.lastSeen || "")) {
          ui.syncState = "ok"; c.lastPull = stamp(); paintSync(); return "same";
        }
        /* the copy in GitHub is newer than anything this device has sent */
        if (!mine || theirs > mine) {
          var keepSync = JSON.parse(JSON.stringify(c));
          applyLoaded(opened.data);
          db.sync = keepSync;
          c = db.sync;
          c.lastSeen = theirs;
          c.lastPull = stamp();
          saveLocalOnly();
          ui.syncState = "ok";
          render();
          paintSync();
          toast("Updated from GitHub" + (opened.device ? " (saved on " + opened.device + ")" : ""));
          return "pulled";
        }
        ui.syncState = "ahead";
        c.lastPull = stamp();
        paintSync();
        return "ahead";
      });
    })
    .catch(function () { ui.syncState = "offline"; paintSync(); return "offline"; });
}

/** Put the encrypted blob on the clipboard and open GitHub's editor. */
function pushToGithub() {
  if (!syncReady()) { toast("Set up GitHub sync first"); return Promise.resolve(false); }
  if (!isUnlocked()) { toast("Unlock the app first"); return Promise.resolve(false); }
  return encryptedBlob().then(function (text) {
    var c = syncCfg();
    c.lastPush = stamp();
    c.lastSeen = c.lastPush;

function finishSetup(skipRest) {

function paintPin() {
  var dots = el("pinDots").children;
  for (var i = 0; i < dots.length; i++) dots[i].className = i < ui.pin.length ? "on" : "";
}
function pinKey(k) {
  if (k === "⌫") ui.pin = ui.pin.slice(0, -1);
  else if (ui.pin.length < 4) ui.pin += k;
  paintPin();
  if (ui.pin.length === 4) {
    if (ui.pin === db.settings.pin) {
      el("lockScreen").classList.add("hidden");
      ui.pin = "";
      el("lockMsg").textContent = "Everything is stored on this device only.";
    } else {
      el("lockMsg").textContent = "That PIN didn't match. Try again.";
      ui.pin = "";
      paintPin();
    }
  }
}

/* =========================================================
   14. BACKUP, RESTORE, EXAMPLE DATA
   ========================================================= */
function download(name, text, type) {
  try {
    var blob = new Blob([text], { type: type || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (e) { toast("Your browser blocked the download"); return false; }
}
/* =========================================================
   PDF and Excel builders — written from scratch, no libraries,
   so the page stays a single offline file.
   ========================================================= */

function downloadBytes(name, bytes, type) {
  try {
    var blob = new Blob([bytes], { type: type || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (e) { toast("Your browser blocked the download"); return false; }
}

/* =========================================================
   REPORT EXPORTS
   Every export uses exactly the rows the Reports page is showing.
   Two styles, both of which keep the whole refund story:
     summary — one row per transaction, with refund totals
     events  — one row per money event (payment, refund, charge kept)
   ========================================================= */

function safeSlug(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
}
/** money-report_2026-08-01_to_2026-08-31.csv, plus a short safe hint when filtered. */
function reportFileName(ext) {
  var R = reportData(), f = ui.report.f, bits = [];
  if (f.cat) bits.push(safeSlug(f.cat));
  if (f.app) bits.push(safeSlug(appName(f.app)));
  if (f.type && !f.cat) bits.push(safeSlug(f.type === "out" ? "spent" : f.type === "in" ? "received" : f.type));
  if (f.status) bits.push(safeSlug(f.status));
  var mid = bits.length ? "_" + bits.slice(0, 2).join("_") : "";
  var style = (ui.report.style === "events" && (ext === "csv" || ext === "json")) ? "_events" : "";
  return "money-report" + mid + style + "_" + R.from + "_to_" + R.to + "." + ext;
}
function plainMoney(minor) {
  var v = Math.round(minor || 0);
  return (v < 0 ? "-" : "") + (Math.abs(v) / 100).toFixed(2);
}
function currencyWord() { return db.settings.currency || "INR"; }
function statusWord(t) { return (STATUS[effectiveStatus(t)] || STATUS.done).label; }
/** Wording the spec asks for on refunded rows. */
function longStatus(t) {
  var back = refundTotal(t);
  if (t.status === "failed") return stuck(t) > 0 ? "Failed - awaiting reversal" : "Failed";
  if (t.status === "cancelled") return stuck(t) > 0 ? "Cancelled - refund pending" : "Cancelled";
  if (t.status === "pending") return "Waiting";
  if (!back) return "Successful";
  var state = refundState(t);
  return state === "full" ? "Fully refunded" : "Partially refunded";
}
function retainedOf(t) {
  var back = refundTotal(t);
  if (!back || t.type !== "out") return 0;
  if (t.status === "failed" || t.status === "cancelled") return 0;
  return Math.max(0, Math.round(t.amt || 0) - back);
}
function refundDates(t) {
  return (t.refunds || []).map(function (r) { return r.date; }).join("; ");
}
function typeWord(t) {
  return t.type === "out" ? "Expense" : t.type === "in" ? "Income" :
         t.type === "bill" ? "Card bill payment" : "Transfer";
}
function payWord(t) {
  if (t.type === "move" || t.type === "bill") return "Account transfer";
  return t.how === "app" ? "Payment app" : (howLabel(t.how) || "Other");
}

/* ---------- rows: one per transaction ---------- */
var SUMMARY_COLS = [
  "Transaction ID", "Transaction date", "Transaction time", "Time recorded?", "Type", "Category",
  "Payment method", "Payment app", "Card used", "Funding source", "Destination account",
  "Original amount", "Refund received", "Refund dates", "Retained charge", "Pending recovery",
  "Net expense", "Status", "Note", "Currency",
  "Original amount (minor units)", "Net expense (minor units)", "Recorded at", "Last updated"
];
function summaryRows(list) {
  return list.map(function (t) {
    return [
      t.id,
      t.date,
      t.noTime || !t.time ? "" : t.time,
      t.noTime || !t.time ? "Not recorded" : "Recorded",
      typeWord(t),
      t.cat || "",
      payWord(t),
      t.appId ? appName(t.appId) : "",
      (t.type === "out" && isCard(t.acc)) ? (channelLabel(t.channel) || "Not noted") : "",
      accName(t.acc),
      t.to ? accName(t.to) : "",
      plainMoney(t.amt),
      plainMoney(refundTotal(t)),
      refundDates(t),
      plainMoney(retainedOf(t)),
      plainMoney(stuck(t)),
      plainMoney(t.type === "out" ? netSpend(t) : t.type === "in" ? -netIncome(t) : 0),
      longStatus(t),
      t.note || "",
      currencyWord(),
      String(Math.round(t.amt || 0)),
      String(Math.round(t.type === "out" ? netSpend(t) : 0)),
      t.createdAt || "",
      t.updatedAt || ""
    ];
  });
}

/* ---------- rows: one per money event ---------- */
var EVENT_COLS = [
  "Event ID", "Parent transaction ID", "Event type", "Event date", "Event time",
  "Amount", "Direction", "Category", "Payment method", "Payment app",
  "Source or destination", "Status after event", "Note", "Currency",
  "Amount (minor units)", "Recorded at"
];
function eventRows(list) {
  var out = [];
  sortTx(list).forEach(function (t) {
    out.push([
      t.id + "-pay",
      t.id,
      t.type === "out" ? "Original payment" : t.type === "in" ? "Income received" :
        t.type === "bill" ? "Card bill payment" : "Transfer",
      t.date,
      t.noTime || !t.time ? "" : t.time,
      plainMoney(t.amt),
      t.type === "in" ? "In" : t.type === "out" ? "Out" : "Moved",
      t.cat || "",
      payWord(t),
      t.appId ? appName(t.appId) : "",
      t.to ? accName(t.acc) + " -> " + accName(t.to) : accName(t.acc),
      t.status === "done" ? "Successful" : longStatus(t),
      t.note || "",
      currencyWord(),
      String(Math.round(t.amt || 0)),
      t.createdAt || ""
    ]);
    if (t.status === "failed" || t.status === "cancelled") {
      out.push([
        t.id + "-status",
        t.id,
        t.status === "failed" ? "Marked failed" : "Marked cancelled",
        t.date,
        t.noTime || !t.time ? "" : t.time,
        plainMoney(t.deducted || 0),
        Math.round(t.deducted || 0) > 0 ? "Out (deducted)" : "No money moved",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        Math.round(t.deducted || 0) > 0 ? "Amount was deducted and is awaiting return" : "No amount was deducted",
        currencyWord(),
        String(Math.round(t.deducted || 0)),
        t.updatedAt || ""
      ]);
    }
    (t.refunds || []).forEach(function (r, i) {
      out.push([
        r.id || (t.id + "-refund-" + (i + 1)),
        t.id,
        t.status === "failed" ? "Reversal received" : "Refund received",
        r.date,
        "",
        plainMoney(r.amt),
        "In",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(r.to),
        longStatus(t),
        r.note || "",
        currencyWord(),
        String(Math.round(r.amt || 0)),
        t.updatedAt || ""
      ]);
    });
    var kept = retainedOf(t);
    if (kept > 0) {
      out.push([
        t.id + "-retained",
        t.id,
        "Retained charge",
        (t.refunds && t.refunds.length) ? t.refunds[t.refunds.length - 1].date : t.date,
        "",
        plainMoney(kept),
        "Kept by seller",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        "Not returned - counts as the final cost",
        currencyWord(),
        String(Math.round(kept)),
        t.updatedAt || ""
      ]);
    }
    var waiting = stuck(t);
    if (waiting > 0) {
      out.push([
        t.id + "-pending",
        t.id,
        "Pending recovery",
        t.date,
        "",
        plainMoney(waiting),
        "Awaiting return",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        "Still not returned",
        currencyWord(),
        String(Math.round(waiting)),
        t.updatedAt || ""
      ]);
    }
  });
  return out;
}

function parseCsv(text) {
  var rows = [], row = [], cur = "", q = false, i, c;
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.length > 1; });
}
function importCsv(text) {

  var at = function (name) { return head.indexOf(name); };

  if (iDate === -1 || iAmt === -1) { toast("The file needs at least a date and amount column"); return; }
  var added = 0, skipped = 0;
  rows.slice(1).forEach(function (r) {
    var date = (r[iDate] || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; return; }
    var amt = toMinor(r[iAmt]);
    if (amt <= 0) { skipped++; return; }
    var typeRaw = ((iType > -1 ? r[iType] : "") || "spent").toLowerCase();
    var type = typeRaw.indexOf("receiv") > -1 || typeRaw === "in" || typeRaw === "income" ? "in"
             : typeRaw.indexOf("mov") > -1 || typeRaw === "transfer" ? "move" : "out";
    var accName2 = ((iAcc > -1 ? r[iAcc] : "") || "").trim();
    var found = db.accounts.filter(function (a) { return a.name.toLowerCase() === accName2.toLowerCase(); })[0];
    if (!found && accName2) {
      found = { id:id("a"), name:accName2, kind:"bank", bank:"", last4:"", open:0, include:true, primary:false, archived:false };
      db.accounts.push(found);
    }
    if (!found) found = firstBank() || cashAcc();
    if (!found) {
      found = { id:id("a"), name:"Cash", kind:"cash", bank:"", last4:"", open:0, include:true, primary:false, archived:false };
      db.accounts.push(found);
    }
    var time = ((iTime > -1 ? r[iTime] : "") || "").trim();
    db.tx.push({
      id:id("t"), type:type, amt:amt, cat:((iCat > -1 ? r[iCat] : "") || "Other").trim() || "Other",
      acc:found.id, to:"", how:"other", appId:"", date:date,
      time:/^\d{2}:\d{2}$/.test(time) ? time : "", noTime:!/^\d{2}:\d{2}$/.test(time),
      note:((iNote > -1 ? r[iNote] : "") || "").trim(), status:"done", deducted:0, refunds:[],

function pickFile(kind) {

    var f = input.files && input.files[0];

    reader.onerror = function () { toast("That file couldn't be read"); };
    reader.onload = function () {
      var text = String(reader.result || "");
      if (kind === "csv") { importCsv(text); return; }
      var parsed;
      try { parsed = JSON.parse(text); } catch (e) { toast("That doesn't look like a backup file"); return; }
      var payload = parsed && parsed.data ? parsed.data : parsed;
      if (!payload || !Array.isArray(payload.tx)) { toast("That backup is missing its entries"); return; }
      var base = blank();
      Object.keys(base).forEach(function (k) {
        if (payload[k] !== undefined && payload[k] !== null) base[k] = payload[k];
      });
      base.settings = Object.assign(blank().settings, payload.settings || {});
      base.settings.setupDone = true;
      db = base;
      save(); applyTheme(); render();
      toast("Backup restored — " + db.tx.length + " entries");
    };
    reader.readAsText(f);
  };
  input.click();
}

function readForm(form) {
  var out = {}, els = form.elements, i, e;
  for (i = 0; i < els.length; i++) {
    e = els[i];
    if (!e.name) continue;
    if (e.type === "checkbox") {
      if (e.name === "src") { (out.src = out.src || []); if (e.checked) out.src.push(e.value); }
      else out[e.name] = e.checked;
    } else if (e.type === "radio") {
      if (e.checked) out[e.name] = e.value;
    } else out[e.name] = e.value;
  }
  return out;
}
function submitForm(kind, form) {
  var f = readForm(form), t, g;
  switch (kind) {
    case "account": {
      var isCard = f.kind === "card";
      var open = toMinor(f.open);
      var rec = {
        id: f.id || id("a"),
        name: String(f.name || "").trim() || "Account",
        kind: f.kind, bank: String(f.bank || "").trim(),
        last4: String(f.last4 || "").replace(/\D/g, "").slice(0, 4),
        open: isCard ? -Math.abs(open) : open,
        limit: toMinor(f.limit),
        dueDay: f.dueDay ? parseInt(f.dueDay, 10) : null,
        stmtDay: f.stmtDay || "",
        dueRule: f.dueRule || "day",
        dueDays: f.dueDays ? parseInt(f.dueDays, 10) : null,
        primary: !!f.primary, include: !!f.include, archived: !!f.archived
      };
      if (rec.primary) db.accounts.forEach(function (a) { if (a.id !== rec.id) a.primary = false; });
      var found = acc(f.id);
      if (found) db.accounts = db.accounts.map(function (a) { return a.id === f.id ? Object.assign({}, a, rec) : a; });
      else db.accounts.push(rec);
      save(); closeSheet(); render(); toast("Saved"); return;
    }
    case "app": {
      var recA = { id: f.id || id("p"), name: String(f.name || "").trim() || "App",
        src: f.src || [], def: (f.src || [])[0] || "" };
      if (app(f.id)) db.apps = db.apps.map(function (a) { return a.id === f.id ? Object.assign({}, a, recA) : a; });
      else db.apps.push(recA);
      save(); closeSheet(); render(); toast("Saved"); return;
    }
    case "budget": {
      var amt = toMinor(f.amt);
      if (amt > 0) db.budgets[f.cat] = amt; else delete db.budgets[f.cat];
      save(); closeSheet(); render(); toast(amt > 0 ? "Limit saved" : "Limit removed"); return;
    }
    case "monthlyBudget":
      db.monthlyBudget = toMinor(f.amt);
      save(); render(); toast("Saved"); return;
    case "goal":
      db.goals.push({ id: id("g"), name: String(f.name || "").trim() || "Goal",
        target: toMinor(f.target), now: toMinor(f.now) });
      save(); closeSheet(); render(); toast("Goal added"); return;
    case "goalAdd":
      g = db.goals.filter(function (x) { return x.id === f.id; })[0];
      if (g) { g.now = Math.round(g.now + toMinor(f.amt)); save(); }
      closeSheet(); render(); toast("Added to your goal"); return;
    case "bill":
      db.bills.push({ id: id("b"), name: String(f.name || "").trim() || "Bill", amt: toMinor(f.amt),
        day: Math.min(31, Math.max(1, parseInt(f.day, 10) || 1)), cat: f.cat || "Bills",
        acc: f.acc || (firstBank() || {}).id || "", how: "bank", type: "out",
        auto: f.auto === "1", off: false, last: "" });
      save(); runBills(true); closeSheet(); render(); toast("Bill saved"); return;
    case "cat": {
      var name = String(f.name || "").trim();
      if (!name) return;
      if (db.cats.some(function (c) { return c.n.toLowerCase() === name.toLowerCase() && c.k === f.kind; })) {
        toast("You already have that one"); return;
      }
      db.cats.push({ n: name, k: f.kind });
      save();
      if (f.back && ui.draft) { ui.draft.cat = name; refreshSheet(); }
      else { closeSheet(); render(); }
      toast("Category added"); return;
    }
    case "changePw": {
      if (scramble(f.old) !== db.auth.pwHash) { toast("That is not your current password"); return; }
      var problem = passwordProblem(f.pw);
      if (!problem && f.pw !== f.pw2) problem = "The two passwords don't match";
      if (problem) { toast(problem); return; }
      db.auth.pwHash = scramble(f.pw);
      db.auth.changedAt = stamp();
      save(); closeSheet(); render(); toast("Password changed"); return;
    }
    case "sync": {
      var c = syncCfg();
      c.user = String(f.user || "").trim();
      c.repo = String(f.repo || "").trim();
      c.branch = String(f.branch || "main").trim() || "main";
      c.file = String(f.file || "data.json.enc").trim() || "data.json.enc";
      c.on = !!f.on;
      c.auto = !!f.auto;
      if (String(f.token || "").trim()) setToken(String(f.token).trim());
      var phrase = String(f.phrase || "").trim();
      if (c.on && (!c.user || !c.repo)) { toast("Enter your username and repository"); return; }
      if (c.on && !phrase) { toast("Choose a passphrase so your data can be encrypted"); return; }
      if (c.auto && !savedToken()) { toast("Automatic saving needs a token — added it under 'How do I get a token?'"); }
      if (phrase !== savedPhrase()) { setPhrase(phrase); lockUp(); }
      save(); closeSheet();
      if (!c.on) { render(); paintSync(); toast("Sync is off"); return; }
      unlockSync().then(function (okNow) {
        if (!okNow) { toast("Could not set up encryption in this browser"); return; }
        startSyncTimer();
        return refreshSha().then(function () {
          return pullFromGithub(false);
        }).then(function (r) {
          render(); paintSync();
          if (r === "empty" && canWrite()) return autoPush().then(function () { toast("Sync is on — first copy saved"); });
          toast(canWrite() ? "Sync is on — saving happens by itself" : "Sync is on — reading is automatic");
        });
      });
      return;
    }
    case "reRecover": {

        return unlockWith(f.pw).then(function (okNow) {
          if (!okNow) { toast("That is not your password"); return; }
          ui.recovery = recovery;

        });
      });
      return;
    }
    case "profile":
      db.profile.name = String(f.name || "").trim();
      save(); render(); toast("Saved"); return;
    case "pin": {
      var pin = String(f.pin || "").replace(/\D/g, "");
      if (pin.length !== 4) { toast("A PIN needs exactly 4 digits"); return; }
      db.settings.pin = pin; save(); render(); toast("PIN saved"); return;
    }
    case "payCard": {
      var pay = toMinor(f.amt);
      if (pay <= 0) { toast("Enter an amount"); return; }
      if (f.from === f.card) { toast("Pick a different account to pay from"); return; }
      var payDate = f.date || today();
      if (payDate > today()) { toast("A payment can't be dated in the future"); return; }
      var already = db.tx.filter(function (t2) {
        return t2.type === "bill" && t2.to === f.card && t2.acc === f.from &&
          t2.date === payDate && Math.round(t2.amt) === pay;
      })[0];
      if (already) { toast("That same payment is already recorded"); return; }
      var stPay = f.stmt ? statementById(f.stmt) : null;
      var excess = 0;
      if (stPay) {
        var left = statementRemaining(stPay);
        if (pay > left) excess = pay - left;
      }
      db.tx.push({ id: id("t"), type: "bill", amt: pay, cat: "", acc: f.from, to: f.card,
        how: "bank", appId: "", date: payDate, time: f.time || hm(new Date()), noTime: false,
        note: String(f.note || "").trim() || "Credit card bill", ref: String(f.ref || "").trim(),
        stmtId: f.stmt || "", status: "done", deducted: 0, refunds: [],
        createdAt: stamp(), updatedAt: stamp() });
      save(); closeSheet(); render();
      toast(money(pay) + " paid" + (excess > 0
        ? " \u2014 " + money(excess) + " more than this bill, kept against the card"
        : ""));
      return;
    }
    case "statement": {
      var cardS = acc(f.card);
      if (!cardS) return;
      var closeD = f.closeDate || today();
      if (closeD > today()) { toast("A statement can't close in the future"); return; }
      if (f.dueDate && f.dueDate < closeD) { toast("The due date is before the statement date"); return; }
      var balS = toMinor(f.balance);
      if (balS < 0) { toast("Enter the statement balance"); return; }
      var minS = toMinor(f.minDue);
      if (minS > balS) { toast("The minimum due is more than the whole bill"); return; }
      var clash = (db.statements || []).filter(function (x) {
        return x.cardId === f.card && x.closeDate === closeD && x.id !== f.id;
      })[0];
      if (clash) { toast("There is already a statement closing on that date"); return; }
      var fromS = f.cycleFrom || "";
      var actS = cardActivity(f.card, fromS, closeD);
      var feesS = 0;
      db.tx.forEach(function (t2) {
        if (t2.acc === f.card && t2.charge && t2.date >= (fromS || "") && t2.date <= closeD) {
          feesS += Math.round(t2.amt || 0);
        }
      });
      var rec = {
        id: f.id || id("s"), cardId: f.card, closeDate: closeD, cycleFrom: fromS,
        dueDate: f.dueDate || expectedDue(cardS, closeD),
        balance: balS, minDue: minS,
        prevBalance: toMinor(f.prevBalance), purchases: toMinor(f.purchases),
        fees: toMinor(f.fees), interest: toMinor(f.interest), emi: toMinor(f.emi),
        credits: toMinor(f.credits), pastDue: toMinor(f.pastDue),
        ref: String(f.ref || "").trim(), note: String(f.note || "").trim(),
        calc: { charges: actS.charges, fees: feesS, refunds: actS.refunds,
                total: Math.max(0, actS.charges - actS.refunds) },
        confirmedAt: stamp()
      };
      db.statements = db.statements || [];
      var existingS = statementById(f.id);
      if (existingS) {
        rec.confirmedAt = existingS.confirmedAt || stamp();
        rec.updatedAt = stamp();
        db.statements = db.statements.map(function (x) { return x.id === f.id ? Object.assign({}, x, rec) : x; });
      } else {
        db.statements.push(rec);
      }
      cardS.remindOn = "";
      save(); closeSheet();
      ui.stmtId = rec.id; ui.cardId = f.card; ui.view = "stmt"; render();
      var gap = balS - rec.calc.total;
      toast(existingS ? "Statement updated"
        : (gap === 0 ? "Bill confirmed" : "Bill confirmed \u2014 " + money(Math.abs(gap)) + " different from the tracked total"));
      return;
    }
    case "charge": {
      var cardCh = acc(f.card);
      if (!cardCh) return;
      var amtCh = toMinor(f.amt);
      if (amtCh <= 0) { toast("Enter an amount"); return; }
      var kindLabel = (CHARGE_KINDS.filter(function (c) { return c.id === f.kind; })[0] || {}).label || "Charge";
      db.tx.push({ id: id("t"), type: "out", amt: amtCh,
        cat: f.kind === "emi" ? "Loan/EMI" : "Bills",
        acc: f.card, to: "", how: "card", appId: "",
        date: f.date || today(), time: hm(new Date()), noTime: false,
        note: String(f.note || "").trim() || kindLabel, charge: f.kind,
        status: "done", deducted: 0, refunds: [], createdAt: stamp(), updatedAt: stamp() });
      save(); closeSheet(); render(); toast(kindLabel + " of " + money(amtCh) + " added");
      return;
    }
    case "cardCheck": {
      var cardK = acc(f.id);
      if (!cardK) return;
      var real = toMinor(f.real);
      ui.cardCheck = { id: f.id, real: real, diff: real - cardOutstanding(cardK) };
      render(); return;
    }
    case "refund": {
      t = tx(f.id);
      if (!t) return;
      var back = toMinor(f.amt);
      if (back <= 0) { toast("Enter how much came back"); return; }
      var basis = (t.status === "failed" || t.status === "cancelled") ? Math.round(t.deducted || 0) : Math.round(t.amt || 0);
      if (refundTotal(t) + back > basis) { toast("That's more than the original " + money(basis)); return; }
      var twin = (t.refunds || []).filter(function (r) {
        return Math.round(r.amt) === back && r.date === (f.date || today());
      })[0];
      if (twin) { toast("You already recorded that refund"); return; }
      t.refunds = (t.refunds || []).concat([{ id: id("r"), amt: back, date: f.date || today(),
        to: f.to || t.acc, note: String(f.note || "").trim() }]);
      t.updatedAt = stamp();
      save(); openSheet(txDetailSheet(t)); render(); toast(money(back) + " came back"); return;
    }
    case "mark": {
      t = tx(f.id);
      if (!t) return;
      var took = f.took === "full" ? Math.round(t.amt) : f.took === "part" ? toMinor(f.amt) : 0;
      if (f.took === "part" && took <= 0) { toast("Enter how much they took"); return; }
      if (took > Math.round(t.amt)) { toast("That's more than the original amount"); return; }
      t.status = f.to === "failed" ? "failed" : "cancelled";
      t.deducted = took;
      t.updatedAt = stamp();
      save(); openSheet(txDetailSheet(t)); render();
      toast(took > 0 ? money(took) + " marked as waiting to come back" : "Marked — no money left your account");
      return;
    }
  }
}

/* =========================================================
   17. WIRING
   ========================================================= */
function onClick(e) {
  var hit = e.target.closest ? e.target.closest("[data-act]") : null;
  if (hit) {
    var actName = hit.getAttribute("data-act");
    if (actName === "setCurrency") return;
    e.preventDefault();
    if (actName.indexOf("au") === 0 && ui.auth && authAct(actName)) return;
    act(actName, hit.dataset || {});
    return;
  }
  if (e.target.id === "scrim") { closeSheet(); ui.draft = null; }
}
function onSubmit(e) {
  var form = e.target.closest ? e.target.closest("form[data-form]") : null;
  if (!form) return;
  e.preventDefault();
  submitForm(form.getAttribute("data-form"), form);
}
function onInput(e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute("data-f")) {
    ui.filters = ui.filters || blankFilters();
    ui.filters[t.getAttribute("data-f")] = t.value;
    var key = t.getAttribute("data-f"), pos = t.selectionStart, elId = t.id;
    clearTimeout(onInput.t);
    onInput.t = setTimeout(function () {
      render();
      var again = el(elId);
      if (again) {
        try { again.focus(); if (again.setSelectionRange && pos !== null && again.type === "text") again.setSelectionRange(pos, pos); }
        catch (err) {}
      }
    }, key === "q" ? 300 : 0);
    return;
  }
  if (t.getAttribute && t.getAttribute("data-rf")) {
    ui.report = ui.report || defaultReport();
    ui.report.f[t.getAttribute("data-rf")] = t.value;
    var fid = t.id;
    clearTimeout(onInput.t);
    onInput.t = setTimeout(function () {
      render();
      var again = el(fid);
      if (again && again.focus) { try { again.focus(); } catch (err) {} }
    }, t.getAttribute("data-rf") === "q" ? 300 : 0);
    return;
  }
  if (t.getAttribute && t.getAttribute("data-rep")) {
    ui.report = ui.report || { id:"custom", from:"", to:"" };
    var repKey = t.getAttribute("data-rep");
    ui.report[repKey] = t.value;
    if (repKey === "style") { render(); return; }
    ui.report.id = "custom";
    render();
    return;
  }
  if (t.getAttribute && t.getAttribute("data-field") && ui.draft) {
    ui.draft[t.getAttribute("data-field")] = t.value;
    if (t.getAttribute("data-field") === "acc") refreshSheet();
    return;
  }
  if (t.id === "dAmt" || t.id === "dNote") {
    grabFields();
    var btn = el("sheet") ? el("sheet").querySelector('[data-act="dSave"]') : null;
    var box = el("sheet") ? el("sheet").querySelector(".recap") : null;
    if (btn) btn.disabled = !draftReady(ui.draft);
    if (box) box.innerHTML = recap(ui.draft);
  }
}
function onChange(e) {
  var t = e.target;
  if (t.id === "recSaved") { act("recAck", {}); return; }
  if (t.getAttribute && t.getAttribute("data-act") === "setCurrency") {
    db.settings.currency = t.value; save(); render();
    toast("Showing amounts in " + t.value + " — nothing was converted");
    return;
  }
  if (t.getAttribute && (t.getAttribute("data-f") || t.getAttribute("data-field"))) onInput(e);
  if (t.getAttribute && t.getAttribute("data-s")) grabSetup();
}
function onKey(e) {
  if (e.key === "Escape" && !el("scrim").classList.contains("hidden")) { closeSheet(); ui.draft = null; }
}

function boot() {
  load();
  applyTheme();
  runBills(true);
  ui.month = mKey(new Date());
  ui.cal = ui.month;
  ui.filters = blankFilters();

  document.addEventListener("click", onClick);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  el("themeBtn").addEventListener("click", function () {
    var order = ["auto", "light", "dark"];
    db.settings.theme = order[(order.indexOf(db.settings.theme || "auto") + 1) % 3];
    save(); applyTheme();
    toast(db.settings.theme === "auto" ? "Following your phone" : db.settings.theme === "dark" ? "Dark" : "Light");
    if (ui.view === "settings") render();
  });

  var testing = typeof window !== "undefined" && window.__MT_TEST__;
  if (!db.seeded && !testing) {
    db.auth = { user:"Abhinay", pwHash:"", dob:"2003-05-29", gender:"Male",
      createdAt: stamp(), lastSignIn:"" };
    db.profile.name = "Abhinay";
    seedData();
  }

  /* opens straight to your money — no sign-in screen */
  ui.authed = true;
  paintSync();
  render();
  if (db.settings.pin) showLock();
  if (!db.settings.setupDone) startSetup();
  if (syncReady()) { unlockSync().then(function () { pullFromGithub(true); }); startSyncTimer(); }
  if (db.settings.pin) showLock();
  if (!db.settings.setupDone) startSetup();
}

/* exposed for tests; harmless in the browser */
return {
  boot: boot, render: render, act: act, submitForm: submitForm,
  state: function () { return db; }, ui: ui,
  calc: { balance: balance, netWorth: netWorth, netSpend: netSpend, netIncome: netIncome,
          stuck: stuck, totalsFor: totalsFor, refundTotal: refundTotal, cardInfo: cardInfo,
          moneyOut: moneyOut, effectiveStatus: effectiveStatus, budgetTotal: budgetTotal,
          byCategory: byCategory, alerts: alerts, runBills: runBills },
  helpers: { toMinor: toMinor, toMajor: toMajor, money: money, id: id, today: today, blank: blank,
             csvOf: csvOf, importCsv: importCsv, backupJson: backupJson, loadDemo: loadDemo,
             removeDemo: removeDemo, setView: function (v) { ui.view = v; }, openAdd: openAdd,
             draft: function () { return ui.draft; }, saveDraft: saveDraft, filtered: filtered,
             setFilters: function (f) { ui.filters = Object.assign(blankFilters(), f); },
             startSetup: startSetup, finishSetup: finishSetup, setupDraft: function () { return ui.setupDraft; },
             pinKey: pinKey, load: load, save: save, tx: tx, acc: acc, app: app,
             reportData: reportData, reportCsv: reportCsv, reportJson: reportJson,
             reportFileName: reportFileName, reportMatches: reportMatches, rangeError: rangeError,
             summaryRows: summaryRows, eventRows: eventRows,
             SUMMARY_COLS: SUMMARY_COLS, EVENT_COLS: EVENT_COLS,
             defaultReport: defaultReport, blankReportFilters: blankReportFilters,
             buildPdf: buildPdf, buildXlsx: buildXlsx, reportTables: reportTables,
             downloadPdf: downloadPdf, downloadExcel: downloadExcel, zip: zip, crc32: crc32, rangeDates: rangeDates,
             setReport: function (r) { ui.report = Object.assign(defaultReport(), r || {}); if (r && r.f) ui.report.f = Object.assign(blankReportFilters(), r.f); },
             getReport: function () { return ui.report; },
             setupEncryption: setupEncryption, unlockWith: unlockWith, isEncrypted: isEncrypted,
             isUnlocked: isUnlocked, saveEncrypted: saveEncrypted, encryptedBlob: encryptedBlob,
             openBlob: openBlob, lockUp: lockUp, unlockWithRecovery: unlockWithRecovery,
             cryptoAvailable: cryptoAvailable, applyLoaded: applyLoaded, saveLocalOnly: saveLocalOnly,
             syncCfg: syncCfg, syncReady: syncReady, rawUrl: rawUrl, editUrl: editUrl,
             apiUrl: apiUrl, autoPush: autoPush, canWrite: canWrite, setToken: setToken,
             savedToken: savedToken, setPhrase: setPhrase, savedPhrase: savedPhrase,
             unlockSync: unlockSync, scheduleAutoPush: scheduleAutoPush, refreshSha: refreshSha,
             pullFromGithub: pullFromGithub, pushToGithub: pushToGithub, syncWords: syncWords,
             showAuth: showAuth, authAct: authAct, scramble: scramble, seedData: seedData,
             hasAccount: hasAccount, signOut: signOut, authState: function () { return ui.auth; },
             passwordProblem: passwordProblem, usernameProblem: usernameProblem, dobProblem: dobProblem,
             readReceipt: readReceipt, chooseDate: chooseDate, findDates: findDates,
             findTimeNear: findTimeNear, receipt: function () { return ui.receipt; },
             saveReceipt: saveReceipt,
             cards: cards, cardMoney: cardMoney, cardState: cardState, currentCycle: currentCycle,
             nextClosing: nextClosing, lastExpectedClosing: lastExpectedClosing, expectedDue: expectedDue,
             closingDateFor: closingDateFor, cardActivity: cardActivity, unbilled: unbilled,
             statementsOf: statementsOf, statementById: statementById, statementRemaining: statementRemaining,
             minStillDue: minStillDue, statementState: statementState, paidOnStatement: paidOnStatement,
             statementCredits: statementCredits, unpaidStatements: unpaidStatements,
             cycleCsv: cycleCsv, stmtCsv: stmtCsv, cardAlerts: cardAlerts, cardTile: cardTile,
             setCard: function (x) { ui.cardId = x; }, setStmt: function (x) { ui.stmtId = x; },
             calendar: calendar, txDetail: function (t) { return txDetailSheet(t); },
             addSheetHtml: function () { return addSheet(); } }
};

})();

if (typeof document !== "undefined" && document.addEventListener) {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", MT.boot);
  else MT.boot();
}
if (typeof module === "object" && module.exports) module.exports = MT;
</script>
