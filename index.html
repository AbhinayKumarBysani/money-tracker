/* =========================================================
   INSTALLING, AND WORKING WITHOUT A CONNECTION
   ---------------------------------------------------------
   The manifest and the offline worker are built here as
   data URLs, so the app stays one file with nothing to
   fetch. A browser without support simply carries on.
   ========================================================= */
var ICON_SVG =
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
  '<rect width="192" height="192" rx="42" fill="#0f766e"/>' +
  '<text x="96" y="132" font-size="104" font-family="system-ui,sans-serif" ' +
  'font-weight="700" fill="#fff" text-anchor="middle">\u20b9</text></svg>';
function iconUrl() {
  return "data:image/svg+xml;base64," + btoa(ICON_SVG);
}
function manifestUrl() {
  var m = {
    name: "Money Tracker", short_name: "Money", start_url: ".", scope: ".",
    display: "standalone", background_color: "#15181d", theme_color: "#0f766e",
    description: "Your own daily money tracker. Everything stays on your device.",
    icons: [
      { src: iconUrl(), sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
      { src: iconUrl(), sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  return "data:application/manifest+json;base64," + btoa(unescape(encodeURIComponent(JSON.stringify(m))));
}
/** Add the manifest and icon without needing extra files on the server. */
function wireInstall() {
  if (typeof document === "undefined" || !document.createElement) return;
  try {
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = manifestUrl();
    if (document.head && document.head.appendChild) document.head.appendChild(link);
    var icon = document.createElement("link");
    icon.rel = "apple-touch-icon";
    icon.href = iconUrl();
    if (document.head && document.head.appendChild) document.head.appendChild(icon);
  } catch (e) { /* an engine without data-URL manifests still runs fine */ }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("beforeinstallprompt", function (e) {
      if (e && e.preventDefault) e.preventDefault();
      ui.installer = e;
      paintInstall();
    });
    window.addEventListener("appinstalled", function () {
      ui.installer = null;
      ui.installed = true;
      paintInstall();
      toast("Installed \u2014 your data came with it");
    });
  }
}
function canInstall() { return !!ui.installer; }
function isInstalled() {
  if (ui.installed) return true;
  try {
    if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
  } catch (e) {}
  return !!(typeof navigator !== "undefined" && navigator.standalone);
}
function doInstall() {
  var e = ui.installer;
  if (!e || !e.prompt) { toast("Your browser installs from its own menu"); return; }
  e.prompt();
  ui.installer = null;
  paintInstall();
}
function paintInstall() {
  var box = el("installBar");
  if (!box) return;
  if (!canInstall() || isInstalled()) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = '<div class="note info"><span aria-hidden="true">\ud83d\udcf1</span><div>' +
    "<b>Add this to your home screen.</b> It opens like an app, works without a " +
    "connection, and keeps everything you have already entered.<br>" +
    '<button type="button" class="btn s" data-act="install" style="margin-block-start:8px">' +
    "Install</button> " +
    '<button type="button" class="btn g s" data-act="installLater" ' +
    'style="margin-block-start:8px">Not now</button></div></div>';
}
/** Keep a copy of this page so it opens with no connection. */
function wireOffline() {
  if (typeof navigator === "undefined" || !navigator.serviceWorker) return;
  var code =
    "var C='mt-v1';" +
    "self.addEventListener('install',function(e){self.skipWaiting();});" +
    "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});" +
    "self.addEventListener('fetch',function(e){" +
    "if(e.request.method!=='GET')return;" +
    /* network first, so a new upload is never hidden behind an old copy */
    "e.respondWith(fetch(e.request).then(function(r){" +
    "var c=r.clone();caches.open(C).then(function(k){k.put(e.request,c);});return r;" +
    "}).catch(function(){return caches.match(e.request);}));});";
  try {
    var url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    navigator.serviceWorker.register(url).catch(function () { /* no offline copy, still fine */ });
  } catch (e) { /* blob workers are blocked in some setups; the app still runs */ }
}

/* ---------- searching everything ---------- */
/** Look through notes, shops, amounts, categories, accounts and apps. */
function searchAll(q) {
  var s = String(q || "").trim().toLowerCase();
  if (!s) return [];
  var num = s.replace(/[^0-9.]/g, "");
  return db.tx.filter(function (t) {
    var hay = [
      t.note, t.merchant, t.cat, howLabel(t.how), appName(t.appId),
      accName(t.acc), accName(t.to), fDate(t.date), toMajor(t.amt), plainMoney(t.amt)
    ].filter(Boolean).join(" ").toLowerCase();
    if (hay.indexOf(s) > -1) return true;
    if (num && String(toMajor(t.amt)).indexOf(num) > -1) return true;
    return false;
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

/* ---------- saying things out loud ---------- */
/** Announce a change once, for anyone using a screen reader. */
function announce(msg) {
  var box = el("live");
  if (!box) return;
  /* clearing first makes a repeated message announce again */
  box.textContent = "";
  if (announce.t && typeof clearTimeout === "function") clearTimeout(announce.t);
  if (typeof setTimeout === "function") {
    announce.t = setTimeout(function () { box.textContent = String(msg || ""); }, 60);
  } else {
    box.textContent = String(msg || "");
  }
}

/* =========================================================
   MONEY HEALTH
   ---------------------------------------------------------
   Each figure is offered only when the recorded data can
   actually support it. Anything that cannot be worked out
   says why, instead of showing a number that is not real.
   ========================================================= */
function healthCard(label, value, note, tone) {
  return { label: label, value: value, note: note || "", tone: tone || "", known: true };
}
function healthUnknown(label, why) {
  return { label: label, value: null, note: why, tone: "unknown", known: false };
}
function moneyHealth() {
  var mk = mKey(new Date());
  var month = txIn(mk);
  var out = [];

  out.push(healthCard("Money you can spend", money(spendable()),
    "in banks, cash and wallets"));

  var days = daysToPayday();
  if (days === null) {
    out.push(healthUnknown("Days until pay",
      "No pay date set, so this cannot be worked out."));
    out.push(healthUnknown("Safe to spend a day", "Needs a pay date to divide the money over."));
  } else {
    var p = safeSpendPlan();
    out.push(healthCard("Days until pay", days === 0 ? "today" : String(days),
      fDate(nextPayday()) + " \u00b7 " + payWords()));
    out.push(healthCard("Safe to spend a day",
      p.perDay === null ? "\u2014" : money(p.perDay),
      "after " + money(p.essential) + " already promised",
      p.free < 0 ? "bad" : ""));
  }

  var due = commitments(today(), isoOf(new Date(Date.now() + 30 * 86400000)));
  out.push(healthCard("Promised in 30 days",
    money(due.reduce(function (s, x) { return s + x.amt; }, 0)),
    due.length + (due.length === 1 ? " payment" : " payments") + " already known"));

  out.push(healthCard("Spent this month", money(trueSpend(month)),
    money(cuttable(month)) + " of it you have some say over"));

  /* savings rate needs income recorded, or it is a made-up number */
  var inMonth = totalsFor(month).in;
  if (inMonth <= 0) {
    out.push(healthUnknown("How much you keep",
      "No money coming in has been recorded this month, so there is nothing to measure against."));
  } else {
    var kept = byRole(month);
    var rate = Math.round(((kept.savings + kept.investment) / inMonth) * 100);
    out.push(healthCard("How much you keep", rate + "%",
      money(kept.savings + kept.investment) + " of " + money(inMonth) + " that came in",
      rate >= 20 ? "good" : rate > 0 ? "" : "bad"));
  }

  /* credit use, across pools so a shared limit counts once */
  var seen = {}, lim = 0, used = 0;
  cards().forEach(function (c) {
    var k = c.sharedLimit || c.id;
    if (seen[k]) return;
    seen[k] = 1;
    var m = cardMoney(c);
    lim += m.limit; used += m.poolUsed;
  });
  if (!lim) {
    out.push(healthUnknown("Credit used", "No card limits saved yet."));
  } else {
    var pct = Math.round((used / lim) * 100);
    out.push(healthCard("Credit used", pct + "%",
      money(used) + " of " + money(lim),
      pct >= 70 ? "bad" : pct >= 30 ? "warn" : "good"));
  }

  var bt = budgetTotal();
  if (!bt) {
    out.push(healthUnknown("Budget used", "No budget set, so there is nothing to measure against."));
  } else {
    var bp = Math.round((trueSpend(month) / bt) * 100);
    out.push(healthCard("Budget used", bp + "%",
      money(trueSpend(month)) + " of " + money(bt),
      bp > 100 ? "bad" : bp > 80 ? "warn" : "good"));
  }

  /* how long your money would last at your own recorded rate */
  var perDay = dailyNormal();
  if (perDay === null || perDay <= 0) {
    out.push(healthUnknown("Money would last",
      "Needs at least one finished month to know what a normal day costs."));
  } else {
    var lasts = Math.floor(spendable() / perDay);
    out.push(healthCard("Money would last", lasts + (lasts === 1 ? " day" : " days"),
      "at about " + money(perDay) + " a day, if nothing came in",
      lasts < 14 ? "bad" : lasts < 30 ? "warn" : "good"));
  }
  return out;
}

/* ---------- what is coming, day by day ---------- */
function moneyCalendar(days) {
  var n = days || 45;
  var from = today();
  var end = new Date();
  end.setDate(end.getDate() + n);
  var to = isoOf(end);
  var byDay = {};
  var put = function (date, item) {
    if (!byDay[date]) byDay[date] = { date: date, out: 0, in: 0, items: [] };
    byDay[date].items.push(item);
    if (item.dir === "in") byDay[date].in += item.amt;
    else byDay[date].out += item.amt;
  };
  commitments(from, to).forEach(function (x) {
    put(x.date, { what: x.what, amt: x.amt, kind: x.kind, sure: x.sure, dir: "out" });
  });
  /* salary only when the user set one — never assumed */
  var c = payCfg();
  if (paySet() && c.amount) {
    var d = new Date();
    for (var i = 0; i < 3; i++) {
      var pd = nextPayday(isoOf(new Date(d.getFullYear(), d.getMonth() + i, 1)));
      if (pd && pd >= from && pd <= to) {
        put(pd, { what: "Pay expected", amt: c.amount, kind: "pay", sure: false, dir: "in" });
      }
    }
  }
  return Object.keys(byDay).sort().map(function (k) {
    var g = byDay[k];
    g.away = Math.round((dateFrom(k) - dateFrom(from)) / 86400000);
    g.net = g.in - g.out;
    return g;
  });
}

/* =========================================================
   NO-SPEND DAYS, EMERGENCY COVER, AND PACE
   ---------------------------------------------------------
   A day you only moved money into savings is still a
   no-spend day, because saving is not spending. Cover is
   measured against essentials only. Pace divides by the
   days you have LEFT, never the days gone.
   ========================================================= */
function spentOn(iso) {
  return txOn(iso).reduce(function (s, t) {
    if (t.potId || t.fundId) return s;      /* into savings, not spent */
    if (t.type === "bill") return s;        /* paying a card bill is not new spending */
    return s + netSpend(t);
  }, 0);
}
function noSpendDays(mk) {
  var month = mk || mKey(new Date());
  var dim = mDays(month), td = today();
  var days = [], run = 0, best = 0, current = 0, count = 0;
  for (var i = 1; i <= dim; i++) {
    var iso = month + "-" + p2(i);
    if (iso > td) break;                    /* a day that has not happened is not a win */
    var spent = spentOn(iso);
    var free = spent === 0;
    days.push({ date: iso, spent: spent, free: free });
    if (free) { count++; run++; if (run > best) best = run; }
    else run = 0;
  }
  /* the run still going right now */
  for (var j = days.length - 1; j >= 0; j--) {
    if (days[j].free) current++; else break;
  }
  return { days: days, count: count, best: best, current: current,
           soFar: days.length, month: month };
}

/* ---------- emergency cover ---------- */
function emergencyCfg() {
  if (!db.emergency || typeof db.emergency !== "object") db.emergency = { months: 0 };
  return db.emergency;
}
function setEmergencyTarget(months) {
  emergencyCfg().months = Math.max(0, Math.min(24, parseInt(months, 10) || 0));
  save();
  return emergencyCfg();
}
/** What a month of essentials costs, from finished months only. */
function essentialMonthly() {
  var done = monthsWithData().filter(function (m) { return m < mKey(new Date()); });
  if (!done.length) return null;
  var use = done.slice(-3);
  var total = use.reduce(function (s, m) {
    return s + byRole(txIn(m)).essential;
  }, 0);
  var avg = Math.round(total / use.length);
  return avg > 0 ? { amount: avg, months: use.length, using: use } : null;
}
function emergencyCover() {
  var need = essentialMonthly();
  var have = spendable() + potsTotal();
  var target = emergencyCfg().months;
  if (!need) {
    return { known: false, have: have, target: target,
      why: "No finished month with essential spending recorded yet, so a month of " +
           "essentials cannot be worked out. Mark your categories as essential in Budget " +
           "and this appears once a month completes." };
  }
  var months = need.amount > 0 ? have / need.amount : 0;
  return {
    known: true, have: have, perMonth: need.amount, basedOn: need.months,
    months: months, target: target,
    shortfall: target > 0 ? Math.max(0, need.amount * target - have) : 0,
    method: "Your money in accounts and set aside (" + money(have) +
      ") divided by what a month of essentials costs (" + money(need.amount) +
      ", averaged over your last " + need.months +
      (need.months === 1 ? " finished month" : " finished months") + ")."
  };
}

/* ---------- pace, and where the month is heading ---------- */
function spendingPace(mk) {
  var month = mk || mKey(new Date());
  var dim = mDays(month), td = today();
  var isNow = month === mKey(new Date());
  var elapsed = isNow ? new Date().getDate() : dim;
  var left = Math.max(0, dim - elapsed);
  var spent = spendIn(month);
  var budget = budgetTotal();
  var perDaySoFar = elapsed > 0 ? Math.round(spent / elapsed) : 0;
  var out = {
    month: month, elapsed: elapsed, left: left, dim: dim,
    spent: spent, perDaySoFar: perDaySoFar, isNow: isNow,
    /* a straight-line projection, clearly labelled */
    projection: Math.round(perDaySoFar * dim),
    projectionBasis: "Based on the " + money(spent) + " recorded between " +
      fDate(month + "-01") + " and " + fDate(isNow ? td : month + "-" + p2(dim)) +
      " \u2014 " + elapsed + (elapsed === 1 ? " day" : " days") + "."
  };
  if (budget > 0) {
    out.budget = budget;
    out.remaining = budget - spent;
    out.hasBudget = true;
    /* divide by days LEFT, not days gone */
    out.perDayLeft = left > 0 ? Math.round((budget - spent) / left) : null;
    out.lastDay = left === 0;
    out.overBudget = spent > budget;
  } else {
    out.hasBudget = false;
    out.why = "No budget set, so there is no pace to keep to. Set one in Budget and this " +
      "shows what you have left for each remaining day.";
  }
  return out;
}

/* =========================================================
   REFUNDS, FEES, AND PAYMENTS THAT FAILED
   ---------------------------------------------------------
   A shortfall is only called a shortfall when you said a
   full refund was expected. Otherwise it is simply what was
   returned, and the difference is stated without blame.
   ========================================================= */
function refundRows() {
  return db.tx.filter(function (t) {
    return (t.refunds && t.refunds.length) || stuck(t) > 0;
  }).map(function (t) {
    var back = refundTotal(t);
    var paid = Math.round(t.deducted || 0) || Math.round(t.amt || 0);
    var waiting = stuck(t);
    var state = waiting > 0 ? (back > 0 ? "part" : "waiting")
      : back >= paid ? "full" : back > 0 ? "part" : "none";
    var last = (t.refunds || []).slice().sort(function (a, b) {
      return String(a.date).localeCompare(String(b.date));
    })[(t.refunds || []).length - 1];
    return {
      tx: t, paid: paid, back: back, waiting: waiting, state: state,
      gap: Math.max(0, paid - back),
      days: last ? Math.round((dateFrom(today()) - dateFrom(last.date)) / 86400000)
                 : Math.round((dateFrom(today()) - dateFrom(t.date)) / 86400000),
      lastOn: last ? last.date : ""
    };
  }).sort(function (a, b) { return b.waiting - a.waiting || (a.tx.date < b.tx.date ? 1 : -1); });
}
function refundSummary() {
  var rows = refundRows();
  return {
    rows: rows,
    got: rows.reduce(function (s, r) { return s + r.back; }, 0),
    waiting: rows.reduce(function (s, r) { return s + r.waiting; }, 0),
    full: rows.filter(function (r) { return r.state === "full"; }).length,
    part: rows.filter(function (r) { return r.state === "part"; }).length,
    open: rows.filter(function (r) { return r.waiting > 0; }),
    slow: rows.filter(function (r) { return r.waiting > 0 && r.days > 14; })
  };
}
/** Fees over a whole year, from what is written down. */
function feesInYear(year) {
  var y = String(year || new Date().getFullYear());
  var byKind = {}, total = 0, items = [];
  db.tx.forEach(function (t) {
    if (String(t.date).slice(0, 4) !== y) return;
    var text = [t.note, t.merchant, t.cat].filter(Boolean).join(" ");
    var kind = "";
    for (var i = 0; i < LEAK_WORDS.length; i++) {
      if (LEAK_WORDS[i].re.test(text)) { kind = LEAK_WORDS[i].kind; break; }
    }
    var kept = 0;
    if (t.status === "failed" || t.status === "cancelled") {
      kept = Math.round(t.deducted || 0) - refundTotal(t);
      if (kept > 0 && !kind) kind = "cancellation";
    }
    if (!kind) return;
    var amt = kept > 0 ? kept : netSpend(t);
    if (amt <= 0) return;
    total += amt;
    if (!byKind[kind]) byKind[kind] = { kind: kind, label: LEAK_LABEL[kind] || kind, amt: 0, n: 0 };
    byKind[kind].amt += amt;
    byKind[kind].n++;
    items.push(t);
  });
  return {
    year: y, total: total, count: items.length,
    groups: Object.keys(byKind).map(function (k) { return byKind[k]; })
      .sort(function (a, b) { return b.amt - a.amt; }),
    months: monthsWithData().filter(function (m) { return m.indexOf(y) === 0; }).length
  };
}
/** Payments that did not go through. */
function failedRows(mk) {
  var month = mk || mKey(new Date());
  return db.tx.filter(function (t) {
    var st = effectiveStatus(t);
    return (st === "failed" || st === "cancelled") && mOf(t.date) === month;
  });
}
function failedSummary(mk) {
  var month = mk || mKey(new Date());
  var rows = failedRows(month);
  var byApp = {}, byAcc = {}, kept = 0, held = 0;
  rows.forEach(function (t) {
    var a = t.appId ? appName(t.appId) : howLabel(t.how);
    byApp[a] = (byApp[a] || 0) + 1;
    var n = accName(t.acc);
    byAcc[n] = (byAcc[n] || 0) + 1;
    var k = Math.round(t.deducted || 0) - refundTotal(t);
    if (k > 0) { if (stuck(t) > 0) held += stuck(t); else kept += k; }
  });
  var top = function (o) {
    return Object.keys(o).sort(function (x, y) { return o[y] - o[x]; })
      .map(function (k) { return { label: k, n: o[k] }; });
  };
  return { rows: rows, count: rows.length, apps: top(byApp), accs: top(byAcc),
           kept: kept, held: held, month: month };
}

/* =========================================================
   THE MONTH, IN PLAIN WORDS
   ---------------------------------------------------------
   Sentences, not charts. Every line comes from the recorded
   entries, and a month with nothing in it says exactly that.
   ========================================================= */
function moneyStory(mk) {
  var month = mk || mKey(new Date());
  var list = txIn(month);
  if (!list.length) {
    return { empty: true, month: month,
      lines: ["Nothing was recorded in " + mLabel(month) + ", so there is no story to tell."] };
  }
  var t = totalsFor(list);
  var cardPaid = list.filter(function (x) { return x.type === "bill"; })
    .reduce(function (s, x) { return s + Math.round(x.amt || 0); }, 0);
  var spent = t.spend, saved = t.saved, got = t.in;
  var remaining = got - spent - saved - cardPaid;

  var cats = byCategory(list).filter(function (c) { return c.value > 0; });
  var topCat = cats.length
    ? cats.slice().sort(function (a, b) {
        return b.value - a.value || String(a.label).localeCompare(String(b.label));
      })[0]
    : null;
  /* the biggest single purchase — not a transfer, a SIP or a card bill */
  var real = list.filter(function (x) {
    return !x.potId && !x.fundId && x.type === "out" && netSpend(x) > 0;
  });
  var biggest = real.length
    ? real.slice().sort(function (a, b) {
        return netSpend(b) - netSpend(a) || String(a.id).localeCompare(String(b.id));
      })[0]
    : null;
  var refunds = list.reduce(function (s, x) { return s + refundTotal(x); }, 0);

  var lines = [];
  if (got > 0) lines.push("Money came in: " + money(got) + ".");
  lines.push("You spent " + money(spent) + " on things.");
  if (saved > 0) lines.push("You moved " + money(saved) + " into savings or investments.");
  if (cardPaid > 0) lines.push("You paid " + money(cardPaid) + " off your credit cards.");
  if (got > 0) {
    lines.push(remaining >= 0
      ? "That leaves " + money(remaining) + " of what came in."
      : "That is " + money(Math.abs(remaining)) + " more than came in, so it came out of what you held.");
  }
  if (topCat) lines.push("Most of it went on " + topCat.label.toLowerCase() +
    " \u2014 " + money(topCat.value) + ".");
  if (biggest) lines.push("Your biggest single purchase was " + money(netSpend(biggest)) +
    (biggest.merchant ? " at " + biggest.merchant
      : biggest.note ? " (" + String(biggest.note).slice(0, 40) + ")" : "") +
    " on " + fDate(biggest.date) + ".");
  if (refunds > 0) lines.push("You got " + money(refunds) + " back in refunds.");

  var cmp = compare(month, "", "prev");
  if (cmp.ok && cmp.diff !== 0) {
    lines.push(cmp.diff < 0
      ? "You spent " + money(Math.abs(cmp.diff)) + " less than " + cmp.label + "."
      : "You spent " + money(cmp.diff) + " more than " + cmp.label + ".");
    var moves = categoryMoves(month, "prev");
    var same = moves.filter(function (c) { return (c.diff < 0) === (cmp.diff < 0); });
    if (same.length) {
      lines.push("Most of the " + (cmp.diff < 0 ? "drop" : "rise") + " came from " +
        same[0].cat.toLowerCase() + ".");
    }
  }
  return {
    empty: false, month: month, lines: lines,
    got: got, spent: spent, saved: saved, cardPaid: cardPaid,
    remaining: remaining, topCat: topCat, biggest: biggest, refunds: refunds,
    balances: got - spent - saved - cardPaid === remaining
  };
}

/* ---------- what changed, at a glance ---------- */
function whatChanged(mk) {
  var month = mk || mKey(new Date());
  var prev = mShift(month, -1);
  if (!haveMonth(prev)) {
    return { enough: false,
      why: "Not enough history yet. Once " + mLabel(month) +
        " has a full month before it, this shows what moved." };
  }
  var moves = categoryMoves(month, "prev");
  /* ignore changes too small to be worth a line */
  var floor = Math.max(toMinor(50), Math.round(spendIn(prev) * 0.02));
  var good = [], bad = [], seen = {};
  moves.forEach(function (c) {
    if (Math.abs(c.diff) < floor) return;
    if (seen[c.cat]) return;
    seen[c.cat] = 1;
    var item = {
      cat: c.cat, diff: c.diff, pct: c.pct,
      text: c.cat + " " + (c.diff < 0 ? "down " : "up ") + money(Math.abs(c.diff)) +
        (c.pct !== null && Math.abs(c.pct) >= 1
          ? " (" + (c.pct > 0 ? "+" : "") + Math.round(c.pct) + "%)" : "")
    };
    (c.diff < 0 ? good : bad).push(item);
  });
  /* saving more is an improvement, not a rise in spending */
  var savedNow = byRole(txIn(month)).savings + byRole(txIn(month)).investment;
  var savedPrev = byRole(txIn(prev)).savings + byRole(txIn(prev)).investment;
  if (savedNow - savedPrev >= floor) {
    good.push({ cat: "Savings", diff: -(savedNow - savedPrev),
      text: "You put " + money(savedNow - savedPrev) + " more into savings" });
  } else if (savedPrev - savedNow >= floor) {
    bad.push({ cat: "Savings", diff: savedPrev - savedNow,
      text: "You put " + money(savedPrev - savedNow) + " less into savings" });
  }
  /* card use across pools */
  var seenPool = {}, useNow = 0, lim = 0;
  cards().forEach(function (c) {
    var k = c.sharedLimit || c.id;
    if (seenPool[k]) return;
    seenPool[k] = 1;
    var m = cardMoney(c);
    useNow += m.poolUsed; lim += m.limit;
  });
  if (lim > 0 && useNow / lim > 0.3) {
    bad.push({ cat: "Credit", diff: useNow,
      text: "Credit use is at " + Math.round((useNow / lim) * 100) + "% of your total limit" });
  }
  /* bills landing before the next pay */
  if (paySet()) {
    var due = commitments(today(), nextPayday());
    if (due.length >= 2) {
      bad.push({ cat: "Upcoming", diff: due.reduce(function (s, x) { return s + x.amt; }, 0),
        text: due.length + " payments fall before your next pay" });
    }
  }
  good.sort(function (a, b) { return a.diff - b.diff; });
  bad.sort(function (a, b) { return b.diff - a.diff; });
  return { enough: true, good: good.slice(0, 5), bad: bad.slice(0, 5),
           month: month, floor: floor };
}

/* ---------- the Insights page ---------- */
function pageInsights() {
  var mk = ui.insMonth || mKey(new Date());
  var months = monthsWithData();

    return h + '<div class="card"><p class="empty">Nothing recorded yet, so there is ' +

  }

  h += '<div class="card"><span class="lbl">Which month?</span>' +
    '<div class="chips" style="margin-block-start:8px">' +

    }).join("") + "</div></div>";

  var qs = [];

  });
  qs.push({
    q: "\ud83d\udcc8 What changed?",
    a: cmpTop.ok
      ? (cmpTop.diff === 0 ? "You are level with " + cmpTop.label + "."
        : "Spending is " + money(Math.abs(cmpTop.diff)) +
          (cmpTop.diff < 0 ? " lower than " : " higher than ") + cmpTop.label + ".")
      : "There is no earlier month to compare against yet.",
    act: "go", data: ' data-view="review"', cta: "See the month reviewed"
  });
  qs.push({
    q: "\ud83c\udfaf Am I on track?",
    a: paceTop.hasBudget
      ? "You have used " + Math.round((paceTop.spent / paceTop.budget) * 100) +

      : "No budget is set, so there is nothing to measure against.",
    act: "go", data: ' data-view="budget"',
    cta: paceTop.hasBudget ? "See your budget" : "Set a budget"
  });
  h += '<div class="sec">' + qs.map(function (x) {

      '<button type="button" class="btn g s" data-act="' + x.act + '"' + x.data + ">" +
      esc(x.cta) + "</button></div>";
  }).join("") + "</div>";

  h += '<div class="btns" style="margin-block-end:6px">' +
    '<button type="button" class="btn g s" data-act="go" data-view="review">' +
    "See the month reviewed</button>" +
    '<button type="button" class="btn g s" data-act="palettePick">Chart colours</button></div>';
  h += storyBlock(mk);
  h += changedBlock(mk);

  /* the headline comparison */
  var cmp = ["prev", "avg3", "avg6"].map(function (k) { return compare(mk, "", k); });
  h += '<div class="sec"><h2>How this month compares</h2><div class="card">';
  var anyCmp = cmp.filter(function (c) { return c.ok; });
  if (!anyCmp.length) {
    h += '<p class="sub">This is your first month of records, so there is nothing to ' +
      "compare it against yet. Next month this becomes useful.</p>";
  } else {
    h += '<p class="big">' + money(spendIn(mk)) + '</p><p class="sub">spent on things in ' +
      esc(mLabel(mk)) + (elapsedShare(mk) < 1 ? " so far" : "") + "</p><table>" +
      cmp.map(function (c) {
        if (!c.ok) return "<tr><td>" + esc(c.kind === "prev" ? "Last month"
          : c.kind === "avg3" ? "3-month average" : "6-month average") +
          '</td><td class="sub" colspan="2">' + esc(c.why) + "</td></tr>";
        return "<tr><td>" + esc(c.label.charAt(0).toUpperCase() + c.label.slice(1)) +
          '</td><td class="n">' + money(c.fairBase) + "</td>" +
          '<td class="n ' + (c.diff > 0 ? "out" : c.diff < 0 ? "in" : "") + '">' +
          (c.diff === 0 ? "level" : plus(c.diff) +
            (c.pct !== null ? " (" + (c.pct > 0 ? "+" : "") + Math.round(c.pct) + "%)" : "")) +
          "</td></tr>";
      }).join("") + "</table>";
    if (elapsedShare(mk) < 1) {
      h += '<p class="sub">The month is still running, so comparisons use the same ' +
        "stretch of days on both sides \u2014 not a part month against a whole one.</p>";
    }
  }
  h += "</div></div>";

  /* what moved, and why */
  var moves = categoryMoves(mk, "prev").slice(0, 6);
  if (moves.length) {
    h += '<div class="sec"><h2>What moved, and why</h2>';
    moves.forEach(function (c) {
      var why = explainChange(mk, c.cat);
      h += '<div class="card"><div class="rowline"><b>' + catIcon(c.cat) + " " + esc(c.cat) + "</b>" +
        '<span class="' + (c.diff > 0 ? "out" : "in") + '">' + plus(c.diff) + "</span></div>" +
        '<p class="sub">' + esc(compareWords(c)) + "</p>" +
        (why ? '<p class="sub"><b>Why:</b> ' + esc(why.plain) + "</p>" : "") +
        (why && why.tx && why.tx.length
          ? '<button type="button" class="btn g s" data-act="seeCat" data-cat="' + esc(c.cat) +
            '" data-mk="' + esc(mk) + '">See the ' + why.tx.length + " entr" +
            (why.tx.length === 1 ? "y" : "ies") + "</button>"
          : "") + "</div>";
    });
    h += "</div>";
  }

  /* instalments ending, and what that frees */
  var freed = freedWords();
  if (freed.length) {
    h += '<div class="sec"><h2>What is about to change</h2>' +
      freed.map(function (x) {
        return '<div class="note ' + x.tone + '"><span aria-hidden="true">' + x.icon +
          "</span><div><b>" + esc(x.title) + "</b><br>" + esc(x.body) + "</div></div>";
      }).join("") + "</div>";
  }

  /* what went well */
  var good = goodNews(mk).slice(0, 4);
  if (good.length) {
    h += '<div class="sec"><h2>Worth noting</h2><div class="card">' +
      good.map(function (g) {
        return '<div class="note ok"><span aria-hidden="true">\u2705</span><div>' +
          esc(g.text) + "</div></div>";
      }).join("") + "</div></div>";
  }

  /* where the money is going by role */
  var month = txIn(mk);
  var roles = byRole(month);
  var spentAll = trueSpend(month);
  if (spentAll > 0) {
    h += '<div class="sec"><h2>How much of it you control</h2><div class="card">' +
      barList(ROLES.filter(function (r) { return roles[r.id] > 0; }).map(function (r) {
        return { label: r.icon + " " + r.label, value: roles[r.id] };
      }), spentAll) +
      '<p class="sub">' + money(cuttable(month)) + " of the " + money(spentAll) +
      " you spent was on things you have some say over. " + money(roles.essential) +
      " was hard to avoid." +
      (Object.keys(db.roles || {}).length ? "" :
        ' <button type="button" class="btn g s" data-act="go" data-view="budget">Change these</button>') +
      "</p></div></div>";
  }

  /* ---- charts, each answering one question ---- */
  var monthList = monthsWithData();
  var mList = txIn(mk);

  /* 1. is spending going up or down over time? */
  if (monthList.length >= 2) {
    var trend = monthList.slice(-8).map(function (m) {
      return { label: mLabel(m).replace(/ \d{4}$/, ""), value: spendIn(m) };
    });
    h += '<div class="sec"><h2>Is it going up or down?</h2><div class="card chartcard">' +
      '<p class="chartq">Everything you spent, month by month.</p>' +
      lineChart(trend, { title: "Spending by month" }) + "</div></div>";
  }

  /* 2. what is the money actually FOR? */
  var roleHtml = roleChart(mList);
  if (roleHtml) {
    h += '<div class="sec"><h2>What was it for?</h2><div class="card chartcard">' +
      '<p class="chartq">Not what you bought \u2014 whether you had a choice about it.</p>' +
      roleHtml +
      '<p class="sub">' + money(cuttable(mList)) + " of " + money(trueSpend(mList)) +
      " was on things you have some say over." +
      (Object.keys(db.roles || {}).length ? "" :
        ' <button type="button" class="btn g s" data-act="go" data-view="budget">Change these</button>') +
      "</div></div>";
  }

  /* 3. where in the month does it go? */
  if (spendIn(mk) > 0) {
    h += '<div class="sec"><h2>When in the month?</h2><div class="card chartcard">' +
      '<p class="chartq">Every day of ' + esc(mLabel(mk)) + '. Weekends are marked.</p>' +
      dayStrip(mk) +
      '<div style="margin-block-start:14px">' + weekBars(mk) + "</div></div></div>";
  }

  /* 4. which categories moved, and by how much? */
  var pairRows = categoryMoves(mk, "prev").slice(0, 6).map(function (c) {
    return { label: c.cat, now: c.now, was: c.fairBase };
  });
  if (pairRows.length) {
    h += '<div class="sec"><h2>This month against last</h2><div class="card chartcard">' +
      '<p class="chartq">The solid bar is now, the faded one is the same stretch last month.</p>' +
      pairBars(pairRows, { nowLabel: "this month", wasLabel: "last month" }) + "</div></div>";
  }

  /* 5. how you paid */
  var hows = {};
  mList.forEach(function (t) {
    var v = netSpend(t);
    if (!v) return;
    var k2 = t.how === "app" ? (appName(t.appId) || "app") : howLabel(t.how);
    hows[k2] = (hows[k2] || 0) + v;
  });
  var howRows = Object.keys(hows).map(function (k2) { return { label: k2, value: hows[k2] }; })
    .sort(function (a2, b2) { return b2.value - a2.value; });
  if (howRows.length > 1) {
    h += '<div class="sec"><h2>How you paid</h2><div class="card chartcard">' +
      '<p class="chartq">Cash, cards and apps \u2014 a card bill paid later is not counted twice.</p>' +
      donut(howRows) + "</div></div>";
  }

  /* 6. where the month is going, as a calendar */
  if (spendIn(mk) > 0) {
    h += '<div class="sec"><h2>The month at a glance</h2><div class="card chartcard">' +
      '<p class="chartq">Darker means a heavier day. Tap any day on Stats to open it.</p>' +
      heatmap(mk) + "</div></div>";
  }

  /* 7. how you got from money in to what is left */
  var st2 = moneyStory(mk);
  if (!st2.empty && (st2.got > 0 || st2.spent > 0)) {
    var steps = [];
    if (st2.got > 0) steps.push({ label: "Money in", value: st2.got });
    if (st2.spent > 0) steps.push({ label: "Spent on things", value: -st2.spent });
    if (st2.saved > 0) steps.push({ label: "Into savings", value: -st2.saved });
    if (st2.cardPaid > 0) steps.push({ label: "Card bills", value: -st2.cardPaid });
    if (steps.length > 1) {
      h += '<div class="sec"><h2>How the month added up</h2><div class="card chartcard">' +
        '<p class="chartq">Each step, in the order it happened to your money.</p>' +
        waterfall(steps) + "</div></div>";
    }
  }

  /* 8. budget, as a dial */
  var pace2 = spendingPace(mk);
  if (pace2.hasBudget) {
    h += '<div class="sec"><h2>How much of your budget is gone</h2>' +
      '<div class="card chartcard" style="text-align:center">' +
      '<p class="chartq">Against the ' + money(pace2.budget) + " you set." + "</p>" +
      gauge(pace2.spent, pace2.budget, "Budget used") +
      '<p class="sub">' + money(pace2.spent) + " of " + money(pace2.budget) +
      " \u00b7 " + pace2.left + (pace2.left === 1 ? " day" : " days") + " left</p></div></div>";
  }

  /* 9. each category over the last few months, side by side */
  if (monthList.length >= 3) {
    var topCats2 = byCategory(mList).slice(0, 6);
    if (topCats2.length) {
      var series = topCats2.map(function (c) {
        return { label: c.label,
          values: monthList.slice(-6).map(function (m) { return spendIn(m, c.label); }) };
      });
      h += '<div class="sec"><h2>Each category over time</h2><div class="card chartcard">' +
        '<p class="chartq">The same shape for each, so they can be compared at a glance.</p>' +
        sparkRow(series) + "</div></div>";
    }
  }

  /* 10. what you keep, over time */
  if (monthList.length >= 2) {
    var kept = monthList.slice(-8).map(function (m) {
      var r2 = byRole(txIn(m));
      return { label: mLabel(m).replace(/ \d{4}$/, ""), value: r2.savings + r2.investment };
    });
    if (kept.some(function (k3) { return k3.value > 0; })) {
      h += '<div class="sec"><h2>What you keep</h2><div class="card chartcard">' +
        '<p class="chartq">Money moved into savings and investments each month.</p>' +
        lineChart(kept, { title: "Saved each month", colour: scaleAt(5) }) + "</div></div>";
    }
  }

  return h;
}
/* ---------- Merchants page ---------- */
function pageMerchants() {

/* =========================================================
   RECOVERY AND INTEGRITY
   ---------------------------------------------------------
   Checks the stored data for real problems and reports what
   it finds. It never repairs anything without being asked.
   ========================================================= */
function checkData() {
  var problems = [], notes = [];
  var ids = {};
  db.tx.forEach(function (t) {
    if (!t.id) problems.push({ kind: "noid", what: "An entry has no identifier." });
    else if (ids[t.id]) problems.push({ kind: "dupid", what: "Two entries share the id " + t.id + "." });
    ids[t.id] = 1;
    if (!t.date || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) {
      problems.push({ kind: "date", what: "An entry has no usable date.", id: t.id });
    } else if (t.date > today()) {
      problems.push({ kind: "future", what: "An entry is dated in the future (" + t.date + ").", id: t.id });
    }
    if (typeof t.amt !== "number" || !isFinite(t.amt)) {
      problems.push({ kind: "amt", what: "An entry has no usable amount.", id: t.id });
    } else if (Math.round(t.amt) !== t.amt) {
      problems.push({ kind: "paise", what: "An amount is not a whole number of paise.", id: t.id });
    }
    if (t.acc && !acc(t.acc)) {
      problems.push({ kind: "acc", what: "An entry points at an account that no longer exists.", id: t.id });
    }
    if (t.fundId && !fund(t.fundId)) {
      problems.push({ kind: "fund", what: "An entry points at a fund that no longer exists.", id: t.id });
    }
  });
  var gaps = db.tx.filter(function (t) { return txMissing(t).length; }).length;
  if (gaps) notes.push(gaps + " entr" + (gaps === 1 ? "y is" : "ies are") +
    " missing some detail. They still count in your totals.");
  db.accounts.forEach(function (a) {
    if (a.kind === "card" && !Math.round(a.limit || 0)) {
      notes.push(a.name + " has no credit limit saved, so nothing can be shown as available.");
    }
  });
  return { problems: problems, notes: notes, ok: !problems.length,
           entries: db.tx.length, accounts: db.accounts.length };
}
/** How much room storage has, tested honestly by trying it. */
function storageCheck() {
  var out = { works: false, bytes: 0, backup: false, why: "" };
  try {
    var probe = "moneytracker.probe";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    out.works = true;
  } catch (e) {
    out.why = "This browser is refusing to store anything \u2014 private mode, or full.";
  }
  try {
    var raw = localStorage.getItem(KEY);
    out.bytes = raw ? raw.length : 0;
    out.backup = !!localStorage.getItem(BACKUP_KEY);
  } catch (e) {}
  return out;
}
/** Swap in the copy from before the last save. */
function restorePrevious() {
  var raw;
  try { raw = localStorage.getItem(BACKUP_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var parsed;
  try { parsed = JSON.parse(raw); } catch (e) { return false; }
  /* keep the copy we are replacing, so this is itself undoable */
  var current;
  try { current = localStorage.getItem(KEY); } catch (e) {}
  applyLoaded(parsed);
  saveLocalOnly();
  try { if (current) localStorage.setItem(BACKUP_KEY, current); } catch (e) {}
  return true;
}
/** What the safety copy holds, so you know what you would be going back to. */
function previousInfo() {
  var raw;
  try { raw = localStorage.getItem(BACKUP_KEY); } catch (e) { return null; }
  if (!raw) return null;
  try {
    var p = JSON.parse(raw);
    return { entries: (p.tx || []).length, accounts: (p.accounts || []).length,
             bytes: raw.length };
  } catch (e) { return null; }
}

/* ---------- when you spend ---------- */
var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
/** Average spend per weekday, from finished data only. */
function weekdayPattern(months) {
  var use = monthsWithData().slice(-(months || 3));
  if (!use.length) return null;
  var sums = [0, 0, 0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0, 0, 0], seenDay = {};
  db.tx.forEach(function (t) {
    if (use.indexOf(mOf(t.date)) === -1) return;
    var v = netSpend(t);
    if (!v) return;
    var d = dateFrom(t.date).getDay();
    sums[d] += v;
    if (!seenDay[t.date]) { seenDay[t.date] = 1; counts[d]++; }
  });
  /* count every calendar day in range, not only days you spent */
  var totalDays = [0, 0, 0, 0, 0, 0, 0];
  use.forEach(function (m) {
    var parts = m.split("-"), dim = mDays(m);
    for (var i = 1; i <= dim; i++) {
      var dt = new Date(+parts[0], +parts[1] - 1, i);
      if (isoOf(dt) <= today()) totalDays[dt.getDay()]++;
    }
  });
  var rows = sums.map(function (s, i) {
    return { day: DAY_NAMES[i], total: s,
             avg: totalDays[i] ? Math.round(s / totalDays[i]) : 0,
             days: totalDays[i] };
  });
  var live = rows.filter(function (r) { return r.days > 0; });
  if (!live.length) return null;
  var top = live.slice().sort(function (a, b) { return b.avg - a.avg; });
  return { rows: rows, months: use.length, busiest: top[0], quietest: top[top.length - 1] };
}
/** Which part of the month costs you most. */
function monthShape(months) {
  var use = monthsWithData().slice(-(months || 3));
  if (!use.length) return null;
  var thirds = [{ label: "1st to 10th", total: 0 }, { label: "11th to 20th", total: 0 },
                { label: "21st onwards", total: 0 }];
  db.tx.forEach(function (t) {
    if (use.indexOf(mOf(t.date)) === -1) return;
    var v = netSpend(t);
    if (!v) return;
    var day = dateFrom(t.date).getDate();
    thirds[day <= 10 ? 0 : day <= 20 ? 1 : 2].total += v;
  });
  var sum = thirds.reduce(function (s, x) { return s + x.total; }, 0);
  if (!sum) return null;
  thirds.forEach(function (x) { x.share = Math.round((x.total / sum) * 100); });
  return { thirds: thirds, months: use.length,
           heaviest: thirds.slice().sort(function (a, b) { return b.total - a.total; })[0] };
}

/* ---------- Recovery centre ---------- */
function pageRecovery() {

    '<button type="button" class="btn g" data-act="importJson">Restore from a file</button></div>' +
    '<p class="hint">Restoring makes a safety copy of what is here first, so a wrong ' +

/* =========================================================
   THE FOR-YOU FEED
   ---------------------------------------------------------
   One ranked list of things worth your attention, instead of
   a wall of equal-weight cards. Every item is built from
   recorded data and links to where you can act on it.
   ========================================================= */
function greeting() {
  var h = new Date().getHours();
  return h < 5 ? "Late night" : h < 12 ? "Good morning"
    : h < 17 ? "Good afternoon" : "Good evening";
}
/** tone: red | green | amber | blue — ranked by urgency, then size. */
function feedItems() {
  var out = [], mk = mKey(new Date());

  /* card bills waiting */
  cards().forEach(function (c) {
    var m = cardMoney(c);
    if (m.statementRemaining <= 0) return;
    var due = m.statement && m.statement.dueDate ? m.statement.dueDate : "";
    var days = due ? Math.round((dateFrom(due) - dateFrom(today())) / 86400000) : null;
    out.push({
      tone: days !== null && days <= 3 ? "red" : "amber",
      rank: days !== null && days <= 3 ? 100 : 70,
      title: c.name + (days === null ? " bill is waiting"
        : days < 0 ? " bill was due " + Math.abs(days) + " days ago"
        : days === 0 ? " bill is due today"
        : " bill is due in " + days + (days === 1 ? " day" : " days")),
      body: money(m.statementRemaining) + " to pay" +
        (m.minRemaining > 0 ? ", at least " + money(m.minRemaining) : "") +
        ". Your bank balance does not change until you record the payment.",
      act: "payCard", id: c.id, cta: "Record the payment", weight: m.statementRemaining
    });
  });
  /* entries that still need detail */
  var gaps = db.tx.filter(function (t) { return txMissing(t).length; });
  if (gaps.length) {
    out.push({
      tone: "amber", rank: 40,
      title: gaps.length + (gaps.length === 1 ? " entry needs" : " entries need") + " a bit more detail",
      body: "They already count in your totals. Filling them in lets the app group and " +
        "explain your spending properly.",
      act: "filterGaps", cta: "Fill them in", weight: gaps.length
    });
  }
  /* SIP questions have their own block on Home, with Yes / Not this month / close.
     Only the money warnings come through here, so nothing is said twice. */
  sipAlerts().forEach(function (a) {
    if (a.kind === "ask") {
      return;
    } else if (a.kind === "short") {
      out.push({ tone: "red", rank: 95, title: a.title,
        body: money(a.need) + " of SIPs is set to leave " + accName(a.accId) +
          " soon, but it holds " + maskMoney(a.have, "total") + ". You are " +
          money(a.short) + " short.",
        act: "go", view: "funds", cta: "See the SIPs", weight: a.short });
    }
  });
  /* money that has just freed up */
  var freed = freedMoney();
  freed.done.forEach(function (x) {
    out.push({ tone: "green", rank: 60,
      title: money(x.per) + " a month is yours again",
      body: x.what + " finished on " + fDate(x.date) + ". From " + mLabel(x.freesFrom) +
        " that money simply stops leaving.",
      act: "go", view: "debt", cta: "See what is left", weight: x.per });
  });
  freed.soon.forEach(function (x) {
    out.push({ tone: "blue", rank: 25,
      title: money(x.per) + " a month frees up after " + fDate(x.date),
      body: x.what + " has its last instalment then.",
      act: "go", view: "debt", cta: "See the plan", weight: x.per });
  });
  /* what moved, good and bad */
  var w = whatChanged(mk);
  if (w.enough) {
    if (w.bad.length) {
      out.push({ tone: "amber", rank: 45, title: w.bad[0].text,
        body: "Compared with the same point last month.",
        act: "go", view: "insights", cta: "See why", weight: Math.abs(w.bad[0].diff || 0) });
    }
    if (w.good.length) {
      out.push({ tone: "green", rank: 15, title: w.good[0].text,
        body: "Compared with the same point last month.",
        act: "go", view: "insights", cta: "See the comparison",
        weight: Math.abs(w.good[0].diff || 0) });
    }
  }
  /* money running short before pay */
  var plan = safeSpendPlan();
  if (plan.knowsPayday && plan.free < 0) {
    out.push({ tone: "red", rank: 90,
      title: "You are " + money(Math.abs(plan.free)) + " short before payday",
      body: money(plan.essential) + " is already promised before " + fDate(plan.until) +
        ", and you hold " + money(plan.have) + ".",
      act: "go", view: "plan", cta: "See the plan", weight: Math.abs(plan.free) });
  }
  /* nothing recorded for a few days */
  var last = sortTx(db.tx)[0];
  if (last) {
    var quiet = Math.round((dateFrom(today()) - dateFrom(last.date)) / 86400000);
    if (quiet >= 3) {
      out.push({ tone: "blue", rank: 30,
        title: "Nothing recorded for " + quiet + " days",
        body: "The app can only work from what is written down. A quick catch-up keeps " +
          "everything else honest.",
        act: "addAny", cta: "Add what you remember", weight: quiet });
    }
  }
  return out.sort(function (a, b) { return b.rank - a.rank || b.weight - a.weight; });
}
function feedBlock(limit) {
  var list = feedItems().slice(0, limit || 5);
  if (!list.length) {
    return '<div class="sec"><div class="card"><div class="note ok">' +

      "No bills waiting, no questions open, nothing missing.</div></div></div></div>";

  return '<div class="sec"><h2>Worth your attention</h2>' +
    list.map(function (x) {
      return '<div class="feed ' + x.tone + '">' +
        '<div class="feedbody"><b>' + esc(x.title) + "</b>" +
        '<p class="sub">' + esc(x.body) + "</p>" +
        '<button type="button" class="btn g s" data-act="' + esc(x.act) + '"' +

/** Credit shown as pools, so shared limits never look like more than they are. */
function creditPoolBlock() {
  var pools = {}, order = [];
  cards().forEach(function (c) {
    var key = c.sharedLimit ? "s:" + c.sharedLimit : c.id;
    if (!pools[key]) {
      pools[key] = { limit: sharedLimitOf(c), used: familyUsed(c), cards: [], bank: c.bank };
      order.push(key);
    }
    pools[key].cards.push(c);
  });
  var totalLim = 0, totalUsed = 0;
  order.forEach(function (k) { totalLim += pools[k].limit; totalUsed += pools[k].used; });
  var h = '<div class="card"><div class="grid">' +
    '<div><span class="lbl">Your total limit</span><p class="mid">' +
      maskMoney(totalLim, "cardsum") + "</p></div>" +

    '<div><span class="lbl">Left to borrow</span><p class="mid creditc">' +
      maskMoney(totalLim - totalUsed, "cardsum") +
      '</p><p class="sub">borrowing room, not money you hold</p></div></div>' +
    eyeBtn("cardsum", "your card totals") +
    '<p class="sub">Across ' + order.length + " pool" + (order.length === 1 ? "" : "s") +
    " of credit. A shared limit is counted once, not once per card.</p></div>";

  h += order.map(function (k) {

/* ---------- how long a goal will really take ----------
   From your own recorded saving rate, never from a target you wish for. */
function savingRate() {
  var done = monthsWithData().filter(function (m) { return m < mKey(new Date()); });
  if (!done.length) return null;
  var use = done.slice(-3);
  var total = use.reduce(function (s, m) {
    var r = byRole(txIn(m));
    return s + r.savings + r.investment;
  }, 0);
  var avg = Math.round(total / use.length);
  return { perMonth: avg, months: use.length, using: use };
}
function goalOutlook(g) {
  var target = Math.round(g.target || 0);
  var have = Math.round(g.now || g.saved || 0);
  var left = Math.max(0, target - have);
  var pct = target > 0 ? Math.min(100, (have / target) * 100) : 0;
  var rate = savingRate();
  var out = {
    goal: g, target: target, have: have, left: left, pct: pct,
    done: left === 0 && target > 0, knows: false
  };
  if (out.done) {
    out.words = "Reached.";
    return out;
  }
  if (!rate || rate.perMonth <= 0) {
    out.words = "How long this takes cannot be worked out yet \u2014 no finished month " +
      "shows money going into savings. It appears once one does.";
    return out;
  }
  out.knows = true;
  out.perMonth = rate.perMonth;
  out.basedOn = rate.months;
  out.months = Math.ceil(left / rate.perMonth);
  var d = new Date();
  d.setMonth(d.getMonth() + out.months);
  out.by = isoOf(d);
  out.words = "At " + money(rate.perMonth) + " a month \u2014 your average over the last " +
    rate.months + (rate.months === 1 ? " finished month" : " finished months") + " \u2014 " +
    "this would take about " + out.months + (out.months === 1 ? " month" : " months") +
    ", reaching it around " + fDate(out.by) + ".";
  if (g.by) {
    var want = Math.round((dateFrom(g.by) - dateFrom(today())) / 86400000 / 30.4);
    out.wantMonths = want;
    out.onTrack = out.months <= want;
    out.needPerMonth = want > 0 ? Math.ceil(left / want) : left;
    out.words += out.onTrack
      ? " That is inside the date you set."
      : " To reach it by " + fDate(g.by) + " you would need about " +
        money(out.needPerMonth) + " a month instead.";
  }
  return out;
}

/* ---------- fixed deposits and when they mature ---------- */
function potMaturity(p) {
  if (!p.maturesOn) return null;
  var days = Math.round((dateFrom(p.maturesOn) - dateFrom(today())) / 86400000);
  return {

    out.at = r.at;
    out.days = r.days;
    out.diff = r.perGram - avg;
    out.pct = avg > 0 ? (out.diff / avg) * 100 : 0;
    out.cheaper = out.diff < 0;
    out.words = out.diff === 0
      ? "The rate you noted matches your average cost exactly."
      : out.cheaper
        ? "The rate you noted is " + Math.abs(out.pct).toFixed(1) + "% below the " +
          money(avg) + " a gram you have paid on average."
        : "The rate you noted is " + out.pct.toFixed(1) + "% above the " +
          money(avg) + " a gram you have paid on average.";
  }
  return out;
}
/* ---------- how your money is spread, and how far it has drifted ---------- */
function targetMix() {
  if (!db.mix || typeof db.mix !== "object") db.mix = {};
  return db.mix;
}
function setTargetMix(kind, pct) {
  var v = Math.max(0, Math.min(100, parseInt(pct, 10) || 0));
  targetMix()[kind] = v;
  save();
  return v;
}
/** What you actually hold, by kind, at recorded values. */
function allocation() {
  var buckets = {};
  var add = function (kind, amt) {
    if (amt <= 0) return;
    buckets[kind] = (buckets[kind] || 0) + amt;
  };
  funds().forEach(function (f) {
    var w = fundWorth(f.id);
    var v = w && w.known ? w.worth : Math.round(f.invested || 0);
    var kind = /gold/i.test(f.name) || /gold/i.test(f.type || "") ? "Gold fund"
      : /index|nifty/i.test(f.name + " " + (f.type || "")) ? "Index"
      : /debt|liquid|bond/i.test(f.name + " " + (f.type || "")) ? "Debt" : "Equity";
    add(kind, v);
  });
  var mw = metalWorth();
  mw.rows.forEach(function (r) {
    add(r.metal.name, r.worth !== undefined ? r.worth : r.paid);
  });
  add("Set aside", potsTotal());
  add("In accounts", spendable());
  var total = Object.keys(buckets).reduce(function (s, k) { return s + buckets[k]; }, 0);
  var rows = Object.keys(buckets).map(function (k) {
    var want = targetMix()[k];
    var have = total > 0 ? (buckets[k] / total) * 100 : 0;
    return {
      kind: k, value: buckets[k], pct: have,
      target: want === undefined ? null : want,
      drift: want === undefined ? null : have - want
    };
  }).sort(function (a, b) { return b.value - a.value; });
  return {
    rows: rows, total: total,
    drifted: rows.filter(function (r) { return r.drift !== null && Math.abs(r.drift) >= 5; }),
    hasTarget: Object.keys(targetMix()).length > 0
  };
}
/** Observations from your own numbers. Facts, not recommendations. */
function ownSignals() {
  var out = [];
  funds().forEach(function (f) {
    var c = costPerUnit(f.id);
    if (!c || c.nav === undefined) return;
    out.push({
      name: f.name, kind: "fund", pct: c.pct, cheaper: c.cheaper,
      text: f.name + ": " + c.words,
      stale: c.navDays > 3, days: c.navDays
    });
  });
  METALS.forEach(function (m) {
    var b = metalBasis(m.id);
    if (!b || b.now === undefined) return;
    out.push({
      name: m.name, kind: "metal", pct: b.pct, cheaper: b.cheaper,
      text: m.name + ": " + b.words,
      stale: b.days > 3, days: b.days
    });
  });
  var a = allocation();
  a.drifted.forEach(function (r) {
    out.push({
      name: r.kind, kind: "mix", pct: r.drift, cheaper: r.drift < 0,
      text: r.kind + " is " + Math.abs(r.drift).toFixed(0) + " points " +
        (r.drift > 0 ? "above" : "below") + " the " + r.target + "% you set \u2014 " +
        "it is " + r.pct.toFixed(0) + "% of what you hold."
    });
  });
  return out.sort(function (x, y) { return Math.abs(y.pct) - Math.abs(x.pct); });
}

/* =========================================================
   TAX-SAVING
   ---------------------------------------------------------
   Under the old regime an individual can claim up to
   Rs 1,50,000 under section 80C. The window closes on
   31 March, and most people find out in February that they
   are short. This counts what you have already put in, from
   your own records, and says what is left.

   It reports amounts. It does not compute your tax, does not
   know your regime, and does not advise \u2014 those need your
   full income picture, which this app does not have.
   ========================================================= */
var TAX_SECTIONS = [
  { id:"80c", name:"Section 80C", cap: 15000000, /* Rs 1,50,000 in paise */
    what:"ELSS funds, PPF, life insurance, EPF, principal on a home loan, tuition fees",
    note:"The most common one. The cap is shared across everything in it." },
  { id:"80d", name:"Section 80D", cap: 2500000,  /* Rs 25,000 */
    what:"health insurance premiums for you and your family",
    note:"Higher if a parent you cover is a senior citizen. This uses the ordinary cap." },
  { id:"80ccd", name:"Section 80CCD(1B)", cap: 5000000, /* Rs 50,000 */
    what:"the extra NPS deduction, over and above 80C",
    note:"Separate from the 80C cap." }
];
function taxTags() {
  if (!db.taxTags || typeof db.taxTags !== "object") db.taxTags = {};
  return db.taxTags;
}
/** Mark a fund or a category as counting toward a section. */
function tagForTax(key, section) {
  if (!key) return false;
  if (!section) delete taxTags()[key];
  else if (TAX_SECTIONS.some(function (s) { return s.id === section; })) taxTags()[key] = section;
  else return false;
  save();
  return true;
}
function taxTagOf(key) { return taxTags()[key] || ""; }
/** Everything that counts, for one financial year. */
function taxYear(startYear) {
  var y = startYear === undefined ? fyOf(today()) : startYear;
  var r = fyRange(y);
  var sections = {};
  TAX_SECTIONS.forEach(function (s) {
    sections[s.id] = { spec: s, items: [], total: 0 };
  });
  /* fund payments, where the fund is tagged */
  funds().forEach(function (f) {
    var sec = taxTagOf("fund:" + f.id);
    if (!sec || !sections[sec]) return;
    var paid = db.tx.filter(function (t) {
      return t.fundId === f.id && t.date >= r.from && t.date <= r.to;
    }).reduce(function (s2, t) { return s2 + Math.round(t.amt || 0); }, 0);
    /* a SIP that is scheduled but unconfirmed is shown apart, never added in */
    var due = sipSchedule(f, r.from, r.to).filter(function (x) {
      return x.on <= today() &&
        !db.tx.some(function (t) { return t.fundId === f.id && mOf(t.date) === x.mk; }) &&
        !sipSkips()[f.id + ":" + x.mk];
    }).reduce(function (s2, x) { return s2 + x.amt; }, 0);
    if (paid > 0 || due > 0) {
      sections[sec].items.push({ name: f.name, kind: "fund", amt: paid, unconfirmed: due,
                                 id: f.id });
      sections[sec].total += paid;
    }
  });
  /* categories you have tagged, e.g. Insurance */
  spendCats().forEach(function (c) {
    var sec = taxTagOf("cat:" + c);
    if (!sec || !sections[sec]) return;
    var paid = db.tx.filter(function (t) {
      return t.cat === c && t.date >= r.from && t.date <= r.to;
    }).reduce(function (s2, t) { return s2 + netSpend(t); }, 0);
    if (paid > 0) {
      sections[sec].items.push({ name: c, kind: "category", amt: paid, unconfirmed: 0 });
      sections[sec].total += paid;
    }
  });
  /* pots marked for tax, such as a PPF pot */
  pots().forEach(function (p) {
    var sec = taxTagOf("pot:" + p.id);
    if (!sec || !sections[sec]) return;
    var added = db.tx.filter(function (t) {
      return t.potId === p.id && t.date >= r.from && t.date <= r.to;
    }).reduce(function (s2, t) { return s2 + Math.round(t.amt || 0); }, 0);
    if (added > 0) {
      sections[sec].items.push({ name: p.name, kind: "pot", amt: added, unconfirmed: 0 });
      sections[sec].total += added;
    }
  });

  var end = dateFrom(r.to);
  var daysLeft = Math.round((end - dateFrom(today())) / 86400000);
  var rows = TAX_SECTIONS.map(function (s) {
    var g = sections[s.id];
    var left = Math.max(0, s.cap - g.total);
    return {
      spec: s, total: g.total, items: g.items, left: left,
      pct: s.cap > 0 ? Math.min(100, (g.total / s.cap) * 100) : 0,
      full: g.total >= s.cap,
      unconfirmed: g.items.reduce(function (n, i) { return n + (i.unconfirmed || 0); }, 0),
      perMonthToFill: daysLeft > 0 ? Math.ceil(left / Math.max(1, daysLeft / 30.4)) : left
    };
  });
  return {
    year: y, label: fyLabel(y), from: r.from, to: r.to,
    rows: rows, daysLeft: daysLeft, closed: daysLeft < 0,
    tagged: Object.keys(taxTags()).length,
    claimed: rows.reduce(function (n, x) { return n + x.total; }, 0)
  };
}

/* =========================================================
   READY-MADE REPORTS
   ---------------------------------------------------------
   Twenty questions people actually ask, each already set up.
   Every one is a real query over your own entries \u2014 pick it
   and it fills the report filters in for you.
   ========================================================= */
var REPORT_KINDS = [

    group:"Tax & year", view:"tax" },
  { id:"year",      name:"This calendar year",    what:"January to December", group:"Tax & year" },

  { id:"subs",      name:"Repeating charges",     what:"subscriptions and anything on a cycle",
    group:"Watch for", view:"repeats" },
  { id:"gaps",      name:"Needs more detail",     what:"entries missing something",
    group:"Watch for", view:"history", filter:{ gaps:"1" } },
  { id:"invest",    name:"Investments",           what:"SIPs, funds and what you hold",
    group:"Wealth", view:"holdings" },
  { id:"worth",     name:"What you are worth",    what:"everything you have, minus what you owe",
    group:"Wealth", view:"worth" }
];
/** Turn a chosen report into report filters and a date range. */
function reportPreset(id2, extra) {
  var e = extra || {};
  var now = new Date(), mk = mKey(now), y = now.getFullYear();
  var fy = fyOf(today());
  var out = { from: "", to: "", filters: blankReportFilters(), title: "" };
  var spec = REPORT_KINDS.filter(function (r) { return r.id === id2; })[0];
  out.title = spec ? spec.name : "Report";
  var setMonth = function (m) {
    out.from = m + "-01";
    out.to = m + "-" + p2(mDays(m));
  };
  switch (id2) {
    case "month":     setMonth(mk); break;
    case "lastmonth": setMonth(mShift(mk, -1)); break;
    case "week": {
      var d = new Date(); d.setDate(d.getDate() - 6);
      out.from = isoOf(d); out.to = today();
      break;
    }
    case "today":     out.from = today(); out.to = today(); break;
    case "fy":        out.from = fyRange(fy).from; out.to = fyRange(fy).to; break;
    case "lastfy":    out.from = fyRange(fy - 1).from; out.to = fyRange(fy - 1).to; break;
    case "year":      out.from = y + "-01-01"; out.to = y + "-12-31"; break;
    case "cat":       setMonth(mk); out.filters.cat = e.cat || ""; break;
    case "acct":      setMonth(mk); out.filters.acc = e.acc || ""; break;
    case "card":      setMonth(mk); out.filters.how = "card"; break;
    case "cash":      setMonth(mk); out.filters.how = "cash"; break;
    case "big":       setMonth(mk); out.filters.min = e.min || "1000"; break;
    case "fees":      setMonth(mk); out.filters.q = "fee"; break;
    default:          setMonth(mk);
  }
  return out;
}

/* =========================================================
   THE WEEK
   ---------------------------------------------------------
   Everything the app knows, assembled on a rhythm rather
   than scattered across screens. Built for a Sunday sit-down:
   what happened, what is coming, what still needs an answer.
   ========================================================= */
function weekRange(offset) {
  var d = new Date();
  d.setDate(d.getDate() - (offset || 0) * 7);
  /* weeks run Monday to Sunday, as pay and bills tend to */
  var dow = (d.getDay() + 6) % 7;
  var start = new Date(d);
  start.setDate(d.getDate() - dow);
  var end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { from: isoOf(start), to: isoOf(end) };
}
function weekDigest(offset) {
  var r = weekRange(offset || 0);
  var list = db.tx.filter(function (t) { return t.date >= r.from && t.date <= r.to; });
  var t = totalsFor(list);
  var prev = weekRange((offset || 0) + 1);
  var prevList = db.tx.filter(function (x) { return x.date >= prev.from && x.date <= prev.to; });
  var prevSpend = totalsFor(prevList).spend;

  /* each day, so a heavy day stands out */
  var days = [];
  var d = dateFrom(r.from);
  for (var i = 0; i < 7; i++) {
    var iso = isoOf(d);
    days.push({ date: iso, label: DOW[i], value: iso <= today() ? spentOn(iso) : 0,
                future: iso > today() });
    d.setDate(d.getDate() + 1);
  }
  var spentDays = days.filter(function (x) { return !x.future; });
  var quiet = spentDays.filter(function (x) { return x.value === 0; }).length;
  var busiest = spentDays.slice().sort(function (a, b) { return b.value - a.value; })[0];

  /* what is coming in the next seven days */
  var soon = new Date();
  soon.setDate(soon.getDate() + 7);
  var due = commitments(today(), isoOf(soon));

  /* what still needs an answer */
  var asks = [];
  sipAsk().forEach(function (x) {
    asks.push({ what: "Did you pay " + x.fund.name + "?", amt: Math.round(x.fund.sip || 0),
                act: "payFund", id: x.fund.id });
  });
  var gaps = db.tx.filter(function (x) { return txMissing(x).length; });
  if (gaps.length) {
    asks.push({ what: gaps.length + (gaps.length === 1 ? " entry needs" : " entries need") +
      " more detail", act: "quickFilter", q: "gaps" });
  }
  cards().forEach(function (c) {
    var m = cardMoney(c);
    if (m.statementRemaining > 0) {
      asks.push({ what: c.name + " bill is waiting", amt: m.statementRemaining,
                  act: "payCard", id: c.id });
    }
  });

  var cats = byCategory(list).slice(0, 4);
  return {
    from: r.from, to: r.to, offset: offset || 0,
    list: list, totals: t, spend: t.spend, prevSpend: prevSpend,
    diff: t.spend - prevSpend,
    pct: prevSpend > 0 ? ((t.spend - prevSpend) / prevSpend) * 100 : null,
    days: days, quiet: quiet, busiest: busiest && busiest.value > 0 ? busiest : null,
    due: due, dueTotal: due.reduce(function (s, x) { return s + x.amt; }, 0),
    asks: asks, cats: cats, count: list.length,
    isThisWeek: (offset || 0) === 0,
    perDay: spentDays.length ? Math.round(t.spend / spentDays.length) : 0
  };
}

/* =========================================================
   COUNTING WHAT IS ACTUALLY THERE
   ---------------------------------------------------------
   Cash is where tracking quietly fails: a chai here, a tip
   there, none of it written down. Counting the notes in your
   wallet and comparing is the only way to find the drift.
   The difference is recorded as its own entry so the history
   stays honest \u2014 it is never quietly absorbed.
   ========================================================= */
function lastCount(accId) {
  var list = db.tx.filter(function (t) { return t.recount && t.acc === accId; });
  if (!list.length) return null;
  var last = sortTx(list)[0];
  return { on: last.date, diff: Math.round(last.amt || 0),
           was: last.type === "out" ? "short" : "over",
           days: Math.round((dateFrom(today()) - dateFrom(last.date)) / 86400000) };
}
/** Compare a counted figure with what the app thinks. Nothing saved yet. */
function checkCount(accId, counted) {
  var a = acc(accId);
  if (!a) return null;
  var think = balance(accId);
  var real = Math.round(counted || 0);
  var diff = real - think;
  return {
    acc: a, think: think, real: real, diff: diff,
    match: diff === 0,
    short: diff < 0,
    words: diff === 0
      ? "Exactly right \u2014 what you counted matches what is recorded."
      : diff < 0
        ? "There is " + money(Math.abs(diff)) + " less than recorded. Usually that means " +
          "something was spent without being written down."
        : "There is " + money(diff) + " more than recorded. Usually that means money came " +
          "in without being written down, or an amount was entered too high."
  };
}
/** Record the difference as a real entry, so the history explains itself. */
function applyCount(accId, counted, note) {
  var c = checkCount(accId, counted);
  if (!c) return null;
  if (c.match) {
    /* still worth noting that you checked */
    db.tx.push({
      id: id("t"), type: "move", amt: 0, cat: "", acc: accId, to: "", how: "cash",
      appId: "", channel: "", date: today(), time: hm(new Date()), noTime: false,
      note: note || "Counted, and it matched", recount: true, status: "done",
      deducted: 0, refunds: [], createdAt: stamp(), updatedAt: stamp()
    });
    save();
    return { made: null, checked: true, diff: 0 };
  }
  var t = {
    id: id("t"), type: c.diff < 0 ? "out" : "in", amt: Math.abs(c.diff),
    cat: c.diff < 0 ? "Other" : "Other", acc: accId, to: "", how: "cash",
    appId: "", channel: "", date: today(), time: hm(new Date()), noTime: false,
    note: note || (c.diff < 0 ? "Counted the cash \u2014 " + money(Math.abs(c.diff)) +
      " unaccounted for" : "Counted the cash \u2014 " + money(c.diff) + " more than recorded"),
    recount: true, status: "done", deducted: 0, refunds: [],
    createdAt: stamp(), updatedAt: stamp()
  };
  db.tx.push(t);
  save();
  return { made: t, checked: true, diff: c.diff };
}
/** Accounts worth counting: cash and wallets, where drift happens. */
function countable() {
  return db.accounts.filter(function (a) {
    return !a.archived && (a.kind === "cash" || a.kind === "wallet");
  });
}

/* ---------- one category, in full ---------- */

/* =========================================================
   THINGS EVERY KIND OF USER NEEDS
   ---------------------------------------------------------
   Repeat an entry            fast repetitive recording
   Money lent and owed        informal debts between people
   Financial year             India runs April to March
   Keyboard shortcuts         hands stay on the keys
   Edit history               what changed, and when
   ========================================================= */

/* ---------- repeat something you buy often ---------- */
/** The things you record most, so recording them again is one tap. */
function frequentEntries(limit) {
  var seen = {};
  db.tx.forEach(function (t) {
    if (t.type !== "out" || t.potId || t.fundId) return;
    var name = merchantKey(t) || t.cat;
    if (!name) return;
    var key = name + "|" + Math.round(t.amt) + "|" + (t.acc || "") + "|" + (t.cat || "");
    if (!seen[key]) {
      seen[key] = { name: name, amt: Math.round(t.amt), acc: t.acc, cat: t.cat,
                    how: t.how, appId: t.appId, channel: t.channel, n: 0, last: t.date };
    }
    seen[key].n++;
    if (t.date > seen[key].last) seen[key].last = t.date;
  });
  return Object.keys(seen).map(function (k) { return seen[k]; })
    .filter(function (x) { return x.n >= 2; })
    .sort(function (a, b) { return b.n - a.n || (a.last < b.last ? 1 : -1); })
    .slice(0, limit || 6);
}
/** Record the same thing again, today. Never silently — you see it happen. */
function repeatEntry(t) {
  if (!t) return null;
  var copy = {
    id: id("t"), type: t.type, amt: Math.round(t.amt), cat: t.cat, acc: t.acc,
    to: t.to || "", how: t.how, appId: t.appId || "", channel: t.channel || "",
    date: today(), time: hm(new Date()), noTime: false,
    note: t.note || "", merchant: t.merchant || "",
    status: "done", deducted: 0, refunds: [],
    repeatOf: t.id, createdAt: stamp(), updatedAt: stamp()
  };
  db.tx.push(copy);
  save();
  return copy;
}

/* ---------- money lent and owed ---------- */
function debts() {
  if (!Array.isArray(db.debts)) db.debts = [];
  return db.debts;
}
function addDebt(o) {
  var d = {
    id: id("dbt"), who: String(o.who || "").slice(0, 40).trim(),
    dir: o.dir === "owe" ? "owe" : "lent",   /* lent = they owe you */
    amt: Math.round(o.amt || 0), date: o.date || today(),
    note: String(o.note || "").slice(0, 80),
    accId: o.accId || "", settled: [], createdAt: stamp()
  };
  if (!d.who || d.amt <= 0) return null;
  debts().push(d);
  save();
  return d;
}
function settleDebt(did, amount, dateIso) {
  var d = debts().filter(function (x) { return x.id === did; })[0];
  if (!d) return null;
  var amt = Math.round(amount || 0);
  if (amt <= 0) return null;
  d.settled.push({ amt: amt, date: dateIso || today() });
  save();
  return d;
}
function removeDebt(did) {
  db.debts = debts().filter(function (x) { return x.id !== did; });
  save();
  return true;
}
function debtLeft(d) {
  var back = (d.settled || []).reduce(function (s, x) { return s + Math.round(x.amt || 0); }, 0);
  return Math.max(0, Math.round(d.amt) - back);
}
function debtSummary() {
  var list = debts();
  var owedToYou = 0, youOwe = 0, open = [];
  list.forEach(function (d) {
    var left = debtLeft(d);
    if (left <= 0) return;
    open.push(d);
    if (d.dir === "lent") owedToYou += left; else youOwe += left;
  });
  var byWho = {};
  open.forEach(function (d) {
    var k = d.who;
    if (!byWho[k]) byWho[k] = { who: k, net: 0, items: [] };
    byWho[k].net += d.dir === "lent" ? debtLeft(d) : -debtLeft(d);
    byWho[k].items.push(d);
  });
  return {
    owedToYou: owedToYou, youOwe: youOwe, net: owedToYou - youOwe,
    open: open, all: list,
    people: Object.keys(byWho).map(function (k) { return byWho[k]; })
      .sort(function (a, b) { return Math.abs(b.net) - Math.abs(a.net); })
  };
}

/* ---------- the Indian financial year ---------- */
/** FY 2026-27 runs 1 April 2026 to 31 March 2027. */
function fyOf(iso) {
  var d = dateFrom(iso || today());
  var y = d.getFullYear();
  return d.getMonth() >= 3 ? y : y - 1;
}
function fyLabel(startYear) {
  return "FY " + startYear + "\u2013" + String(startYear + 1).slice(2);
}
function fyRange(startYear) {
  return { from: startYear + "-04-01", to: (startYear + 1) + "-03-31" };
}
function fysWithData() {
  var seen = {};
  db.tx.forEach(function (t) { if (t.date) seen[fyOf(t.date)] = 1; });
  return Object.keys(seen).map(Number).sort();
}
function fySummary(startYear) {
  var r = fyRange(startYear);
  var list = db.tx.filter(function (t) { return t.date >= r.from && t.date <= r.to; });
  var t = totalsFor(list);
  var byMonth = {};
  list.forEach(function (x) {
    var m = mOf(x.date);
    byMonth[m] = (byMonth[m] || 0) + netSpend(x);
  });
  var months = [];
  for (var i = 0; i < 12; i++) {
    var mk2 = mShift(startYear + "-04", i);
    months.push({ label: mLabel(mk2).replace(/ \d{4}$/, ""), value: byMonth[mk2] || 0, mk: mk2 });
  }
  return {
    year: startYear, label: fyLabel(startYear), from: r.from, to: r.to,
    list: list, totals: t, months: months,
    cats: byCategory(list), fees: feesInYear(String(startYear)),
    monthsRecorded: Object.keys(byMonth).length
  };
}

/* ---------- what changed, and when ---------- */

  if (!Array.isArray(db.log)) db.log = [];

  db.log = db.log.slice(0, 200);
}

/* ---------- Net worth ---------- */
function netWorthParts() {
  var bank = 0, cash = 0, wallet = 0;
  db.accounts.filter(function (a) { return !a.archived; }).forEach(function (a) {
    if (a.kind === "card") return;
    var b = balance(a.id);
    if (a.kind === "cash") cash += b;
    else if (a.kind === "wallet") wallet += b;
    else bank += b;
  });
  var owed = 0, seen = {};
  cards().forEach(function (c) { owed += cardOutstanding(c); });
  emis().forEach(function (e) { owed += emiLeft(e.cardId); });
  var potsAmt = potsTotal(), fundsAmt = fundsTotal();
  return {
    bank: bank, cash: cash, wallet: wallet, pots: potsAmt, funds: fundsAmt,
    assets: bank + cash + wallet + potsAmt + fundsAmt,
    owed: owed,
    net: bank + cash + wallet + potsAmt + fundsAmt - owed
  };
}

/* ---------- Debt payoff ---------- */
function debtPlan() {
  var rows = [];
  emis().forEach(function (e) {
    var left = emiLeft(e.cardId);
    var per = Math.round(e.perMonth || 0);
    if (left <= 0 || per <= 0) return;
    var months = Math.ceil(left / per);

        per: m.statementRemaining, months: 1,
        done: m.statement && m.statement.dueDate ? m.statement.dueDate : "", id: c.id });
    }

  var perMonth = rows.reduce(function (s, r) { return s + r.per; }, 0);
  var longest = rows.reduce(function (n, r) { return Math.max(n, r.months); }, 0);
