/* =========================================================
   CARD TIMING — which card to use today, and why
   ---------------------------------------------------------
   The idea in one line: a purchase made the day AFTER a card's
   statement closes sits on the next statement, so you get the
   whole billing cycle plus the payment window before the money
   actually leaves you. A purchase made the day BEFORE closing
   lands on the bill that is about to be generated.

   Nothing here is financial advice and nothing is automatic —
   it is arithmetic on the dates you entered.
   ========================================================= */

/** Days you would hold on to your money if you spent on this card today. */
function freeDays(card) {
  if (!card.stmtDay) return null;
  var close = nextClosing(card, today());
  var due = expectedDue(card, close);
  if (!due) return null;
  return { close: close, due: due,
    toClose: daysBetweenIso(today(), close),
    total: daysBetweenIso(today(), due) };
}
/** A plain-words verdict for using this card right now. */
function cardTiming(card) {
  var f = freeDays(card);
  var m = cardMoney(card);
  var out = { card: card, free: f, money: m, rank: -1, tone: "", head: "", why: "", warn: "" };

  if (m.limit > 0 && m.available !== null && m.available <= 0) {
    out.tone = "r"; out.head = "No room left"; out.rank = -100;
    out.why = "You have used the whole " + money(m.limit) + " limit.";
    return out;
  }
  var overdue = unpaidStatements(card.id).filter(function (st) {
    return st.dueDate && st.dueDate < today() && statementRemaining(st) > 0;
  });
  if (overdue.length) {
    out.tone = "r"; out.head = "Pay this first"; out.rank = -50;
    out.why = money(overdue.reduce(function (s, st) { return s + statementRemaining(st); }, 0)) +
      " is past its due date. Using it now adds to a bill you are already late on.";
    return out;
  }
  if (!f) {
    out.tone = ""; out.head = "Dates not set"; out.rank = 0;
    out.why = "Add this card's bill date and payment date to see how it compares.";
    return out;
  }

  out.rank = f.total;
  if (f.toClose === 0) {
    out.tone = "w"; out.head = "Bill closes today";
    out.why = "Anything you spend today probably lands on the bill generated tonight, due " +
      fDateLong(f.due) + ".";
    out.warn = "Wait until tomorrow and the same purchase moves to the next cycle.";
  } else if (f.toClose <= 3) {
    out.tone = "w"; out.head = "Bill closes in " + f.toClose + " day" + (f.toClose === 1 ? "" : "s");
    out.why = "Spending now goes on the bill generated on " + fDateLong(f.close) +
      ", due " + fDateLong(f.due) + " — about " + f.total + " days from today.";
    out.warn = "Waiting until after " + fDateLong(f.close) + " would give you roughly a month longer to pay.";
  } else {
    out.tone = "g"; out.head = f.total + " days before you pay";
    out.why = "The bill closes on " + fDateLong(f.close) + " and is due " + fDateLong(f.due) + ".";
  }

  if (m.limit > 0 && m.utilisation !== null && m.utilisation >= 70) {
    out.tone = out.tone === "g" ? "w" : out.tone;
    out.warn = (out.warn ? out.warn + " " : "") +
      "You have already used " + Math.round(m.utilisation) + "% of this card's limit.";
    out.rank -= 20;
  }
  return out;
}
/** Every card, best timing first. */
function cardAdvice() {
  return cards().map(cardTiming).sort(function (a, b) { return b.rank - a.rank; });
}
/** Cards whose bill just generated — the sweet spot. */
function freshCards() {
  return cardAdvice().filter(function (x) {
    return x.free && x.free.toClose >= 20 && x.rank > 0;
  });
}
/** Cards about to bill — spending now shortens your payment window. */
function closingSoon() {
  return cardAdvice().filter(function (x) {
    return x.free && x.free.toClose <= 3 && x.rank > 0;
  });
}

function cardPerks(cardId) {
  db.perks = db.perks || {};
  if (db.perks[cardId]) return db.perks[cardId];
  /* a virtual card shares the physical card's benefits */
  var c = acc(cardId);

  return [];
}
/** A virtual card and its physical parent are ONE card: one limit, one bill,
    one set of perks. The virtual number is just another way to pay. */
function perkOwner(cardId) {
  var c = acc(cardId);
  return (c && c.virtualOf) ? c.virtualOf : cardId;
}
function setCardPerks(cardId, list) {
  db.perks = db.perks || {};

function seedPerks() {
  db.perks = db.perks || {};

    if (db.perks[cardId]) return;
    db.perks[cardId] = KNOWN_PERKS[cardId].perks.map(function (p) {
      return Object.assign({}, p, { verified: true });

}
function perkSourceNote(cardId) {

/* ---------- how many times you have used a perk ---------- */
function periodStart(period) {
  var now = new Date();
  if (period === "month") return mKey(now) + "-01";
  if (period === "quarter") {
    var q = Math.floor(now.getMonth() / 3) * 3;
    return now.getFullYear() + "-" + p2(q + 1) + "-01";
  }
  if (period === "year") return now.getFullYear() + "-01-01";
  return "";
}
function periodWords(period) {
  return { month:"this month", quarter:"this quarter", year:"this year",
           once:"ever", always:"" }[period] || "";
}
/** Times this perk has been marked used in its current period. */
function perkUsed(cardId, perk) {
  var from = periodStart(perk.period);
  var owner = perkOwner(cardId);
  var family = db.accounts.filter(function (a) {
    return a.id === owner || a.virtualOf === owner;
  }).map(function (a) { return a.id; });
  return db.tx.filter(function (t) {
    if (family.indexOf(t.acc) === -1) return false;
    if (!t.perkId || t.perkId !== perk.id) return false;
    if (from && t.date < from) return false;
    return true;
  }).length;
}
function perkLeft(cardId, perk) {
  if (perk.period === "always") return null;
  return Math.max(0, (perk.cap || 1) - perkUsed(cardId, perk));
}
function perkAvailable(cardId, perk) {
  var left = perkLeft(cardId, perk);
  return left === null || left > 0;
}

/** For a category, which cards still have an unused perk. */
function suggestFor(cat) {
  var out = [], seenPerk = {};
  cards().forEach(function (c) {
    if (c.virtualOf) return; /* the physical card already covers it */
    cardPerks(c.id).forEach(function (p) {
      if (p.cat !== cat) return;
      if (!perkAvailable(c.id, p)) return;
      var timing = cardTiming(c);
      out.push({ card: c, perk: p, left: perkLeft(c.id, p),
        days: timing.free ? timing.free.total : 0, tone: timing.tone });
    });
  });
  return out.sort(function (a, b) { return b.days - a.days; });
}
/** Everything still available, grouped by what you would buy. */
function perkBoard() {
  var board = {};
  PERK_CATS.forEach(function (cat) {
    var list = suggestFor(cat);

  });
  return board;
}
/** Perks used up in this period — shown so you know why they vanished. */
function usedUpPerks() {
  var out = [];
  cards().forEach(function (c) {
    cardPerks(c.id).forEach(function (p) {

      out.push({ card: c, perk: p, used: perkUsed(c.id, p) });

  return out;
}

function grabSetup() {
  var box = el("setupScreen");
  if (!box) return;
  var fields = box.querySelectorAll("[data-s]");
  for (var i = 0; i < fields.length; i++) {
    ui.setupDraft[fields[i].getAttribute("data-s")] = fields[i].value;

function finishSetup(skipRest) {
  var s = ui.setupDraft || {};
  db.profile.name = String(s.name || "").trim();
  if (s.currency && CURRENCIES[s.currency]) db.settings.currency = s.currency;
  if (!skipRest) {
    if (String(s.bank || "").trim()) {
      db.accounts.push({ id:id("a"), name:String(s.bank).trim(), kind:"bank", bank:"", last4:"",
        open:toMinor(s.bankAmt), include:true, primary:true, archived:false });
    }
    if (String(s.card || "").trim()) {
      db.accounts.push({ id:id("a"), name:String(s.card).trim(), kind:"card", bank:"", last4:"",
        open:0, limit:toMinor(s.cardLimit), dueDay:null, include:true, primary:false, archived:false });
    }
    (s.apps || []).forEach(function (name) {
      var banks = liveAccounts("bank").map(function (a) { return a.id; });
      db.apps.push({ id:id("p"), name:name, src:banks, def:banks[0] || "" });
    });
    if (toMinor(s.budget) > 0) db.monthlyBudget = toMinor(s.budget);
  }
  if (!liveAccounts("cash").length) {
    db.accounts.push({ id:id("a"), name:"Cash", kind:"cash", bank:"", last4:"", open:toMinor(s.cash || 0),
      include:true, primary:false, archived:false });
  }
  db.settings.setupDone = true;
  save();
  el("setupScreen").classList.add("hidden");
  ui.view = "home";
  render();
  toast("All set — tap ＋ to add your first entry");
}

function showLock() {
  el("pinPad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","⌫"].map(function (k) {
    return k === "" ? "<span></span>" :
      '<button type="button" data-act="pinKey" data-k="' + k + '" aria-label="' + (k === "⌫" ? "Delete" : k) + '">' + k + "</button>";
  }).join("");
  ui.pin = "";
  paintPin();
  el("lockScreen").classList.remove("hidden");
}
function paintPin() {
  var dots = el("pinDots").children;
  for (var i = 0; i < dots.length; i++) dots[i].className = i < ui.pin.length ? "on" : "";
}
function pinKey(k) {
  if (k === "⌫") ui.pin = ui.pin.slice(0, -1);
  else if (ui.pin.length < 4) ui.pin += k;
  paintPin();
  if (ui.pin.length === 4) {
    if (ui.pin === db.settings.pin) {
      el("lockScreen").classList.add("hidden");
      ui.pin = "";
      el("lockMsg").textContent = "Everything is stored on this device only.";
    } else {
      el("lockMsg").textContent = "That PIN didn't match. Try again.";
      ui.pin = "";
      paintPin();
    }
  }
}

/* =========================================================
   14. BACKUP, RESTORE, EXAMPLE DATA
   ========================================================= */
function download(name, text, type) {
  try {
    var blob = new Blob([text], { type: type || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (e) { toast("Your browser blocked the download"); return false; }
}
/* =========================================================
   PDF and Excel builders — written from scratch, no libraries,
   so the page stays a single offline file.
   ========================================================= */

function downloadBytes(name, bytes, type) {
  try {
    var blob = new Blob([bytes], { type: type || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (e) { toast("Your browser blocked the download"); return false; }
}

/* =========================================================
   REPORT EXPORTS
   Every export uses exactly the rows the Reports page is showing.
   Two styles, both of which keep the whole refund story:
     summary — one row per transaction, with refund totals
     events  — one row per money event (payment, refund, charge kept)
   ========================================================= */

function safeSlug(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
}
/** money-report_2026-08-01_to_2026-08-31.csv, plus a short safe hint when filtered. */
function reportFileName(ext) {
  var R = reportData(), f = ui.report.f, bits = [];
  if (f.cat) bits.push(safeSlug(f.cat));
  if (f.app) bits.push(safeSlug(appName(f.app)));
  if (f.type && !f.cat) bits.push(safeSlug(f.type === "out" ? "spent" : f.type === "in" ? "received" : f.type));
  if (f.status) bits.push(safeSlug(f.status));
  var mid = bits.length ? "_" + bits.slice(0, 2).join("_") : "";
  var style = (ui.report.style === "events" && (ext === "csv" || ext === "json")) ? "_events" : "";
  return "money-report" + mid + style + "_" + R.from + "_to_" + R.to + "." + ext;
}
function plainMoney(minor) {
  var v = Math.round(minor || 0);
  return (v < 0 ? "-" : "") + (Math.abs(v) / 100).toFixed(2);
}
function currencyWord() { return db.settings.currency || "INR"; }
function statusWord(t) { return (STATUS[effectiveStatus(t)] || STATUS.done).label; }
/** Wording the spec asks for on refunded rows. */
function longStatus(t) {
  var back = refundTotal(t);
  if (t.status === "failed") return stuck(t) > 0 ? "Failed - awaiting reversal" : "Failed";
  if (t.status === "cancelled") return stuck(t) > 0 ? "Cancelled - refund pending" : "Cancelled";
  if (t.status === "pending") return "Waiting";
  if (!back) return "Successful";
  var state = refundState(t);
  return state === "full" ? "Fully refunded" : "Partially refunded";
}
function retainedOf(t) {
  var back = refundTotal(t);
  if (!back || t.type !== "out") return 0;
  if (t.status === "failed" || t.status === "cancelled") return 0;
  return Math.max(0, Math.round(t.amt || 0) - back);
}
function refundDates(t) {
  return (t.refunds || []).map(function (r) { return r.date; }).join("; ");
}
function typeWord(t) {
  return t.type === "out" ? "Expense" : t.type === "in" ? "Income" :
         t.type === "bill" ? "Card bill payment" : "Transfer";
}
function payWord(t) {
  if (t.type === "move" || t.type === "bill") return "Account transfer";
  return t.how === "app" ? "Payment app" : (howLabel(t.how) || "Other");
}

/* ---------- rows: one per transaction ---------- */
var SUMMARY_COLS = [
  "Transaction ID", "Transaction date", "Transaction time", "Time recorded?", "Type", "Category",
  "Payment method", "Payment app", "Card used", "Funding source", "Destination account",
  "Original amount", "Refund received", "Refund dates", "Retained charge", "Pending recovery",
  "Net expense", "Status", "Note", "Currency",
  "Original amount (minor units)", "Net expense (minor units)", "Recorded at", "Last updated"
];
function summaryRows(list) {
  return list.map(function (t) {
    return [
      t.id,
      t.date,
      t.noTime || !t.time ? "" : t.time,
      t.noTime || !t.time ? "Not recorded" : "Recorded",
      typeWord(t),
      t.cat || "",
      payWord(t),
      t.appId ? appName(t.appId) : "",
      (t.type === "out" && isCard(t.acc)) ? (channelLabel(t.channel) || "Not noted") : "",
      accName(t.acc),
      t.to ? accName(t.to) : "",
      plainMoney(t.amt),
      plainMoney(refundTotal(t)),
      refundDates(t),
      plainMoney(retainedOf(t)),
      plainMoney(stuck(t)),
      plainMoney(t.type === "out" ? netSpend(t) : t.type === "in" ? -netIncome(t) : 0),
      longStatus(t),
      t.note || "",
      currencyWord(),
      String(Math.round(t.amt || 0)),
      String(Math.round(t.type === "out" ? netSpend(t) : 0)),
      t.createdAt || "",
      t.updatedAt || ""
    ];
  });
}

/* ---------- rows: one per money event ---------- */
var EVENT_COLS = [
  "Event ID", "Parent transaction ID", "Event type", "Event date", "Event time",
  "Amount", "Direction", "Category", "Payment method", "Payment app",
  "Source or destination", "Status after event", "Note", "Currency",
  "Amount (minor units)", "Recorded at"
];
function eventRows(list) {
  var out = [];
  sortTx(list).forEach(function (t) {
    out.push([
      t.id + "-pay",
      t.id,
      t.type === "out" ? "Original payment" : t.type === "in" ? "Income received" :
        t.type === "bill" ? "Card bill payment" : "Transfer",
      t.date,
      t.noTime || !t.time ? "" : t.time,
      plainMoney(t.amt),
      t.type === "in" ? "In" : t.type === "out" ? "Out" : "Moved",
      t.cat || "",
      payWord(t),
      t.appId ? appName(t.appId) : "",
      t.to ? accName(t.acc) + " -> " + accName(t.to) : accName(t.acc),
      t.status === "done" ? "Successful" : longStatus(t),
      t.note || "",
      currencyWord(),
      String(Math.round(t.amt || 0)),
      t.createdAt || ""
    ]);
    if (t.status === "failed" || t.status === "cancelled") {
      out.push([
        t.id + "-status",
        t.id,
        t.status === "failed" ? "Marked failed" : "Marked cancelled",
        t.date,
        t.noTime || !t.time ? "" : t.time,
        plainMoney(t.deducted || 0),
        Math.round(t.deducted || 0) > 0 ? "Out (deducted)" : "No money moved",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        Math.round(t.deducted || 0) > 0 ? "Amount was deducted and is awaiting return" : "No amount was deducted",
        currencyWord(),
        String(Math.round(t.deducted || 0)),
        t.updatedAt || ""
      ]);
    }
    (t.refunds || []).forEach(function (r, i) {
      out.push([
        r.id || (t.id + "-refund-" + (i + 1)),
        t.id,
        t.status === "failed" ? "Reversal received" : "Refund received",
        r.date,
        "",
        plainMoney(r.amt),
        "In",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(r.to),
        longStatus(t),
        r.note || "",
        currencyWord(),
        String(Math.round(r.amt || 0)),
        t.updatedAt || ""
      ]);
    });
    var kept = retainedOf(t);
    if (kept > 0) {
      out.push([
        t.id + "-retained",
        t.id,
        "Retained charge",
        (t.refunds && t.refunds.length) ? t.refunds[t.refunds.length - 1].date : t.date,
        "",
        plainMoney(kept),
        "Kept by seller",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        "Not returned - counts as the final cost",
        currencyWord(),
        String(Math.round(kept)),
        t.updatedAt || ""
      ]);
    }
    var waiting = stuck(t);
    if (waiting > 0) {
      out.push([
        t.id + "-pending",
        t.id,
        "Pending recovery",
        t.date,
        "",
        plainMoney(waiting),
        "Awaiting return",
        t.cat || "",
        payWord(t),
        t.appId ? appName(t.appId) : "",
        accName(t.acc),
        longStatus(t),
        "Still not returned",
        currencyWord(),
        String(Math.round(waiting)),
        t.updatedAt || ""
      ]);
    }
  });
  return out;
}

function exportStyle() { return ui.report && ui.report.style === "events" ? "events" : "summary"; }
function exportCols() { return exportStyle() === "events" ? EVENT_COLS : SUMMARY_COLS; }
function exportRows(list) { return exportStyle() === "events" ? eventRows(list) : summaryRows(sortTx(list)); }

function filterDescription() {
  var chipsNow = activeFilterChips();
  return chipsNow.length ? chipsNow.map(function (c) { return c.label; }).join("; ") : "None";
}
function summaryPairs(R) {
  var top = { cat: R.cats[0], acc: R.accs[0], how: R.hows[0] };
  return [
    ["Money in", plainMoney(R.totals.in)],
    ["Real spending (after refunds)", plainMoney(R.totals.out)],
    [R.totals.net >= 0 ? "Kept" : "Overspent by", plainMoney(Math.abs(R.totals.net))],
    ["Refunds received", plainMoney(R.totals.back)],
    ["Charges kept by sellers", plainMoney(R.retained)],
    ["Still waiting to come back", plainMoney(R.pendingBack)],
    ["Cash flow: money out", plainMoney(R.flow.out)],
    ["Cash flow: card bills paid", plainMoney(R.flow.bills)],
    ["Cash flow: moved between accounts", plainMoney(R.flow.moved)],
    ["Money you have now", plainMoney(netWorth())],
    ["Average per day", plainMoney(R.perDayAvg)],
    ["Average per purchase", plainMoney(R.avgSpend)],
    ["Biggest category", top.cat ? top.cat.label + " (" + plainMoney(top.cat.value) + ")" : "-"],
    ["Most-used account", top.acc ? top.acc.label + " (" + plainMoney(top.acc.value) + ")" : "-"],
    ["Most-used way to pay", top.how ? top.how.label + " (" + plainMoney(top.how.value) + ")" : "-"],
    ["Biggest single day", R.busiest ? fDate(R.busiest) + " (" + plainMoney(R.busiestAmt) + ")" : "-"],
    ["Weekday spending", plainMoney(R.week)],
    ["Weekend spending", plainMoney(R.weekend)],
    ["Entries counted", String(R.count)]
  ];
}
function reportTables() {
  var R = reportData();
  var live = db.accounts.filter(function (a) { return !a.archived; });
  return {
    R: R,
    title: "Money Tracker report",
    subtitle: fDateLong(R.from) + " to " + fDateLong(R.to) + "  (" + R.days + " day" + (R.days === 1 ? "" : "s") +
      ", " + R.count + " entries)",
    filters: filterDescription(),
    summary: summaryPairs(R),
    accounts: live.map(function (a) {
      var hit = R.accs.filter(function (x) { return x.label === accName(a.id); })[0];
      return [a.name, a.kind === "card" ? "Credit card" : a.kind === "cash" ? "Cash" :
        a.kind === "wallet" ? "Wallet" : "Bank", plainMoney(balance(a.id)), plainMoney(hit ? hit.value : 0)];
    }),
    cats: R.cats.map(function (c) {
      return [c.label, plainMoney(c.value), Math.round((c.value / (R.totals.out || 1)) * 100) + "%"];
    }),

function parseCsv(text) {
  var rows = [], row = [], cur = "", q = false, i, c;
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.length > 1; });
}
function importCsv(text) {
  var rows = parseCsv(text);
  if (rows.length < 2) { toast("That file had no rows I could read"); return; }
  var head = rows[0].map(function (x) { return x.trim().toLowerCase(); });
  var at = function (name) { return head.indexOf(name); };
  var iDate = at("date"), iAmt = at("amount"), iType = at("type"), iCat = at("category"),
      iAcc = at("account"), iNote = at("note"), iTime = at("time");
  if (iDate === -1 || iAmt === -1) { toast("The file needs at least a date and amount column"); return; }
  var added = 0, skipped = 0;
  rows.slice(1).forEach(function (r) {
    var date = (r[iDate] || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; return; }
    var amt = toMinor(r[iAmt]);
    if (amt <= 0) { skipped++; return; }
    var typeRaw = ((iType > -1 ? r[iType] : "") || "spent").toLowerCase();
    var type = typeRaw.indexOf("receiv") > -1 || typeRaw === "in" || typeRaw === "income" ? "in"
             : typeRaw.indexOf("mov") > -1 || typeRaw === "transfer" ? "move" : "out";
    var accName2 = ((iAcc > -1 ? r[iAcc] : "") || "").trim();
    var found = db.accounts.filter(function (a) { return a.name.toLowerCase() === accName2.toLowerCase(); })[0];
    if (!found && accName2) {
      found = { id:id("a"), name:accName2, kind:"bank", bank:"", last4:"", open:0, include:true, primary:false, archived:false };
      db.accounts.push(found);
    }
    if (!found) found = firstBank() || cashAcc();
    if (!found) {
      found = { id:id("a"), name:"Cash", kind:"cash", bank:"", last4:"", open:0, include:true, primary:false, archived:false };
      db.accounts.push(found);
    }
    var time = ((iTime > -1 ? r[iTime] : "") || "").trim();
    db.tx.push({
      id:id("t"), type:type, amt:amt, cat:((iCat > -1 ? r[iCat] : "") || "Other").trim() || "Other",
      acc:found.id, to:"", how:"other", appId:"", date:date,
      time:/^\d{2}:\d{2}$/.test(time) ? time : "", noTime:!/^\d{2}:\d{2}$/.test(time),
      note:((iNote > -1 ? r[iNote] : "") || "").trim(), status:"done", deducted:0, refunds:[],
      createdAt:stamp(), updatedAt:stamp()
    });

  });

}
function pickFile(kind) {
  var input = el("fileIn");

  input.value = "";
  input.onchange = function () {
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onerror = function () { toast("That file couldn't be read"); };
    reader.onload = function () {
      var text = String(reader.result || "");
      if (kind === "csv") { importCsv(text); return; }
      var parsed;
      try { parsed = JSON.parse(text); } catch (e) { toast("That doesn't look like a backup file"); return; }
      var payload = parsed && parsed.data ? parsed.data : parsed;
      if (!payload || !Array.isArray(payload.tx)) { toast("That backup is missing its entries"); return; }
      /* keep what is here now, so a wrong file costs nothing */
      var had = db.tx.length;
      try { localStorage.setItem(BACKUP_KEY, JSON.stringify(db)); } catch (e) {}
      var base = blank();
      Object.keys(base).forEach(function (k) {
        if (payload[k] !== undefined && payload[k] !== null) base[k] = payload[k];
      });
      base.settings = Object.assign(blank().settings, payload.settings || {});
      base.settings.setupDone = true;
      db = base;
      fillMissingLimits();
      save(); applyTheme(); render();
      toast("Restored " + db.tx.length + " entries (was " + had + ")",
        function () { act("restoreYes", {}); });
    };
    reader.readAsText(f);
  };
  input.click();
}

/** Which theme is actually painted right now, auto resolved to a real one. */
function themeNow() {
  var t = db.settings.theme || "auto";
  if (t !== "auto") return t;
  try {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  } catch (e) {}
  return "light";
}
function applyTheme() {
  var t = db.settings.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  /* keep the browser chrome in step, and the button honest */
  var meta = document.querySelector && document.querySelector('meta[name="theme-color"]');
  if (meta && meta.setAttribute) {
    meta.setAttribute("content", themeNow() === "dark" ? "#161a20" : "#0d6e66");
  }
  paintTheme();
}
/** Light → Dark → Follow the system, and say which one you landed on. */
function cycleTheme() {
  var order = ["light", "dark", "auto"];
  var at = order.indexOf(db.settings.theme || "auto");
  db.settings.theme = order[(at + 1) % order.length];
  save();
  applyTheme();
  toast(db.settings.theme === "auto"
    ? "Following your device \u2014 " + themeNow() + " right now"
    : db.settings.theme === "dark" ? "Dark" : "Light");
  if (ui.view === "settings") render();
  return db.settings.theme;
}
/** The button shows what a press will do, not a fixed icon. */
function paintTheme() {
  var b = el("themeBtn");
  if (!b) return;
  var mode = db.settings.theme || "auto";
  var icon = mode === "light" ? "\u2600\ufe0f" : mode === "dark" ? "\ud83c\udf19" : "\ud83c\udf17";
  var says = mode === "light" ? "Light" : mode === "dark" ? "Dark" : "Following your device";
  var next = mode === "light" ? "dark" : mode === "dark" ? "your device" : "light";
  b.innerHTML = icon;
  b.setAttribute("title", says + " \u2014 tap for " + next);
  b.setAttribute("aria-label", says + ". Tap to switch to " + next + ".");
}

function readForm(form) {
  var out = {}, els = form.elements, i, e;
  for (i = 0; i < els.length; i++) {
    e = els[i];
    if (!e.name) continue;
    if (e.type === "checkbox") {
      if (e.name === "src") { (out.src = out.src || []); if (e.checked) out.src.push(e.value); }
      else out[e.name] = e.checked;
    } else if (e.type === "radio") {
      if (e.checked) out[e.name] = e.value;
    } else out[e.name] = e.value;
  }
  return out;
}

  var f = readForm(form), t, g;

    case "account": {
      var isCard = f.kind === "card";
      var open = toMinor(f.open);
      var rec = {
        id: f.id || id("a"),
        name: String(f.name || "").trim() || "Account",
        kind: f.kind, bank: String(f.bank || "").trim(),
        last4: String(f.last4 || "").replace(/\D/g, "").slice(0, 4),

function onKey(e) {
  if (e.key === "Escape" && !el("scrim").classList.contains("hidden")) { closeSheet(); ui.draft = null; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (typingInto(e.target)) return;
  if (!el("scrim").classList.contains("hidden")) return;
  var key = String(e.key || "").toLowerCase();
  for (var i2 = 0; i2 < KEYS.length; i2++) {
    if (KEYS[i2].k === key || (KEYS[i2].k === "?" && e.key === "?")) {
      if (e.preventDefault) e.preventDefault();
      KEYS[i2].run();
      return;
    }
  }
}
