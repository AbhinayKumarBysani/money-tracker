<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<title>Money Tracker</title>
<style>
:root{
  /* Premium Midnight Financial — light.
     A soft blue-grey page with pure white cards, so a card lifts off the page
     rather than merging into it. Indigo carries every interaction; colour is
     reserved for meaning, never decoration. */
  --bg:#f7f8fc; --surface:#ffffff; --surface-2:#f1f4f9; --surface-3:#e8edf5;
  --nav:#ffffff; --border:#e2e8f0;
  --text:#172033; --muted:#5d6b7d; --faint:#94a3b8;
  --accent:#4f46e5; --accent-hi:#4338ca; --accent-soft:#eef2ff;
  /* Each status colour is one step deeper than the reference palette so that
     it still reads at 4.5:1 on its own soft background. The published tones
     land at 3.0-4.4:1 there, which is under the bar this same spec sets. */
  --ok:#15803d; --ok-soft:#ecfdf3;
  --warn:#b45309; --warn-soft:#fff7e6;
  --bad:#c81e1e; --bad-soft:#fef2f2;
  --info:#0369a1; --info-soft:#e6f4fd;
  --save:#047857; --save-soft:#ecfdf3;
  --invest:#0f766e; --invest-soft:#e6fffb;
  --credit:#4f46e5; --credit-soft:#eef2ff;
  /* Money leaving is not an error. An ordinary expense reads as plain text;
     only a real problem earns a colour. */
  --in:#16a34a; --out:#172033; --move:#0284c7; --spend:#172033;
  --shadow:0 1px 2px rgba(23,32,51,.05),0 6px 18px rgba(23,32,51,.06);
  --r:14px; --r2:10px;
}
[data-theme="dark"]{
  /* Premium Midnight Financial — dark.
     Layered navy, never pure black: hierarchy comes from five surface shades
     rather than from heavy shadows, and light text on true black halates. */
  --bg:#0b1020; --surface:#121a2b; --surface-2:#192235; --surface-3:#202c40;
  --nav:#0e1627; --border:#293449;
  --text:#f8fafc; --muted:#aab6c8; --faint:#778399;
  --accent:#818cf8; --accent-hi:#a5b4fc; --accent-soft:#20264d;
  --ok:#4ade80; --ok-soft:#123522;
  --warn:#fbbf24; --warn-soft:#422f12;
  --bad:#fb7185; --bad-soft:#451a24;
  --info:#38bdf8; --info-soft:#0c2c40;
  --save:#34d399; --save-soft:#123522;
  --invest:#2dd4bf; --invest-soft:#0f3330;
  --credit:#818cf8; --credit-soft:#20264d;
  --in:#4ade80; --out:#f8fafc; --move:#38bdf8; --spend:#f8fafc;
  --shadow:0 1px 2px rgba(0,0,0,.36),0 8px 22px rgba(0,0,0,.26);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* Premium Midnight Financial — dark.
     Layered navy, never pure black: hierarchy comes from five surface shades
     rather than from heavy shadows, and light text on true black halates. */
  --bg:#0b1020; --surface:#121a2b; --surface-2:#192235; --surface-3:#202c40;
  --nav:#0e1627; --border:#293449;
  --text:#f8fafc; --muted:#aab6c8; --faint:#778399;
  --accent:#818cf8; --accent-hi:#a5b4fc; --accent-soft:#20264d;
  --ok:#4ade80; --ok-soft:#123522;
  --warn:#fbbf24; --warn-soft:#422f12;
  --bad:#fb7185; --bad-soft:#451a24;
  --info:#38bdf8; --info-soft:#0c2c40;
  --save:#34d399; --save-soft:#123522;
  --invest:#2dd4bf; --invest-soft:#0f3330;
  --credit:#818cf8; --credit-soft:#20264d;
  --in:#4ade80; --out:#f8fafc; --move:#38bdf8; --spend:#f8fafc;
  --shadow:0 1px 2px rgba(0,0,0,.36),0 8px 22px rgba(0,0,0,.26);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;padding-block-end:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit;max-inline-size:100%}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-inline-size:960px;margin-inline:auto;padding-inline:14px}
.hidden{display:none!important}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;inset-block-start:0;z-index:30;background:var(--surface);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:8px;min-block-size:56px}
.brand{font-weight:750;font-size:17px}
.grow{margin-inline-start:auto}
.ib{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  min-inline-size:40px;min-block-size:40px;padding:0 10px;font-size:15px}
.ib:hover{border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-block-end:12px}
.card h3{margin-block-end:8px}
.lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.big{font-size:26px;font-weight:750;letter-spacing:-.02em}
.mid{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .move{color:var(--move)} .warnc{color:var(--warn)}
.badc{color:var(--bad)} .okc{color:var(--ok)} .infoc{color:var(--info)}
.savec{color:var(--save)} .investc{color:var(--invest)} .creditc{color:var(--credit)}
.muted{color:var(--faint)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sec{margin-block:16px}
.sec>h2{margin-block-end:10px}
.rowline{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hero{background:linear-gradient(135deg,var(--accent),#0e7490);color:#fff;border:0}
.hero .lbl,.hero .sub{color:rgba(255,255,255,.88)}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#204a46,#22414e)}

label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-block-end:4px}
input,select,textarea{inline-size:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r2);padding:12px;outline:none;min-block-size:44px}
input[type=checkbox]{inline-size:20px;block-size:20px;min-block-size:20px;margin-inline-end:8px}
.f{margin-block-end:12px}
.two{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--r2);padding:13px 18px;
  font-weight:650;min-block-size:46px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.g{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.d{background:var(--bad);color:#fff}
.btn.s{padding:8px 12px;font-size:14px;min-block-size:38px;border-radius:9px}
.btn.full{inline-size:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:11px 6px;font-weight:650;color:var(--muted);min-block-size:44px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 13px;
  font-size:14.5px;font-weight:600;text-align:start;line-height:1.25;min-block-size:44px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-block-start:1px}
.chip[aria-pressed=true] small{color:inherit;opacity:.85}
.chip.new{border-style:dashed;color:var(--muted)}
.amtbox{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:2px 14px}
.amtbox span{font-size:24px;font-weight:700;color:var(--muted)}
.amtbox input{font-size:30px;font-weight:750;border:0;background:none;padding:10px 0;min-block-size:auto}
.step{margin-block-end:16px}
.step>.lbl{margin-block-end:7px;display:block}
.hint{font-size:13px;color:var(--muted);margin-block-start:6px}

.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-block-end:1px solid var(--border)}
.tx:last-child{border-block-end:0}
.tx .ic{inline-size:38px;block-size:38px;flex:0 0 auto;border-radius:11px;background:var(--surface-2);
  display:grid;place-items:center;font-size:18px}
.txmain{flex:1;min-inline-size:0;background:none;border:0;padding:0;text-align:start;color:inherit}
.txmain b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txmain span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txamt{font-weight:700;white-space:nowrap;text-align:end}
.hello{font-size:1.15rem;font-weight:700;margin-block:14px 8px;display:flex;
  align-items:baseline;gap:8px;flex-wrap:wrap}
.hello .sub{font-size:.82rem;font-weight:500}
.feed{display:flex;gap:0;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;margin-block-end:8px;overflow:hidden}
.feed::before{content:"";inline-size:4px;flex:none;background:var(--muted)}
.feed.red::before{background:var(--bad)}
.feed.amber::before{background:var(--warn)}
.feed.green::before{background:var(--in)}
.feed.blue::before{background:var(--move)}
.feedbody{flex:1;padding:12px 14px}
.feedbody b{display:block;font-size:.97rem;line-height:1.35}
.feedbody .sub{margin-block:4px 8px}
.waygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.way{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
  color:var(--text);font:inherit;cursor:pointer;text-align:center;transition:transform .1s ease,background .12s ease}
.way:hover{background:var(--surface-3);transform:translateY(-1px)}
.way:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.way b{font-size:23px;font-weight:400;line-height:1}
.way span{font-weight:650;font-size:.9rem}
.way small{color:var(--muted);font-size:.72rem;line-height:1.25}
.poolcards{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:10px}
.poolcard{flex:1 1 130px;display:flex;flex-direction:column;gap:1px;padding:9px 11px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  color:var(--text);font:inherit;cursor:pointer;text-align:start}
.poolcard:hover{background:var(--surface-3)}
.poolcard b{font-size:.86rem;font-weight:650}
.poolcard small{color:var(--muted);font-size:.72rem}
/* Spending is not a warning. Red is kept for things that need attention:
   an overdue bill, a shortfall, a failure. An ordinary purchase reads neutral. */
.mid.out,.big.out,.huge.out{color:var(--spend)}
.txamt.out{color:var(--spend)}
.note.bad .mid,.feed.red .mid{color:var(--bad)}
.huge{font-size:clamp(2.3rem,10vw,3.2rem);font-weight:800;letter-spacing:-.02em;
  line-height:1.05;margin-block:6px}
/* Motion: small, purposeful, and switched off if the system asks. */
@media(prefers-reduced-motion:no-preference){
  .card,.feed,.wtile{animation:rise .18s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .sheet{animation:sheetUp .2s cubic-bezier(.2,.8,.3,1) both}
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
  .toast{transition:opacity .18s ease,transform .18s ease}
  .bar i{transition:inline-size .28s cubic-bezier(.2,.8,.3,1)}
  .eye,.bang,.chev{transition:transform .14s ease}
  .eye:active,.bang:active{transform:scale(.9)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.palrow{display:flex;align-items:center;gap:12px;inline-size:100%;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-block-end:8px;
  color:var(--text);font:inherit;cursor:pointer;text-align:start}
.palrow:hover{background:var(--surface-2)}
.palrow.on{border-color:var(--accent);background:var(--accent-soft)}
.palswatch{display:flex;gap:2px;flex:none}
.palswatch i{display:block;inline-size:11px;block-size:22px;border-radius:2px}
.palname{flex:1;display:flex;flex-direction:column;gap:1px}
kbd{display:inline-block;min-inline-size:22px;text-align:center;padding:2px 6px;
  border:1px solid var(--border);border-block-end-width:2px;border-radius:6px;
  background:var(--surface-2);font:inherit;font-size:.82rem;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hmh{text-align:center;font-size:.68rem;color:var(--muted);font-weight:700;padding-block-end:2px}
.hmc{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--surface-2);
  font-size:.68rem;color:var(--muted)}
.hmc.off{opacity:.35}
.fall{display:flex;flex-direction:column;gap:10px}
.fallbar{block-size:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.fallbar i{display:block;block-size:100%;border-radius:6px}
.sparks{display:flex;gap:10px;flex-wrap:wrap}
.spark{flex:1 1 84px;display:flex;flex-direction:column;gap:2px;padding:8px;
  background:var(--surface-2);border-radius:10px}
.spark svg{inline-size:100%;block-size:24px}
.chart{inline-size:100%;block-size:auto;display:block}
.key{display:inline-block;inline-size:9px;block-size:9px;border-radius:2px;
  margin-inline:6px 3px;vertical-align:baseline}
.stack{display:flex;block-size:22px;border-radius:8px;overflow:hidden;margin-block:10px 8px}
.stack i{display:block;block-size:100%}
.pairs{display:flex;flex-direction:column;gap:14px}
.pairbar{block-size:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;
  margin-block-end:3px}
.pairbar i{display:block;block-size:100%;border-radius:5px}
.pairbar i.now{background:var(--accent)}
.pairbar i.was{background:var(--muted);opacity:.45}
.wkbars{display:flex;gap:8px;align-items:flex-end}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.wkcol{inline-size:100%;block-size:78px;display:flex;align-items:flex-end;
  background:var(--surface-2);border-radius:8px;overflow:hidden}
.wkcol i{display:block;inline-size:100%;border-radius:8px 8px 0 0;min-block-size:2px}
.chartcard{padding-block-end:6px}
.chartq{font-size:.82rem;color:var(--muted);margin-block:2px 10px}
.barrow{display:block;inline-size:100%;background:none;border:0;padding:6px 8px;
  margin-block-end:4px;border-radius:10px;color:var(--text);font:inherit;cursor:pointer;
  text-align:start}
.barrow:hover{background:var(--surface-2)}
.barrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fold{margin-block:14px}
.foldhead{inline-size:100%;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;
  color:var(--text);font:inherit;text-align:start;transition:background .12s ease}
.foldhead:hover{background:var(--surface-2)}
.foldhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold.open .foldhead{border-end-start-radius:0;border-end-end-radius:0;border-block-end:0}
.foldtitle{flex:1;display:flex;flex-direction:column;gap:1px}
.foldtitle b{font-size:1rem}
.chev{font-size:1.1rem;color:var(--muted);line-height:1}
.foldbody{border:1px solid var(--border);border-block-start:0;border-end-start-radius:14px;
  border-end-end-radius:14px;padding:12px 14px 14px;background:var(--surface)}
.foldbody > .card:first-child,.foldbody > .wtile:first-child{margin-block-start:0}
.cd.we{border-color:color-mix(in srgb,var(--move) 25%,var(--border))}
.cd.hol{outline:1px dashed var(--warn);outline-offset:-2px}
.cd.marked{box-shadow:inset 0 -3px 0 var(--accent)}
.cd .pins{display:block;font-size:.62rem;line-height:1;letter-spacing:-1px}
.tx.gap{border-inline-start:3px solid var(--warn);padding-inline-start:8px;
  background:color-mix(in srgb,var(--warn) 7%,transparent);border-radius:8px}
.bang{flex:none;inline-size:24px;block-size:24px;border-radius:50%;border:0;cursor:pointer;
  background:var(--warn);color:#1a1205;font-weight:800;font-size:.8rem;line-height:1;
  align-self:flex-start}
.bang:hover,.bang:focus-visible{filter:brightness(1.12)}
/* a row that is saved but still missing something: marked, never hidden */
.bangtag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);
  font-size:.76rem;font-weight:700;line-height:1.5}
.oktag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--muted)}
tr.rowbad>td{background:var(--bad-soft)}
tr.rowbad>td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.qbox{inline-size:100%;min-block-size:52px;resize:vertical;font:inherit;padding:10px 12px;
  border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.qbox:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.txamt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.dayhd{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding-block:8px 4px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);margin-inline-start:6px;vertical-align:1px}
.tag.w{background:#fff7e6;color:#92400e;border-color:#fcd9a3}
.tag.r{background:#fee4e2;color:#912018;border-color:#fda29b}
.tag.g{background:#e7f7ee;color:#05603a;border-color:#a6e9c5}
[data-theme=dark] .tag.w{background:#33291a;color:#dcb277;border-color:#4a3a22}
[data-theme=dark] .tag.r{background:#33201f;color:#e0a09b;border-color:#4a2b29}
[data-theme=dark] .tag.g{background:#1b2f26;color:#84c6a5;border-color:#2a4536}

.bar{block-size:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-block:6px}
.bar i{display:block;block-size:100%;background:var(--accent);border-radius:99px}
.bar i.w{background:var(--warn)} .bar i.o{background:var(--bad)}
table{inline-size:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 6px;border-block-end:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
td,th{word-break:break-word}
@media (max-width:380px){
  th,td{padding:8px 3px;font-size:13px}
  .btn{padding:12px 13px}
  .chip{padding:9px 10px;font-size:13.5px}
  .big{font-size:23px}
  .amtbox input{font-size:26px}
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.cd{aspect-ratio:1;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:1px;color:inherit}
.cd b{font-size:13px} .cd small{font-size:9.5px;color:var(--muted);line-height:1.1}
.cd.now{outline:2px solid var(--accent)} .cd.no{border:0;background:none}
svg{display:block;inline-size:100%;block-size:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin-block-start:8px}
.legend i{display:inline-block;inline-size:10px;block-size:10px;border-radius:3px;margin-inline-end:5px}
.note{display:flex;gap:9px;background:var(--surface-2);border:1px solid var(--border);
  border-inline-start:4px solid var(--warn);border-radius:11px;padding:11px 12px;font-size:14px;margin-block-end:8px}
.note.bad{border-inline-start-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-inline-start-color:var(--ok);background:var(--ok-soft)}
.note.warn{border-inline-start-color:var(--warn);background:var(--warn-soft)}
.note.info{border-inline-start-color:var(--info);background:var(--info-soft)}

<script>
"use strict";
var MT = (function () {

/* =========================================================
   1. BASICS
   ========================================================= */
var KEY = "moneytracker";
var BUILD = "2026-09-05.1";  /* shown in Settings so you can tell which copy you are running */
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var COLORS = ["#0f766e","#f59e0b","#5b5bd6","#d92d20","#0ea5e9","#0b8a5f","#db2777","#65a30d","#ea580c","#64748b"];
/* charts use the chosen palette; COLORS stays as a fallback before boot */

var CURRENCIES = {
  INR:{ s:"\u20b9", l:"en-IN" }, USD:{ s:"$", l:"en-US" }, EUR:{ s:"\u20ac", l:"de-DE" },
  GBP:{ s:"\u00a3", l:"en-GB" }, AED:{ s:"AED ", l:"en-AE" }, SGD:{ s:"S$", l:"en-SG" },
  AUD:{ s:"A$", l:"en-AU" }, CAD:{ s:"C$", l:"en-CA" }, JPY:{ s:"\u00a5", l:"ja-JP" }
};

var CAT_ICON = {
  Food:"🍛", Groceries:"🛒", Travel:"🚌", Fuel:"⛽", Shopping:"🛍️", Bills:"🧾", Rent:"🏠",
  Health:"💊", Education:"🎓", Fun:"🎬", Subscriptions:"🔁", Savings:"📈", "Loan/EMI":"🏦",

var DEFAULT_CATS = [
  { n:"Food", k:"out" }, { n:"Groceries", k:"out" }, { n:"Travel", k:"out" }, { n:"Fuel", k:"out" },

  { n:"Education", k:"out" }, { n:"Fun", k:"out" }, { n:"Subscriptions", k:"out" },

var db = blank();
var ui = {
  view: "home",
  month: "",
  cal: "",
  filters: null,

  setup: 0,
  setupDraft: null,
  report: null,

  auth: null,
  syncState: "",
  syncError: "",
  accId: "",
  fundId: "",
  insMonth: "",
  searchQ: "",
  revMonth: "",
  taxYear: undefined,
  reportOpen: false,
  weekBack: 0,
  countNote: "",
  tidy: null,
  catName: "",
  catMonth: "",
  foreDays: 30,
  wiCat: "",
  wiPct: 20,
  extraPay: 0,

  quickFor: "",
  quickRead: null,

  shown: {},
  syncTimer: null,

};

/* =========================================================
   2. SMALL HELPERS
   ========================================================= */
function id(p) { return (p || "x") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function n(v) { var x = parseFloat(v); return isFinite(x) ? x : 0; }
/* money is stored as whole paise/cents so totals never drift */
function toMinor(v) {
  if (v === "" || v === null || v === undefined) return 0;
  var x = typeof v === "number" ? v : parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(x) ? Math.round(x * 100) : 0;
}
function toMajor(m) { return (m || 0) / 100; }
function cur() { return CURRENCIES[db.settings.currency] || CURRENCIES.INR; }
/** Indian grouping by hand: 6,13,000 not 613,000. Used when the browser
    has no Intl, so amounts read the same everywhere. */
function groupIndian(whole) {
  var str = String(whole);
  if (str.length <= 3) return str;
  var last3 = str.slice(-3), rest = str.slice(0, -3), out = "";
  while (rest.length > 2) { out = "," + rest.slice(-2) + out; rest = rest.slice(0, -2); }
  return (rest ? rest : "") + out + "," + last3;
}
function money(m) {
  var v = Math.round(m || 0), c = cur(), abs = Math.abs(v) / 100, out = null;
  var dec = abs % 1 === 0 ? 0 : 2;
  if (typeof Intl !== "undefined" && Intl && Intl.NumberFormat) {
    try {
      out = new Intl.NumberFormat(c.l, { minimumFractionDigits: dec, maximumFractionDigits: 2 }).format(abs);
    } catch (e) { out = null; }
  }
  if (out === null) {
    var fixed = abs.toFixed(dec);
    var parts = fixed.split(".");
    out = (c.l === "en-IN" ? groupIndian(parts[0])
      : parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + (parts[1] ? "." + parts[1] : "");
  }
  return (v < 0 ? "-" : "") + c.s + out;
}
function plus(m) { var v = Math.round(m || 0); return (v > 0 ? "+" : "") + money(v); }
function p2(x) { return x < 10 ? "0" + x : "" + x; }
function isoOf(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function hm(d) { return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
function stamp() { var d = new Date(); return isoOf(d) + "T" + hm(d); }
function today() { return isoOf(new Date()); }
function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return isoOf(d); }
function dateFrom(iso) { var a = String(iso || "").split("-"); return new Date(+a[0], (+a[1] || 1) - 1, +a[2] || 1); }
function mKey(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1); }
function mOf(iso) { return String(iso || "").slice(0, 7); }
function mLabel(mk) { var a = String(mk).split("-"); return MONTHS[(+a[1] || 1) - 1] + " " + a[0]; }
function mShift(mk, d) { var a = String(mk).split("-"); return mKey(new Date(+a[0], (+a[1] || 1) - 1 + d, 1)); }
function mDays(mk) { var a = String(mk).split("-"); return new Date(+a[0], +a[1], 0).getDate(); }
function fTime(t) {
  if (!t) return "";
  var h = parseInt(String(t).slice(0, 2), 10), mm = String(t).slice(3, 5);
  if (!isFinite(h)) return "";
  return (h % 12 === 0 ? 12 : h % 12) + ":" + mm + " " + (h >= 12 ? "PM" : "AM");
}
function fDate(iso) { var d = dateFrom(iso); return MONTHS[d.getMonth()].slice(0, 3) + " " + d.getDate() + ", " + d.getFullYear(); }
function fDateLong(iso) { var d = dateFrom(iso); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function fStamp(s) { return s ? fDate(String(s).slice(0, 10)) + " at " + fTime(String(s).slice(11, 16)) : "\u2014"; }
function dayName(iso) {
  if (iso === today()) return "Today";
  if (iso === yesterday()) return "Yesterday";
  var d = dateFrom(iso);
  return DOW[(d.getDay() + 6) % 7] + ", " + fDate(iso);
}
function daysToDay(day) {
  day = parseInt(day, 10);
  if (!day || day < 1 || day > 31) return null;
  var now = new Date(), base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  var t = new Date(now.getFullYear(), now.getMonth(), Math.min(day, dim));
  if (t < base) {
    var dim2 = new Date(now.getFullYear(), now.getMonth() + 2, 0).getDate();
    t = new Date(now.getFullYear(), now.getMonth() + 1, Math.min(day, dim2));
  }
  return Math.round((t - base) / 86400000);
}
function catIcon(c) { return CAT_ICON[c] || "•"; }
function el(x) { return document.getElementById(x); }

/* =========================================================
   3. SAVE / LOAD
   ========================================================= */
var BACKUP_KEY = "moneytracker.previous";
var saveFailed = false;
function saveLocalOnly() {
  var text;
  try { text = JSON.stringify(db); } catch (e) { return false; }
  /* Keep the copy that was already good, so one bad write can never wipe you out. */
  try {
    var prev = localStorage.getItem(KEY);
    if (prev && prev !== text) localStorage.setItem(BACKUP_KEY, prev);
  } catch (e) {}
  try {
    localStorage.setItem(KEY, text);
    if (saveFailed) { saveFailed = false; paintSaveWarning(); }
    return true;
  } catch (e) {
    saveFailed = true;
    paintSaveWarning();
    toast("Couldn't save on this device \u2014 storage may be full or blocked");
    return false;
  }
}
function save() {
  var ok = saveLocalOnly();
  if (typeof markDirty === "function") markDirty();
  return ok;
}
function load() {
  var raw;
  try { raw = localStorage.getItem(KEY); } catch (e) { return; }
  if (!raw) return;
  var parsed;
  try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
  if (!parsed) {
    var back;
    try { back = localStorage.getItem(BACKUP_KEY); } catch (e2) { back = null; }
    if (back) {
      try { parsed = JSON.parse(back); } catch (e3) { parsed = null; }
      if (parsed) {
        applyLoaded(parsed);
        saveLocalOnly();
        toast("Your latest save looked damaged \u2014 restored the copy before it");
        return;
      }
    }
    toast("Saved data looked damaged and could not be read");
    return;
  }
  applyLoaded(parsed);
}
/** Take a plain data object (from storage, a backup, or GitHub) and make it live. */
function applyLoaded(parsed) {
  if (!parsed || typeof parsed !== "object") return;
  var base = blank();
  Object.keys(base).forEach(function (k) {
    if (parsed[k] !== undefined && parsed[k] !== null) base[k] = parsed[k];
  });
  base.settings = Object.assign(blank().settings, parsed.settings || {});
  base.profile = Object.assign({ name: "" }, parsed.profile || {});
  base.auth = Object.assign(blank().auth, parsed.auth || {});
  if (!Array.isArray(base.cats) || !base.cats.length) base.cats = DEFAULT_CATS.slice();
  ["accounts", "apps", "tx", "goals", "bills", "views", "statements", "pots", "funds", "emis"].forEach(function (k) {
    if (!Array.isArray(base[k])) base[k] = [];
  });
  base.tx.forEach(function (t) {
    if (!t.status) t.status = "done";
    if (!Array.isArray(t.refunds)) t.refunds = [];
    if (t.deducted === undefined) t.deducted = 0;
  });
  db = base;
  fillMissingLimits();
}

/* ---------- filling in details added after you first saved ----------
   Your entries were saved by an earlier version of this page that had no

/* =========================================================
   5. THE MONEY RULES  (one place, used by everything)

}
/** How much actually left the account for this transaction. */
function moneyOut(t) {

  if (t.status === "pending") return 0;

  return Math.round(t.amt || 0);
}

function netSpend(t) {
  if (t.type !== "out") return 0;
  if (t.status === "pending" || t.status === "failed" || t.status === "cancelled") return 0;
  return Math.max(0, Math.round(t.amt || 0) - refundTotal(t));

    var amt = Math.round(t.amt || 0);
    if (t.type === "out" && t.acc === accountId) bal -= moneyOut(t);
    else if (t.type === "in" && t.acc === accountId) bal += netIncome(t);
    else if (t.type === "move" || t.type === "bill") {
      if (t.acc === accountId) bal -= amt;
      if (t.to === accountId) bal += amt;

/* Recurring bills that the user chose to auto-add. */
function runBills(quiet) {
  var now = new Date(), made = 0;
  db.bills.forEach(function (b) {
    if (b.off || !b.auto) return;
    var day = parseInt(b.day, 10) || 1;
    var from = b.last ? dateFrom(b.last) : null;
    var cursor = from ? new Date(from.getFullYear(), from.getMonth() + 1, 1)
                      : new Date(now.getFullYear(), now.getMonth(), 1);
    var guard = 0;
    while (cursor <= now && guard < 30) {
      guard++;
      var dim = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      var due = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(day, dim));
      var dueIso = isoOf(due);
      if (due <= now && (!b.last || dueIso > b.last)) {
        db.tx.push({
          id: id("t"), type: b.type || "out", amt: Math.round(b.amt || 0),
          cat: b.cat || "Bills", acc: b.acc || (firstBank() && firstBank().id) || "",
          to: "", how: b.how || "bank", appId: "", date: dueIso, time: "09:00", noTime: false,
          note: b.name, status: "done", deducted: 0, refunds: [], billId: b.id,
          createdAt: stamp(), updatedAt: stamp()
        });
        b.last = dueIso;
        made++;
      }
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    }
  });
  if (made) { save(); if (!quiet) toast(made + " scheduled payment" + (made === 1 ? "" : "s") + " added"); }
  return made;
}

/* =========================================================
   6. THINGS WORTH TELLING THE USER
   ========================================================= */
function alerts() {
  var out = [], mk = mKey(new Date()), td = today();
  var month = txIn(mk), spent = spentByCat(mk);

  Object.keys(db.budgets).forEach(function (c) {
    var b = Math.round(db.budgets[c] || 0);
    if (b <= 0) return;
    var s = spent[c] || 0, p = (s / b) * 100;
    if (p > 100) out.push({ k:"bad", i:"🔴", t:"You've gone " + money(s - b) + " over your <b>" + esc(c) + "</b> budget." });
    else if (p >= 80) out.push({ k:"", i:"⚠️", t:"You've used " + Math.round(p) + "% of your <b>" + esc(c) + "</b> budget." });
  });

  db.tx.forEach(function (t) {
    var s = stuck(t);
    if (!s) return;
    var days = Math.round((dateFrom(td) - dateFrom(t.date)) / 86400000);
    out.push({
      k: days > 7 ? "bad" : "", i: "↩️",
      t: money(s) + " from " + esc(t.note || t.cat || "a payment") + " hasn't come back yet" +
         (days > 0 ? " (" + days + " day" + (days === 1 ? "" : "s") + " ago)" : "") + ".",
      go: t.id
    });
  });

  cardAlerts().forEach(function (x) { out.push(x); });

  upcomingBills().slice(0, 3).forEach(function (u) {
    if (u.days > 3) return;
    out.push({ k:"info", i:"📅", t:esc(u.bill.name) + " (" + money(u.bill.amt) + ") is due " +
      (u.days === 0 ? "today" : u.days === 1 ? "tomorrow" : "in " + u.days + " days") + "." });
  });

  var bt = budgetTotal(), spentAll = totalsFor(month).out;
  if (bt > 0 && spentAll < bt) out.push({ k:"ok", i:"🎯", t:money(bt - spentAll) + " left to spend this month." });

  var todaySpend = totalsFor(txOn(td)).out;
  if (todaySpend > 0) {
    var days = {};
    month.forEach(function (t) { var v = netSpend(t); if (v) days[t.date] = (days[t.date] || 0) + v; });
    var keys = Object.keys(days).filter(function (k) { return k !== td; });
    if (keys.length >= 3) {
      var avg = keys.reduce(function (s, k) { return s + days[k]; }, 0) / keys.length;
      if (avg > 0 && todaySpend > avg * 1.3) {
        out.push({ k:"", i:"📈", t:"Today is " + Math.round(((todaySpend - avg) / avg) * 100) + "% above your usual daily spending." });
      }
    }
  }
  return out;
}

    '<path d="' + area + '" fill="' + (o.colour || "var(--accent)") + '" opacity=".10"/>' +
    '<path d="' + d + '" fill="none" stroke="' + (o.colour || "var(--accent)") +
    '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + ticks + "</svg>" +
    (o.showAverage !== false
      ? '<p class="sub">The dashed line is your average, ' + money(Math.round(avg)) + ".</p>"
      : "");
}
/** Short money for an axis: 1.2k, 45k, 1.3L. */
function shortMoney(minor) {
  var v = Math.abs(Math.round(minor)) / 100;
  var c = cur().s;
  if (v >= 10000000) return c + (v / 10000000).toFixed(1) + "Cr";
  if (v >= 100000) return c + (v / 100000).toFixed(1) + "L";
  if (v >= 1000) return c + Math.round(v / 1000) + "k";
  return c + Math.round(v);
}
/** Two series side by side, for this month against last. */
function pairBars(rows, opts) {
  var o = opts || {};
  if (!rows.length) return '<p class="empty">Nothing to compare yet.</p>';
  var max = Math.max.apply(null, rows.map(function (r) {
    return Math.max(r.now, r.was);
  }).concat([1]));
  return '<div class="pairs">' + rows.map(function (r) {
    var pn = (r.now / max) * 100, pw = (r.was / max) * 100;
    var diff = r.now - r.was;
    return '<div class="pair"><div class="rowline"><span>' + esc(r.label) + "</span>" +
      '<span class="' + (diff < 0 ? "in" : diff > 0 ? "out" : "sub") + '">' +
      (diff === 0 ? "level" : plus(diff)) + "</span></div>" +
      '<div class="pairbar"><i class="now" style="inline-size:' + pn.toFixed(1) +
      '%" title="' + esc(o.nowLabel || "this month") + ": " + plainMoney(r.now) + '"></i></div>' +
      '<div class="pairbar"><i class="was" style="inline-size:' + pw.toFixed(1) +
      '%" title="' + esc(o.wasLabel || "last month") + ": " + plainMoney(r.was) + '"></i></div>' +
      '<div class="rowline sub"><span>' + money(r.now) + " now</span><span>" +
      money(r.was) + " " + esc(o.wasLabel || "before") + "</span></div></div>";
  }).join("") + "</div>";
}
/** A day-by-day strip: where in the month the money actually went. */
function dayStrip(mk) {
  var dim = mDays(mk), td = today();
  var vals = [], labels = [];
  for (var i = 1; i <= dim; i++) {
    var iso = mk + "-" + p2(i);
    vals.push(iso <= td ? spentOn(iso) : 0);
    labels.push(String(i));
  }
  var max = Math.max.apply(null, vals.concat([1]));
  var W = 680, H = 130, padB = 22, padT = 8;
  var bw = W / dim;
  var bars = vals.map(function (v, i) {
    var iso = mk + "-" + p2(i + 1);
    var future = iso > td;
    var hgt = max > 0 ? (v / max) * (H - padT - padB) : 0;
    var weekend = isWeekend(iso);
    return '<rect x="' + (i * bw + bw * 0.15).toFixed(1) + '" y="' +
      (H - padB - hgt).toFixed(1) + '" width="' + (bw * 0.7).toFixed(1) +
      '" height="' + Math.max(hgt, v > 0 ? 2 : 0).toFixed(1) + '" rx="2" fill="' +
      (future ? "var(--border)" : weekend ? scaleAt(1) : "var(--accent)") +
      '" opacity="' + (future ? ".4" : v > 0 ? ".92" : ".18") + '"><title>' +
      esc(fDate(iso)) + ": " + (future ? "not yet" : v ? money(v) : "nothing") + "</title></rect>";
  }).join("");
  var ticks = [1, 8, 15, 22, dim].map(function (d2) {
    return '<text x="' + ((d2 - 1) * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) +
      '" font-size="10" fill="var(--muted)" text-anchor="middle">' + d2 + "</text>";
  }).join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" aria-label="' +
    esc("Spending each day of " + mLabel(mk)) + '">' + bars + ticks + "</svg>" +
    '<p class="sub"><i class="key" style="background:' + scaleAt(1) +
    '"></i> weekends <i class="key" style="background:var(--accent)"></i> weekdays</p>';
}
/** Where money goes by what it is FOR, not just by category name. */
function roleChart(list) {
  var r = byRole(list);
  /* x.c, not scaleAt(i): a role that happens to be absent one month must not
     shift every other role's colour along by one */
  var rows = ROLES.filter(function (x) { return r[x.id] > 0; }).map(function (x) {
    return { label: x.icon + " " + x.label, value: r[x.id], colour: x.c };
  });
  if (!rows.length) return "";
  var total = rows.reduce(function (s, x) { return s + x.value; }, 0);
  return '<div class="stack" role="img" aria-label="' +
    esc(rows.map(function (x) { return x.label + " " + plainMoney(x.value); }).join(", ")) + '">' +
    rows.map(function (x) {
      return '<i style="inline-size:' + ((x.value / total) * 100).toFixed(2) +
        '%;background:' + x.colour + '" title="' + esc(x.label) + ": " +
        plainMoney(x.value) + '"></i>';
    }).join("") + "</div>" +
    '<div class="legend">' + rows.map(function (x) {
      return '<span><i style="background:' + x.colour + '"></i>' + esc(x.label) +
        " " + money(x.value) + " \u00b7 " + Math.round((x.value / total) * 100) + "%</span>";
    }).join("") + "</div>";
}
/** A small week-by-week bar, to show cadence inside a month. */
function weekBars(mk) {
  var dim = mDays(mk), td = today();
  var weeks = [0, 0, 0, 0, 0];
  for (var i = 1; i <= dim; i++) {
    var iso = mk + "-" + p2(i);
    if (iso > td) continue;
    weeks[Math.min(4, Math.floor((i - 1) / 7))] += spentOn(iso);
  }
  var labels = ["1\u20137", "8\u201314", "15\u201321", "22\u201328", "29+"];
  var live = weeks.map(function (v, i) { return { label: labels[i], value: v }; })
    .filter(function (x, i) { return i < 4 || x.value > 0; });
  var max = Math.max.apply(null, live.map(function (x) { return x.value; }).concat([1]));
  return '<div class="wkbars">' + live.map(function (x, i) {
    return '<div class="wk"><div class="wkcol"><i style="block-size:' +
      ((x.value / max) * 100).toFixed(1) + '%;background:' + scaleAt(i) + '" title="' +
      esc(x.label) + ": " + plainMoney(x.value) + '"></i></div>' +
      '<span class="sub">' + esc(x.label) + "</span>" +
      '<b class="sub">' + shortMoney(x.value) + "</b></div>";
  }).join("") + "</div>";
}

/* ---------- more ways to show a number ----------
   Added only where a shape answers a question the existing
   ones cannot. A chart that repeats another chart is clutter. */

/** A gauge: how far along something is against a limit. */
/** One place decides what a budget position is called, so the wording on a
    gauge, a bar and a summary line can never drift apart. */
function budgetState(pct) {
  if (pct > 100) return { id: "over",  icon: "\u26a0", words: "Over budget",       tone: "var(--bad)" };
  if (pct > 80)  return { id: "near",  icon: "\u25b3", words: "Nearing the limit", tone: "var(--warn)" };
  return           { id: "ok",    icon: "\u2713", words: "Within budget",     tone: "var(--accent)" };
}
function gauge(value, limit, label) {
  var pct = limit > 0 ? Math.min(100, (value / limit) * 100) : 0;
  var W = 200, H = 110, cx = 100, cy = 96, r = 76;
  var a = Math.PI * (1 - pct / 100);
  var x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  var real = limit > 0 ? (value / limit) * 100 : 0;
  var st = budgetState(real);
  return '<svg viewBox="0 0 ' + W + " " + H + '" class="chart" role="img" aria-label="' +
    esc((label || "Progress") + ": " + Math.round(real) + " percent of " + plainMoney(limit) +
      ". " + st.words) + '">' +
    '<path d="M24 96 A76 76 0 0 1 176 96" fill="none" stroke="var(--surface-2)" stroke-width="14" stroke-linecap="round"/>' +
    '<path d="M24 96 A76 76 0 ' + (pct > 50 ? 1 : 0) + ' 1 ' + x.toFixed(1) + " " + y.toFixed(1) +
    '" fill="none" stroke="' + st.tone + '" stroke-width="14" stroke-linecap="round"/>' +
    '<text x="100" y="78" font-size="22" font-weight="700" fill="var(--text)" text-anchor="middle">' +
    Math.round(real) + "%</text>" +
    /* the words carry the same meaning as the colour, for anyone who cannot
       tell amber from green */
    '<text x="100" y="94" font-size="10" font-weight="600" fill="var(--muted)" ' +
    'text-anchor="middle">' + esc(st.icon + " " + st.words) + "</text></svg>";
}
/** A heatmap of the month: which days cost most, laid out as a calendar. */
function heatmap(mk) {
  var dim = mDays(mk), a = mk.split("-");
  var lead = (new Date(+a[0], +a[1] - 1, 1).getDay() + 6) % 7;
  var vals = [];
  for (var i = 1; i <= dim; i++) vals.push(spentOn(mk + "-" + p2(i)));
  var max = Math.max.apply(null, vals.concat([1]));
  var cells = DOW.map(function (d) { return '<span class="hmh">' + d + "</span>"; }).join("");
  for (i = 0; i < lead; i++) cells += '<span class="hmc off"></span>';
  for (i = 1; i <= dim; i++) {
    var iso = mk + "-" + p2(i), v = vals[i - 1];
    var f = max > 0 ? v / max : 0;
    var future = iso > today();
    cells += '<span class="hmc' + (future ? " off" : "") + '" title="' +
      esc(fDate(iso) + ": " + (future ? "not yet" : v ? plainMoney(v) : "nothing")) + '"' +
      (future || !v ? "" : ' style="background:color-mix(in srgb,var(--accent) ' +
        Math.round(12 + f * 78) + '%,var(--surface-2))"') + ">" + i + "</span>";
  }
  return '<div class="heat" role="img" aria-label="' +
    esc("Spending heatmap for " + mLabel(mk)) + '">' + cells + "</div>";
}
/** A waterfall: how you got from what came in to what is left. */
function waterfall(steps) {
  if (!steps.length) return "";
  var running = 0, max = 0;
  steps.forEach(function (s) { running += s.value; max = Math.max(max, Math.abs(running)); });
  running = 0;
  return '<div class="fall">' + steps.map(function (s, i) {
    var from = running;
    running += s.value;
    var w = max > 0 ? (Math.abs(s.value) / max) * 100 : 0;
    var off = max > 0 ? (Math.min(from, running) / max) * 100 : 0;
    return '<div class="fallrow"><div class="rowline"><span>' + esc(s.label) + "</span>" +
      '<span class="' + (s.value >= 0 ? "in" : "out") + '">' + plus(s.value) + "</span></div>" +
      '<div class="fallbar"><i style="margin-inline-start:' + off.toFixed(1) +
      '%;inline-size:' + Math.max(w, 1).toFixed(1) + '%;background:' +
      (s.value >= 0 ? "var(--in)" : scaleAt(i)) + '"></i></div>' +
      '<div class="sub">running total ' + money(running) + "</div></div>";
  }).join("") + "</div>";
}
/** Small multiples: the same shape repeated, so months can be compared at a glance. */
function sparkRow(series) {
  return '<div class="sparks">' + series.map(function (s, i) {
    var max = Math.max.apply(null, s.values.concat([1]));
    var pts = s.values.map(function (v, j) {
      var x = (j / Math.max(1, s.values.length - 1)) * 60;
      var y = 22 - (v / max) * 20;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<div class="spark"><b class="sub">' + esc(s.label) + "</b>" +
      '<svg viewBox="0 0 60 24" role="img" aria-label="' + esc(s.label) + '">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + scaleAt(i) +
      '" stroke-width="2" stroke-linejoin="round"/></svg>' +
      '<span class="sub">' + shortMoney(s.values[s.values.length - 1]) + "</span></div>";
  }).join("") + "</div>";
}

function columns(values, labels, title) {
  var W = 660, H = 180, pad = 20, count = values.length || 1;
  var max = Math.max.apply(null, values.concat([1]));
  var bw = (W - pad * 2) / count;
  var bars = values.map(function (v, i) {
    var h = max > 0 ? (v / max) * (H - pad * 2) : 0;
    return '<rect x="' + (pad + i * bw + bw * 0.18).toFixed(1) + '" y="' + (H - pad - h).toFixed(1) +
      '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(h, v > 0 ? 2 : 0).toFixed(1) +
      '" rx="2" fill="var(--accent)" opacity="' + (v > 0 ? 0.9 : 0.25) + '"><title>' +
      esc(labels[i] || "") + ": " + money(v) + "</title></rect>";
  }).join("");
  var ticks = labels.map(function (l, i) {
    if (count > 15 && i % 3 !== 0) return "";
    return '<text x="' + (pad + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 5) +
      '" font-size="9" fill="var(--muted)" text-anchor="middle">' + esc(l) + "</text>";
  }).join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(title || "Chart") + '">' +
    '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="var(--border)"/>' +
    bars + ticks + "</svg>";
}
function donut(items) {
  var total = items.reduce(function (s, i) { return s + i.value; }, 0);
  if (!items.length || total <= 0) return '<p class="empty">Nothing here yet.</p>';
  var C = 2 * Math.PI * 42, off = 0;
  var arcs = items.map(function (it, i) {
    var len = (it.value / total) * C;
    var s = '<circle cx="60" cy="60" r="42" fill="none" stroke="' + scaleAt(i) +
      '" stroke-width="16" stroke-dasharray="' + len.toFixed(2) + " " + (C - len).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' +
      esc(it.label) + ": " + money(it.value) + "</title></circle>";
    off += len;
    return s;
  }).join("");
  return '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
    '<svg viewBox="0 0 120 120" style="inline-size:118px;flex:0 0 auto" role="img" aria-label="Share by payment method">' +
    arcs + "</svg><div class=\"legend\" style=\"flex:1;min-inline-size:150px\">" +
    items.map(function (it, i) {
      return "<span><i style=\"background:" + scaleAt(i) + "\"></i>" + esc(it.label) + " " + money(it.value) + "</span>";
    }).join("") + "</div></div>";
}

function newDraft(type, date) {

  };
}
function draftOf(t) {
  return {
    editing: t.id, type: t.type, amt: String(toMajor(t.amt)), cat: t.cat || "",
    how: t.how || "", appId: t.appId || "", acc: t.acc || "", to: t.to || "",

    more: true, createdAt: t.createdAt || "", status: t.status || "done",

  };

/** Which account the money comes from, given the simple answers so far. */
function draftAccount(d) {
  if (d.acc) return d.acc;
  if (d.how === "cash") { var c = cashAcc(); return c ? c.id : ""; }
  if (d.how === "card") { var k = liveAccounts("card")[0]; return k ? k.id : ""; }
  if (d.how === "app") {
    var a = app(d.appId);
    if (!a) return "";
    var counts = {};
    db.tx.forEach(function (t) { if (t.appId === a.id && t.acc) counts[t.acc] = (counts[t.acc] || 0) + 1; });
    var best = "", bestN = -1;
    (a.src || []).forEach(function (x) { if ((counts[x] || 0) > bestN) { bestN = counts[x] || 0; best = x; } });
    return best || a.def || (a.src || [])[0] || "";
  }
  var b = firstBank();
  return b ? b.id : "";
}
function draftReady(d) {
  if (toMinor(d.amt) <= 0) return false;
  if (d.date > today()) return false;
  if (d.type === "move" || d.type === "bill") return !!(d.acc && d.to && d.acc !== d.to);
  if (!d.cat) return false;
  if (d.type === "in") return !!draftAccount(d);
  if (!d.how) return false;
  if (d.how === "app" && !d.appId) return false;
  return !!draftAccount(d);
}
function grabFields() {

function findTwin(d, amt) {

  return db.tx.filter(function (t) {
    if (t.id === d.editing) return false;
    if (t.type !== d.type || Math.round(t.amt) !== amt || t.date !== d.date) return false;
    if ((t.cat || "") !== (d.cat || "")) return false;
    if ((t.acc || "") !== (accId || "")) return false;
    if ((t.appId || "") !== (d.appId || "")) return false;
    if (mins !== null && t.time && !t.noTime && !d.noTime) {
      var m2 = parseInt(t.time.slice(0, 2), 10) * 60 + parseInt(t.time.slice(3, 5), 10);

function render() {

  var fn = {
    home: pageHome, history: pageHistory, stats: pageStats, more: pageMore,

    reports: pageReports, settings: pageSettings,
    card: pageCard, cycle: pageCycle, stmt: pageStatement,

    shared: pageShared, saved: pageSaved, cardplan: pageCardPlan, perks: pagePerks
  }[ui.view] || pageHome;
  /* A page that throws must never blank the whole app. It shows what went
     wrong, keeps the navigation alive, and offers a way out with the data
     untouched — losing a screen is recoverable, losing your entries is not. */
  try {
    el("app").innerHTML = fn();
  } catch (err) {
    el("app").innerHTML = crashPage(err, ui.view);
    try { logChange("error", ui.view + ": " + (err && err.message)); saveLocalOnly(); }
    catch (e2) {}
  }
  /* Only jump to the top when you have actually moved to a different page.
     Toggling an eye or opening a section must leave you where you were. */
  var movedPage = ui.view !== ui.lastView;
  ui.lastView = ui.view;
  if (movedPage && !ui.keepScroll && window.scrollTo) window.scrollTo(0, 0);
  ui.keepScroll = false;
}

  ui.keepScroll = true;

}
/** Shown when a screen fails to draw. Your data is not touched. */

function sipAlertCard(a) {

      '<span class="n">' + money(a.amt) + " " + sipCloseBtn(a) + "</span></div>" +

}

/** After "just add it all": walk through what looked like a repeat. */
function tidySheet() {
  var t = ui.tidy;
  if (!t) return "";
  var pending = t.items.filter(function (x) { return !x.done; });
  var h = '<div class="shd"><h2>Added \u2014 now let us tidy up</h2>' +
    '<button type="button" class="ib grow" data-act="closeSheet" aria-label="Close">\u2715</button></div>';

    " entr" + (t.added === 1 ? "y is" : "ies are") + " saved.</b>" +
    (t.dropped ? "<br>" + t.dropped + " line" + (t.dropped === 1 ? " was" : "s were") +
      " an exact repeat of something already recorded \u2014 same day, same amount, same time, " +
      "same account \u2014 so " + (t.dropped === 1 ? "it was" : "they were") +
      " left out rather than saved twice." : "") + "</div></div>";

  if (!pending.length) {
    h += '<div class="note ok"><span aria-hidden="true">\u2713</span><div>' +
      (t.items.length
        ? "That is everything \u2014 all " + t.items.length + " checked."
        : "Nothing else looked like a repeat.") + "</div></div>" +
      '<button type="button" class="btn full" data-act="tidyDone">Done</button>';
    return h;
  }

  var x = pending[0], seen = tx(x.savedId), made = tx(x.newId);
  if (!seen || !made) {
    /* one of the two is gone \u2014 nothing left to compare */
    x.done = true;
    return tidySheet();
  }
  var left = t.items.length - pending.length + 1;
  h += '<p class="sub">' + left + " of " + t.items.length + "</p>";
  h += '<div class="note warn"><span aria-hidden="true">!</span><div>' +
    "<b>These two look like the same payment.</b><br>" + esc(dupWords(x.kind)) +
    ". Two chai on one day really are two entries, so this is your call.</div></div>";

  var row = function (label, a, b) {
    var same = String(a || "") === String(b || "");
    return "<tr><td>" + label + "</td><td>" +
      (a ? esc(a) : '<span class="muted">not known</span>') + "</td>" +
      "<td" + (same ? "" : ' class="warnc"') + ">" +
      (b ? esc(b) : '<span class="muted">not known</span>') + "</td></tr>";
  };
  h += '<div class="card"><table><tr><th></th><th>Was already there</th>' +
    "<th>Just added</th></tr>" +
    row("Date", fDate(seen.date), fDate(made.date)) +

    row("Time", seen.time ? fTime(seen.time) : "", made.time ? fTime(made.time) : "") +
    row("Account", seen.acc ? accName(seen.acc) : "", made.acc ? accName(made.acc) : "") +
    row("Category", seen.cat || "", made.cat || "") +

  h += '<div class="btns" style="flex-direction:column;align-items:stretch;margin-block-start:10px">' +
    '<button type="button" class="btn" data-act="tidyMerge">Same one \u2014 join them and remove the copy</button>' +
    '<button type="button" class="btn g" data-act="tidyKeep">Two different payments \u2014 keep both</button>' +
    "</div>" +
    '<p class="hint">Joining keeps the older entry and fills in any blank it had from the ' +
    "newer line, then removes the duplicate. Keeping both changes nothing.</p>";
  return h;
}

/* ---------- History ---------- */
function blankFilters() {
  return { q:"", from:"", to:"", type:"", cat:"", acc:"", how:"", status:"", min:"", max:"", sort:"new", gaps:"" };
}
function filtered() {
  var f = ui.filters || blankFilters();
  var q = f.q.trim().toLowerCase();
  var out = db.tx.filter(function (t) {
    if (f.type && t.type !== f.type) return false;
    if (f.gaps === "1" && !txMissing(t).length) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.acc && t.acc !== f.acc && t.to !== f.acc) return false;
    if (f.how && t.how !== f.how) return false;
    if (f.status === "stuck") { if (!stuck(t)) return false; }
    else if (f.status === "back") { if (!refundTotal(t)) return false; }
    else if (f.status && effectiveStatus(t) !== f.status) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.min !== "" && Math.round(t.amt) < toMinor(f.min)) return false;
    if (f.max !== "" && Math.round(t.amt) > toMinor(f.max)) return false;
    if (q) {
      var hay = [t.note, t.merchant, t.cat, howLabel(t.how), appName(t.appId),
        accName(t.acc), accName(t.to), toMajor(t.amt), fDate(t.date), dayName(t.date),
        t.channel ? channelLabel(t.channel) : ""]
        .filter(Boolean).join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) {
        /* let a bare number find an amount, so "450" finds \u20b9450.00 */
        var justNum = q.replace(/[^0-9.]/g, "");
        if (!justNum || String(toMajor(t.amt)).indexOf(justNum) === -1) return false;
      }
    }
    return true;
  });
  if (f.sort === "old") out.sort(function (a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); });
  else if (f.sort === "high") out.sort(function (a, b) { return b.amt - a.amt; });
  else if (f.sort === "low") out.sort(function (a, b) { return a.amt - b.amt; });
  else out = sortTx(out);
  return out;
}

/* ---------- Stats ---------- */
function pageStats() {

  var spendDays = daily.filter(function (v) { return v > 0; });

  h += '<div class="sec"><h2>What you spent on</h2><div class="card">' + barList(catData, t.out) + "</div></div>";

  h += '<div class="sec"><h2>The numbers</h2><div class="card"><table>' +
    row2("Typical spending day", money(avg)) +
    row2("Biggest single day", max > 0 ? money(max) : "\u2014") +
    row2("Biggest category", catData.length ? catData[0].label + " · " + money(catData[0].value) : "\u2014") +
    row2("Entries this month", String(list.length)) +

  h += '<div class="sec"><h2>Compared with ' + esc(mLabel(prevKey).split(" ")[0]) + "</h2><div class=\"card\"><table>" +

  h += '<div class="sec"><div class="rowline">' +
    '<button type="button" class="btn g s" data-act="calBack" aria-label="Previous month">‹</button>' +
    "<h2>" + esc(mLabel(ui.cal)) + " calendar</h2>" +
    '<button type="button" class="btn g s" data-act="calNext" aria-label="Next month">›</button></div>' +
    '<div class="card">' + calendar(ui.cal) + "</div></div>";
  h += patternBlock();
  return h;
}
function row2(k, v) { return "<tr><th>" + esc(k) + '</th><td class="n"><b>' + esc(v) + "</b></td></tr>"; }
function cmp(label, before, after, upIsGood) {
  var text, klass = "";
  if (!before) text = after ? "no comparison (nothing last month)" : "no change";
  else {
    var d = ((after - before) / before) * 100;
    var up = d > 0.5, down = d < -0.5;
    var arrow = up ? "▲" : down ? "▼" : "▬";
    klass = (!up && !down) ? "" : (up === !!upIsGood ? "in" : "out");
    text = arrow + " " + Math.abs(Math.round(d)) + "%";
  }
  return "<tr><th>" + esc(label) + '</th><td class="n">' + money(before) + " → " + money(after) +
    ' <span class="' + klass + '">' + esc(text) + "</span></td></tr>";
}
/* =========================================================
   MARKED DAYS
   ---------------------------------------------------------
   Days you tell the app matter. A marker never moves money;
   it changes what the app expects, and therefore what it
   tells you. Paydays are marked for you; you can move any
   single month without touching the others.
   ========================================================= */
var MARK_KINDS = [
  { id:"pay",      label:"Pay day",        icon:"\ud83d\udcb0", tone:"in",
    hint:"money arriving" },
  { id:"emiend",   label:"Last EMI",       icon:"\ud83c\udf89", tone:"in",
    hint:"the final instalment \u2014 after this the money is yours again" },
  { id:"emistart", label:"EMI starts",     icon:"\ud83d\udcc5", tone:"out",
    hint:"a new instalment begins" },
  { id:"big",      label:"Big payment",    icon:"\u26a0\ufe0f", tone:"out",
    hint:"something large you know is coming" },
  { id:"bill",     label:"Bill due",       icon:"\ud83e\uddfe", tone:"out",
    hint:"a payment you must make" },
  { id:"note",     label:"Just a note",    icon:"\ud83d\udccc", tone:"",
    hint:"a day worth remembering" }
];
function markKind(id) {
  for (var i = 0; i < MARK_KINDS.length; i++) if (MARK_KINDS[i].id === id) return MARK_KINDS[i];
  return MARK_KINDS[MARK_KINDS.length - 1];
}
function marks() {
  if (!Array.isArray(db.marks)) db.marks = [];

}
function addMark(o) {
  var m = {
    id: id("mk"), date: String(o.date || ""), kind: o.kind || "note",
    label: String(o.label || "").slice(0, 60), amt: Math.round(o.amt || 0),
    accId: o.accId || "", every: !!o.every, createdAt: stamp()
  };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(m.date)) return null;
  marks().push(m);

}
function editMark(mid, o) {
  var m = marks().filter(function (x) { return x.id === mid; })[0];
  if (!m) return null;
  if (o.date !== undefined && /^\d{4}-\d{2}-\d{2}$/.test(o.date)) m.date = o.date;
  if (o.kind !== undefined) m.kind = o.kind;
  if (o.label !== undefined) m.label = String(o.label).slice(0, 60);
  if (o.amt !== undefined) m.amt = Math.round(o.amt || 0);
  if (o.accId !== undefined) m.accId = o.accId;

function removeMark(mid) {

}
/** Paydays you have moved for a particular month. */
function payOverrides() {
  if (!db.payMoved || typeof db.payMoved !== "object") db.payMoved = {};
  return db.payMoved;
}
/** The payday for one month: your override if you set one, else the calculated day. */
function paydayFor(mk) {
  if (!paySet()) return "";
  var over = payOverrides()[mk];
  if (over) return over;
  var a = String(mk).split("-");
  var y = +a[0], m = +a[1] - 1;
  var c = payCfg();
  if (c.mode === "lastworking") return lastWorkingDay(y, m);
  var dim = new Date(y, m + 1, 0).getDate();
  return isoOf(new Date(y, m, Math.min(c.day, dim)));
}
function movePayday(mk, iso) {
  if (!iso) { delete payOverrides()[mk]; save(); return true; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  if (mOf(iso) !== mk) return false;   /* a month's payday must stay in that month */
  payOverrides()[mk] = iso;
  save();
  return true;
}
function paydayMoved(mk) { return !!payOverrides()[mk]; }

/** Everything marked on one day: your markers, plus the payday the app works out. */
function marksOn(iso) {
  var out = marks().filter(function (m) { return m.date === iso; }).map(function (m) {
    return { id: m.id, kind: m.kind, label: m.label, amt: m.amt, own: true,
             accId: m.accId, moved: false };
  });
  var mk = mOf(iso);
  if (paySet() && paydayFor(mk) === iso) {
    /* not added twice if you also marked it yourself */
    if (!out.some(function (x) { return x.kind === "pay"; })) {
      out.push({ id: "pay:" + mk, kind: "pay", label: "Pay expected",
                 amt: payCfg().amount, own: false, moved: paydayMoved(mk) });
    }
  }
  return out;
}
function marksBetween(from, to) {
  var out = marks().filter(function (m) { return m.date >= from && m.date <= to; })
    .map(function (m) { return { date: m.date, kind: m.kind, label: m.label,
                                 amt: m.amt, own: true, id: m.id }; });
  if (paySet()) {
    var d = dateFrom(from), guard = 0;
    var seen = {};
    while (isoOf(d) <= to && guard++ < 400) {
      var mk = mKey(d);
      if (!seen[mk]) {
        seen[mk] = 1;
        var pd = paydayFor(mk);
        if (pd >= from && pd <= to && !out.some(function (x) {
              return x.date === pd && x.kind === "pay"; })) {
          out.push({ date: pd, kind: "pay", label: "Pay expected",
                     amt: payCfg().amount, own: false, id: "pay:" + mk });
        }
      }
      d.setDate(d.getDate() + 1);
    }
  }
  return out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}

/* ---------- what a "last EMI" marker means ---------- */
/** The instalment a marker refers to, and what it costs each month. */
function emiForMark(m) {
  if (m.accId) {
    var byCard = emis().filter(function (e) { return e.cardId === m.accId; })[0];
    if (byCard) return byCard;
  }
  if (m.amt > 0) return { perMonth: m.amt, cardId: m.accId || "", fromMark: true };
  var all = emis();
  return all.length === 1 ? all[0] : null;
}
/** Instalments that have finished, or are about to. Only what you marked. */
function emiEndings(ref) {
  var now = ref || today();
  return marks().filter(function (m) { return m.kind === "emiend"; }).map(function (m) {
    var e = emiForMark(m);
    var per = e ? Math.round(e.perMonth || 0) : Math.round(m.amt || 0);
    var days = Math.round((dateFrom(m.date) - dateFrom(now)) / 86400000);
    var nextMonth = mShift(mOf(m.date), 1);
    return {
      mark: m, date: m.date, per: per, days: days,
      done: m.date <= now,
      freesFrom: nextMonth,
      knowsAmount: per > 0,
      what: m.label || (e && e.cardId && acc(e.cardId) ? acc(e.cardId).name + " instalment" : "an instalment")
    };
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
/** Money that has genuinely been freed up, and money about to be. */
function freedMoney(ref) {
  var now = ref || today();
  var list = emiEndings(now);
  var done = list.filter(function (x) { return x.done && x.knowsAmount; });
  var soon = list.filter(function (x) { return !x.done && x.knowsAmount; });
  return {
    freed: done.reduce(function (s, x) { return s + x.per; }, 0),
    coming: soon.reduce(function (s, x) { return s + x.per; }, 0),
    done: done, soon: soon,
    unknown: list.filter(function (x) { return !x.knowsAmount; })
  };
}

function calendar(mk) {
  var dim = mDays(mk), a = mk.split("-");
  var lead = (new Date(+a[0], +a[1] - 1, 1).getDay() + 6) % 7;
  var vals = [], i;
  for (i = 1; i <= dim; i++) vals.push(totalsFor(txOn(mk + "-" + p2(i))).spend);

  for (i = 0; i < lead; i++) cells += '<span class="cd no"></span>';

    var shade = v > 0 ? Math.round((0.15 + (v / max) * 0.6) * 100) : 0;
    var dayMarks = marksOn(iso);

    var say = [fDate(iso), v > 0 ? money(v) + " spent" : "nothing spent"];
    if (weekend) say.push("weekend");

    (legend.length

          return k.icon + " " + esc(k.label);

    '<div class="btns" style="margin-block-start:8px">' +
    '<button type="button" class="btn g s" data-act="newMark" data-d="' + esc(mk + "-" + p2(Math.min(new Date().getDate(), dim))) +
    '">Mark a day</button>' +
    (paySet()
      ? '<button type="button" class="btn g s" data-act="movePay" data-mk="' + esc(mk) +
        '">Move this month\u2019s payday</button>'

  { id:"all",       label:"All time" },
  { id:"custom",    label:"Pick my own dates" }
];
var MODES = [
  { id:"net",   label:"Net spending", hint:"What things really cost you after refunds. Transfers and card bill payments are not spending." },
  { id:"cash",  label:"Cash flow",    hint:"Money as it actually left or entered your accounts on the day it moved, including transfers and card bill payments." }
];

function weekStart(d) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function rangeDates(r) {
  var now = new Date(), td = today();
  switch (r.id) {
    case "today":     return { from: td, to: td };
    case "yesterday": return { from: yesterday(), to: yesterday() };
    case "7":  { var a = new Date(); a.setDate(a.getDate() - 6);  return { from: isoOf(a), to: td }; }
    case "30": { var b = new Date(); b.setDate(b.getDate() - 29); return { from: isoOf(b), to: td }; }
    case "thisweek": return { from: isoOf(weekStart(now)), to: td };
    case "lastweek": {
      var ws = weekStart(now); ws.setDate(ws.getDate() - 7);
      var we = new Date(ws); we.setDate(we.getDate() + 6);
      return { from: isoOf(ws), to: isoOf(we) };
    }
    case "thismonth": return { from: mKey(now) + "-01", to: td };
    case "lastmonth": {
      var lk = mShift(mKey(now), -1);
      return { from: lk + "-01", to: lk + "-" + p2(mDays(lk)) };
    }
    case "thisq": {
      var qs = Math.floor(now.getMonth() / 3) * 3;
      return { from: now.getFullYear() + "-" + p2(qs + 1) + "-01", to: td };
    }
    case "lastq": {
      var q = Math.floor(now.getMonth() / 3) - 1, y = now.getFullYear();
      if (q < 0) { q = 3; y -= 1; }
      var sm = q * 3 + 1, em = sm + 2;
      var ek = y + "-" + p2(em);
      return { from: y + "-" + p2(sm) + "-01", to: ek + "-" + p2(mDays(ek)) };
    }
    case "thisyear": return { from: now.getFullYear() + "-01-01", to: td };
    case "lastyear": {
      var ly = now.getFullYear() - 1;
      return { from: ly + "-01-01", to: ly + "-12-31" };
    }
    case "custom": return { from: r.from || td, to: r.to || td };
    default: {
      var all = db.tx.map(function (x) { return x.date; }).sort();
      return { from: all[0] || td, to: all[all.length - 1] || td };
    }
  }
}
function rangeName(r) {
  var found = RANGES.filter(function (x) { return x.id === r.id; })[0];
  var d = rangeDates(r);
  if (r.id === "custom" || r.id === "all") return fDateLong(d.from) + " to " + fDateLong(d.to);
  return (found ? found.label : "Period") + " (" + fDateLong(d.from) + " to " + fDateLong(d.to) + ")";
}
function rangeError(r) {
  if (r.id !== "custom") return "";
  if (!r.from) return "Choose a start date.";
  if (!r.to) return "Choose an end date.";
  if (r.from > r.to) return "The start date is after the end date. Please correct one of them.";
  return "";
}

function blankReportFilters() {
  return { cat:"", app:"", acc:"", how:"", status:"", type:"", min:"", max:"", q:"", moves:"1" };
}
function defaultReport() {
  return { id:"thismonth", from:"", to:"", mode:"net", f: blankReportFilters() };
}
/** Human description of each active filter, so it can be shown as a removable chip. */
function activeFilterChips() {
  var f = ui.report.f, out = [];
  if (f.type) out.push({ k:"type", label:"Type: " + ({ out:"Spent", in:"Received", move:"Moved", bill:"Card bill" }[f.type] || f.type) });
  if (f.cat) out.push({ k:"cat", label:"Category: " + f.cat });

    cancelled:"Cancelled", refunded:"Money came back", stuck:"Not returned yet", partial:"Partly refunded" }[f.status] || f.status) });
  if (f.min !== "") out.push({ k:"min", label:"At least " + money(toMinor(f.min)) });

function refundState(t) {
  var back = refundTotal(t);
  if (!back) return "none";
  var basis = (t.status === "failed" || t.status === "cancelled") ? Math.round(t.deducted || 0) : Math.round(t.amt || 0);
  return back >= basis ? "full" : "partial";
}
/** The single source of truth for which rows a report covers. */
function reportMatches() {
  var r = ui.report, d = rangeDates(r), f = r.f;
  var q = String(f.q || "").trim().toLowerCase();
  return db.tx.filter(function (t) {
    if (t.date < d.from || t.date > d.to) return false;
    if (f.moves !== "1" && (t.type === "move" || t.type === "bill")) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.how && t.how !== f.how) return false;
    if (f.app && t.appId !== f.app) return false;
    if (f.acc && t.acc !== f.acc && t.to !== f.acc) return false;
    if (f.status === "stuck") { if (!stuck(t)) return false; }
    else if (f.status === "partial") { if (refundState(t) !== "partial") return false; }
    else if (f.status && effectiveStatus(t) !== f.status) return false;
    if (f.min !== "" && Math.round(t.amt) < toMinor(f.min)) return false;
    if (f.max !== "" && Math.round(t.amt) > toMinor(f.max)) return false;
    if (q) {
      var hay = [t.note, t.cat, howLabel(t.how), appName(t.appId), accName(t.acc), accName(t.to), toMajor(t.amt)]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}
function spendBy(list, keyFn) {
  var m = {};
  list.forEach(function (t) {
    var v = netSpend(t); if (!v) return;
    var k = keyFn(t); if (!k) return;
    m[k] = (m[k] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
function incomeBy(list, keyFn) {
  var m = {};
  list.forEach(function (t) {
    var v = netIncome(t); if (!v) return;
    var k = keyFn(t); if (!k) return;
    m[k] = (m[k] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
/** Cash-flow view: money on the day it actually moved, refunds on their own date. */
function cashFlow(list, from, to) {
  var out = 0, into = 0, moved = 0, bills = 0, refundIn = 0;
  list.forEach(function (t) {
    if (t.type === "out") out += moneyOut(t);
    else if (t.type === "in") into += netIncome(t);
    else if (t.type === "bill") bills += Math.round(t.amt || 0);
    else if (t.type === "move") moved += Math.round(t.amt || 0);
  });
  /* refunds land on their own date, which may sit outside the parent's date */
  db.tx.forEach(function (t) {
    (t.refunds || []).forEach(function (rf) {
      if (rf.date >= from && rf.date <= to) refundIn += Math.round(rf.amt || 0);
    });
  });
  return { out: out, in: into, moved: moved, bills: bills, refundIn: refundIn,
           net: into + refundIn - out - bills };
}
function reportData() {
  if (!ui.report) ui.report = defaultReport();
  var r = ui.report, d = rangeDates(r);
  var list = reportMatches();
  var t = totalsFor(list);
  var flow = cashFlow(list, d.from, d.to);
  var days = Math.max(1, Math.round((dateFrom(d.to) - dateFrom(d.from)) / 86400000) + 1);
  var perDay = {};
  list.forEach(function (x) { var v = netSpend(x); if (v) perDay[x.date] = (perDay[x.date] || 0) + v; });
  var keys = Object.keys(perDay).sort(function (a, b) { return perDay[b] - perDay[a]; });
  var spends = list.filter(function (x) { return netSpend(x) > 0; });
  var kept = 0;
  list.forEach(function (x) {
    if (x.type !== "out") return;
    var back = refundTotal(x);
    if (back > 0 && x.status === "done") kept += Math.max(0, Math.round(x.amt) - back);
  });
  var pending = 0;
  list.forEach(function (x) { pending += stuck(x); });
  var week = 0, weekend = 0;
  list.forEach(function (x) {
    var v = netSpend(x); if (!v) return;
    var g = dateFrom(x.date).getDay();
    if (g === 0 || g === 6) weekend += v; else week += v;
  });
  return {
    r: r, from: d.from, to: d.to, days: days, list: list, totals: t, flow: flow,
    name: rangeName(r), error: rangeError(r),
    cats: spendBy(list, function (x) { return x.cat; }),
    accs: spendBy(list, function (x) { return accName(x.acc); }),
    hows: spendBy(list, function (x) { return x.how === "app" ? (appName(x.appId) || "Payment app") : (howLabel(x.how) || "Other"); }),
    apps: spendBy(list, function (x) { return x.how === "app" ? (appName(x.appId) || "Payment app") : ""; }),
    cards: spendBy(list, function (x) { var a = acc(x.acc); return (a && a.kind === "card") ? a.name : ""; }),
    incomeCat: incomeBy(list, function (x) { return x.cat; }),
    incomeAcc: incomeBy(list, function (x) { return accName(x.acc); }),
    busiest: keys[0] || "", busiestAmt: perDay[keys[0]] || 0,
    perDayAvg: t.out / days,
    avgSpend: spends.length ? spends.reduce(function (s, x) { return s + netSpend(x); }, 0) / spends.length : 0,
    count: list.length, retained: kept, pendingBack: pending,
    week: week, weekend: weekend
  };
}

  var out = [], cur = mOf(from), end = mOf(to), guard = 0;
  while (cur <= end && guard < 400) { out.push(cur); cur = mShift(cur, 1); guard++; }
  return out;
}

    '<div class="f"><label for="repStyle">How should refunds appear?</label><select id="repStyle" data-rep="style">' +

      '<button type="button" class="btn g s" data-act="repRange" data-r="all">Use all time</button></div></div>';

  if (r.mode === "cash") {
    h += '<div class="sec"><h2>Cash flow</h2><div class="grid">' +
      '<div class="card"><span class="lbl">Money in</span><p class="mid in">' + money(R.flow.in) + "</p></div>" +
      '<div class="card"><span class="lbl">Money out</span><p class="mid out">' + money(R.flow.out) + "</p></div>" +
      '<div class="card"><span class="lbl">Refunds received</span><p class="mid in">' + money(R.flow.refundIn) + "</p></div>" +
      '<div class="card"><span class="lbl">Card bills paid</span><p class="mid">' + money(R.flow.bills) + "</p>" +
        '<p class="sub">not counted as spending</p></div>' +
      '<div class="card"><span class="lbl">Moved between accounts</span><p class="mid move">' + money(R.flow.moved) + "</p></div>" +
      '<div class="card"><span class="lbl">Net change</span><p class="mid ' + (R.flow.net >= 0 ? "in" : "out") + '">' +

  } else {
    h += '<div class="sec"><h2>The headlines</h2><div class="grid">' +
      '<div class="card"><span class="lbl">Money in</span><p class="mid in">' + money(R.totals.in) + "</p></div>" +
      '<div class="card"><span class="lbl">Money out</span><p class="mid out">' + money(R.totals.out) + "</p>" +
      (R.totals.saved > 0 ? '<p class="sub">' + money(R.totals.spend) + " spent, " +

        (R.totals.back ? '<p class="sub">after ' + money(R.totals.back) + " of refunds</p>" : "") + "</div>" +
      '<div class="card"><span class="lbl">' + (R.totals.net >= 0 ? "Kept" : "Short by") + '</span><p class="mid ' +
        (R.totals.net >= 0 ? "in" : "out") + '">' + plus(R.totals.net) + "</p>" +

  /* plain-words highlights */
  var topCat = R.cats[0], topAcc = R.accs[0], topHow = R.hows[0];

  if (R.busiest) h += '<div class="note info"><span aria-hidden="true">📅</span><div>Your biggest day was <b>' +

  /* over time */
  var months = monthsBetween(R.from, R.to);

  } else {

      daily.push(totalsFor(R.list.filter(function (t) { return t.date === cursor; })).out);

  /* the numbers */
  h += '<div class="sec"><h2>The numbers</h2><div class="card"><table>' +
    row2("Period", R.name) +
    row2("Entries counted", String(R.count)) +
    row2("Money in", money(R.totals.in)) +
    row2("Real spending", money(R.totals.out)) +
    row2(R.totals.net >= 0 ? "Kept" : "Overspent by", money(Math.abs(R.totals.net))) +
    row2("Average per day", money(R.perDayAvg)) +
    row2("Average per purchase", money(R.avgSpend)) +
    row2("Biggest single day", R.busiest ? money(R.busiestAmt) + " on " + fDate(R.busiest) : "—") +
    row2("Biggest category", topCat ? topCat.label + " · " + money(topCat.value) : "—") +

    row2("Refunds received", money(R.totals.back)) +
    row2("Charges kept by sellers", money(R.retained)) +

  /* reconciliation for anything with a refund */
  var withRefunds = R.list.filter(function (t) { return refundTotal(t) > 0 || stuck(t) > 0; });
  if (withRefunds.length) {
    h += '<div class="sec"><h2>Refunds and payment issues</h2><div class="card"><table>' +
      '<tr><th scope="col">Payment</th><th scope="col" class="n">Originally paid</th>' +
      '<th scope="col" class="n">Came back</th><th scope="col" class="n">Kept / waiting</th>' +
      '<th scope="col" class="n">Really cost</th></tr>' +
      withRefunds.map(function (t) {
        var back = refundTotal(t), st = STATUS[effectiveStatus(t)] || STATUS.done;

          '</td><td class="n"><b>' + money(netSpend(t)) + "</b></td></tr>";

  /* biggest */
  var biggest = R.list.filter(function (t) { return netSpend(t) > 0; })

  if (biggest.length) {

  }
  return h;
