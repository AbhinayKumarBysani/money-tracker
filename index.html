<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<title>Money Tracker</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#eef1f5; --border:#e0e4ea;
  --text:#14181d; --muted:#69707c; --accent:#0f766e; --accent-soft:#d8f0ec;
  --in:#0b8a5f; --out:#d92d20; --move:#5b5bd6; --warn:#b45309;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 22px rgba(16,24,40,.06);
  --r:14px; --r2:10px;
}
[data-theme="dark"]{
  --bg:#0d1015; --surface:#161a21; --surface-2:#1d222b; --border:#2a313c;
  --text:#e9ecf1; --muted:#9aa3b2; --accent:#2dd4bf; --accent-soft:#14312f;
  --in:#34d399; --out:#f87171; --move:#a5a5f5; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1015; --surface:#161a21; --surface-2:#1d222b; --border:#2a313c;
  --text:#e9ecf1; --muted:#9aa3b2; --accent:#2dd4bf; --accent-soft:#14312f;
  --in:#34d399; --out:#f87171; --move:#a5a5f5; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;padding-block-end:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit;max-inline-size:100%}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-inline-size:960px;margin-inline:auto;padding-inline:14px}
.hidden{display:none!important}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;inset-block-start:0;z-index:30;background:var(--surface);border-block-end:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:8px;min-block-size:56px}
.brand{font-weight:750;font-size:17px}
.grow{margin-inline-start:auto}
.ib{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  min-inline-size:40px;min-block-size:40px;padding:0 10px;font-size:15px}
.ib:hover{border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-block-end:12px}
.card h3{margin-block-end:8px}
.lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.big{font-size:26px;font-weight:750;letter-spacing:-.02em}
.mid{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .move{color:var(--move)} .warnc{color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sec{margin-block:16px}
.sec>h2{margin-block-end:10px}
.rowline{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hero{background:linear-gradient(135deg,var(--accent),#0e7490);color:#fff;border:0}
.hero .lbl,.hero .sub{color:rgba(255,255,255,.88)}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#0c5c56,#0b4a5c)}

label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-block-end:4px}
input,select,textarea{inline-size:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r2);padding:12px;outline:none;min-block-size:44px}
input[type=checkbox]{inline-size:20px;block-size:20px;min-block-size:20px;margin-inline-end:8px}
.f{margin-block-end:12px}
.two{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--r2);padding:13px 18px;
  font-weight:650;min-block-size:46px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.g{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.d{background:var(--out);color:#fff}
.btn.s{padding:8px 12px;font-size:14px;min-block-size:38px;border-radius:9px}
.btn.full{inline-size:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:11px 6px;font-weight:650;color:var(--muted);min-block-size:44px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 13px;
  font-size:14.5px;font-weight:600;text-align:start;line-height:1.25;min-block-size:44px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-block-start:1px}
.chip[aria-pressed=true] small{color:inherit;opacity:.85}
.chip.new{border-style:dashed;color:var(--muted)}
.amtbox{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:2px 14px}
.amtbox span{font-size:24px;font-weight:700;color:var(--muted)}
.amtbox input{font-size:30px;font-weight:750;border:0;background:none;padding:10px 0;min-block-size:auto}
.step{margin-block-end:16px}
.step>.lbl{margin-block-end:7px;display:block}
.hint{font-size:13px;color:var(--muted);margin-block-start:6px}

.tx{display:flex;align-items:center;gap:10px;padding:10px 2px;border-block-end:1px solid var(--border)}
.tx:last-child{border-block-end:0}
.tx .ic{inline-size:38px;block-size:38px;flex:0 0 auto;border-radius:11px;background:var(--surface-2);
  display:grid;place-items:center;font-size:18px}
.txmain{flex:1;min-inline-size:0;background:none;border:0;padding:0;text-align:start;color:inherit}
.txmain b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txmain span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txamt{font-weight:700;white-space:nowrap;text-align:end}
.txamt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.dayhd{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding-block:8px 4px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);margin-inline-start:6px;vertical-align:1px}
.tag.w{background:#fff7e6;color:#92400e;border-color:#fcd9a3}
.tag.r{background:#fee4e2;color:#912018;border-color:#fda29b}
.tag.g{background:#e7f7ee;color:#05603a;border-color:#a6e9c5}
[data-theme=dark] .tag.w{background:#3a2c10;color:#fcd34d;border-color:#5b4514}
[data-theme=dark] .tag.r{background:#3d1614;color:#fca5a5;border-color:#5d211d}
[data-theme=dark] .tag.g{background:#0d2d20;color:#6ee7b7;border-color:#14532d}

.bar{block-size:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-block:6px}
.bar i{display:block;block-size:100%;background:var(--accent);border-radius:99px}
.bar i.w{background:var(--warn)} .bar i.o{background:var(--out)}
table{inline-size:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 6px;border-block-end:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
td,th{word-break:break-word}
@media (max-width:380px){
  th,td{padding:8px 3px;font-size:13px}
  .btn{padding:12px 13px}
  .chip{padding:9px 10px;font-size:13.5px}
  .big{font-size:23px}
  .amtbox input{font-size:26px}
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.cd{aspect-ratio:1;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:1px;color:inherit}
.cd b{font-size:13px} .cd small{font-size:9.5px;color:var(--muted);line-height:1.1}
.cd.now{outline:2px solid var(--accent)} .cd.no{border:0;background:none}
svg{display:block;inline-size:100%;block-size:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin-block-start:8px}
.legend i{display:inline-block;inline-size:10px;block-size:10px;border-radius:3px;margin-inline-end:5px}
.note{display:flex;gap:9px;background:var(--surface-2);border:1px solid var(--border);
  border-inline-start:4px solid var(--warn);border-radius:11px;padding:11px 12px;font-size:14px;margin-block-end:8px}
.note.bad{border-inline-start-color:var(--out)} .note.ok{border-inline-start-color:var(--in)}
.note.info{border-inline-start-color:var(--move)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14.5px}

nav.bottom{position:fixed;inset-inline:0;inset-block-end:0;z-index:40;background:var(--surface);
  border-block-start:1px solid var(--border);display:flex;padding-block-end:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:0;padding:8px 2px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-block-size:58px}
nav.bottom button b{font-size:19px;font-weight:400;line-height:1.1}
nav.bottom button[aria-current=page]{color:var(--accent)}
nav.bottom button.plus b{background:var(--accent);color:#fff;border-radius:50%;inline-size:38px;block-size:38px;
  display:grid;place-items:center;margin-block-start:-14px;box-shadow:0 4px 14px rgba(15,118,110,.4);font-size:22px}
nav.bottom button.plus{color:var(--accent)}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,13,18,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);inline-size:min(600px,100%);max-block-size:92vh;overflow:auto;
  border:1px solid var(--border);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:18px}}
.shd{display:flex;align-items:center;gap:8px;margin-block-end:12px}
.savebar{position:sticky;inset-block-end:0;background:var(--surface);padding-block:10px 2px;margin-block-start:6px;border-block-start:1px solid var(--border)}
.recap{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:14px;margin-block-end:10px}

.screen{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;
  padding:26px 14px calc(30px + env(safe-area-inset-bottom))}
.screen .box{max-inline-size:460px;margin-inline:auto}
.dots{display:flex;gap:6px;justify-content:center;margin-block:12px}
.dots i{inline-size:8px;block-size:8px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--accent)}
.pinrow{display:flex;gap:10px;justify-content:center;margin-block:16px}
.pinrow i{inline-size:14px;block-size:14px;border-radius:50%;border:2px solid var(--accent)}
.pinrow i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:18px;font-size:20px;font-weight:650;background:var(--surface-2);
  border:1px solid var(--border);border-radius:12px;min-block-size:58px}
.toast{position:fixed;inset-block-end:calc(88px + env(safe-area-inset-bottom));inset-inline:0;z-index:70;
  display:flex;justify-content:center;padding-inline:14px}
.toast div{background:var(--text);color:var(--bg);border-radius:99px;padding:11px 14px 11px 17px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;padding:4px 6px}
@media print{header.top,nav.bottom,.txacts{display:none!important}body{padding:0}}
</style>
</head>
<body>
<div class="screen hidden" id="lockScreen">
  <div class="box" style="text-align:center">
    <div style="font-size:36px">🔒</div>
    <h2 style="margin-block:10px">Enter your PIN</h2>
    <p class="sub" id="lockMsg">Everything is stored on this device only.</p>
    <div class="pinrow" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pinPad"></div>
    <button class="btn g s" style="margin-block-start:14px" data-act="forgotPin">Forgot PIN?</button>
  </div>
</div>

<div class="screen hidden" id="authScreen"></div>
<div class="screen hidden" id="setupScreen"></div>

<header class="top">
  <div class="wrap">
    <span class="brand">💰 Money Tracker</span>
    <span class="grow"></span>
    <span id="syncPill" class="hidden" style="margin-inline-end:4px"></span>
    <button class="ib" id="themeBtn" title="Switch light or dark theme" aria-label="Switch light or dark theme">🌗</button>
    <button class="ib" data-act="go" data-view="more" title="Settings" aria-label="Settings">⚙️</button>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<nav class="bottom" id="nav" aria-label="Main"></nav>
<div class="toast hidden" id="toast"><div><span id="toastMsg"></span></div></div>
<div class="scrim hidden" id="scrim" role="dialog" aria-modal="true" aria-label="Dialog"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
var MT = (function () {

/* =========================================================
   1. BASICS
   ========================================================= */
var KEY = "moneytracker";
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var COLORS = ["#0f766e","#f59e0b","#5b5bd6","#d92d20","#0ea5e9","#0b8a5f","#db2777","#65a30d","#ea580c","#64748b"];

var CURRENCIES = {
  INR:{ s:"\u20b9", l:"en-IN" }, USD:{ s:"$", l:"en-US" }, EUR:{ s:"\u20ac", l:"de-DE" },
  GBP:{ s:"\u00a3", l:"en-GB" }, AED:{ s:"AED ", l:"en-AE" }, SGD:{ s:"S$", l:"en-SG" },
  AUD:{ s:"A$", l:"en-AU" }, CAD:{ s:"C$", l:"en-CA" }, JPY:{ s:"\u00a5", l:"ja-JP" }
};

var CAT_ICON = {
  Food:"🍛", Groceries:"🛒", Travel:"🚌", Fuel:"⛽", Shopping:"🛍️", Bills:"🧾", Rent:"🏠",
  Health:"💊", Education:"🎓", Fun:"🎬", Subscriptions:"🔁", Savings:"📈", "Loan/EMI":"🏦",
  Salary:"💰", "Side income":"🧑‍💻", Interest:"🏦", Gift:"🎁", Other:"•"
};
var DEFAULT_CATS = [
  { n:"Food", k:"out" }, { n:"Groceries", k:"out" }, { n:"Travel", k:"out" }, { n:"Fuel", k:"out" },
  { n:"Shopping", k:"out" }, { n:"Bills", k:"out" }, { n:"Rent", k:"out" }, { n:"Health", k:"out" },
  { n:"Education", k:"out" }, { n:"Fun", k:"out" }, { n:"Subscriptions", k:"out" },
  { n:"Savings", k:"out" }, { n:"Loan/EMI", k:"out" }, { n:"Other", k:"out" },
  { n:"Salary", k:"in" }, { n:"Side income", k:"in" }, { n:"Interest", k:"in" },
  { n:"Gift", k:"in" }, { n:"Other", k:"in" }
];
var HOWS = [
  { id:"cash",  label:"Cash",         icon:"💵" },
  { id:"app",   label:"Payment app",  icon:"📱" },
  { id:"card",  label:"Credit card",  icon:"💳" },
  { id:"debit", label:"Debit card",   icon:"🏧" },
  { id:"bank",  label:"Bank transfer",icon:"🏦" },
  { id:"other", label:"Something else",icon:"•" }
];
var APP_IDEAS = ["Google Pay","PhonePe","Paytm","BHIM","Amazon Pay","WhatsApp Pay"];
var STATUS = {
  done:      { label:"Done",            tag:"" },
  pending:   { label:"Waiting",         tag:"w" },
  failed:    { label:"Failed",          tag:"r" },
  cancelled: { label:"Cancelled",       tag:"r" },
  refunded:  { label:"Money back",      tag:"g" }
};

function blank() {
  return {
    v: 3,
    profile: { name: "" },
    accounts: [],
    apps: [],
    cats: DEFAULT_CATS.slice(),
    tx: [],
    budgets: {},
    monthlyBudget: 0,
    goals: [],
    bills: [],
    views: [],
    statements: [],
    auth: { user:"", pwHash:"", dob:"", gender:"", createdAt:"", lastSignIn:"" },
    seeded: false,
    sync: { user:"", repo:"", branch:"main", file:"data.json.enc", on:false,
            lastPull:"", lastPush:"", lastSeen:"" },
    settings: { theme:"auto", currency:"INR", pin:"", setupDone:false, lastHow:"", lastApp:"", demo:false }
  };
}

var db = blank();
var ui = {
  view: "home",
  month: "",
  cal: "",
  filters: null,
  draft: null,
  setup: 0,
  setupDraft: null,
  report: null,
  cardId: "",
  stmtId: "",
  cycle: null,
  cardCheck: null,
  receipt: null,
  auth: null,
  syncState: "",
  syncTimer: null,
  recovery: "",
  authed: false,
  undo: null,
  saving: false,
  pin: ""
};

/* =========================================================
   2. SMALL HELPERS
   ========================================================= */
function id(p) { return (p || "x") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function n(v) { var x = parseFloat(v); return isFinite(x) ? x : 0; }
/* money is stored as whole paise/cents so totals never drift */
function toMinor(v) {
  if (v === "" || v === null || v === undefined) return 0;
  var x = typeof v === "number" ? v : parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(x) ? Math.round(x * 100) : 0;
}
function toMajor(m) { return (m || 0) / 100; }
function cur() { return CURRENCIES[db.settings.currency] || CURRENCIES.INR; }
function money(m) {
  var v = Math.round(m || 0), c = cur(), abs = Math.abs(v) / 100, out;
  try {
    out = new Intl.NumberFormat(c.l, { minimumFractionDigits: abs % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 }).format(abs);
  } catch (e) { out = String(abs); }
  return (v < 0 ? "-" : "") + c.s + out;
}
function plus(m) { var v = Math.round(m || 0); return (v > 0 ? "+" : "") + money(v); }
function p2(x) { return x < 10 ? "0" + x : "" + x; }
function isoOf(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function hm(d) { return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
function stamp() { var d = new Date(); return isoOf(d) + "T" + hm(d); }
function today() { return isoOf(new Date()); }
function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return isoOf(d); }
function dateFrom(iso) { var a = String(iso || "").split("-"); return new Date(+a[0], (+a[1] || 1) - 1, +a[2] || 1); }
function mKey(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1); }
function mOf(iso) { return String(iso || "").slice(0, 7); }
function mLabel(mk) { var a = String(mk).split("-"); return MONTHS[(+a[1] || 1) - 1] + " " + a[0]; }
function mShift(mk, d) { var a = String(mk).split("-"); return mKey(new Date(+a[0], (+a[1] || 1) - 1 + d, 1)); }
function mDays(mk) { var a = String(mk).split("-"); return new Date(+a[0], +a[1], 0).getDate(); }
function fTime(t) {
  if (!t) return "";
  var h = parseInt(String(t).slice(0, 2), 10), mm = String(t).slice(3, 5);
  if (!isFinite(h)) return "";
  return (h % 12 === 0 ? 12 : h % 12) + ":" + mm + " " + (h >= 12 ? "PM" : "AM");
}
function fDate(iso) { var d = dateFrom(iso); return MONTHS[d.getMonth()].slice(0, 3) + " " + d.getDate() + ", " + d.getFullYear(); }
function fDateLong(iso) { var d = dateFrom(iso); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function fStamp(s) { return s ? fDate(String(s).slice(0, 10)) + " at " + fTime(String(s).slice(11, 16)) : "\u2014"; }

}
function daysToDay(day) {
  day = parseInt(day, 10);
  if (!day || day < 1 || day > 31) return null;
  var now = new Date(), base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  var t = new Date(now.getFullYear(), now.getMonth(), Math.min(day, dim));
  if (t < base) {
    var dim2 = new Date(now.getFullYear(), now.getMonth() + 2, 0).getDate();

/* =========================================================
   3. SAVE / LOAD

function saveLocalOnly() {

  catch (e) { toast("Couldn't save — this device's storage may be full"); return false; }
}

}

/** Take a plain data object (from storage, a backup, or GitHub) and make it live. */
function applyLoaded(parsed) {
  if (!parsed || typeof parsed !== "object") return;
  var base = blank();
  Object.keys(base).forEach(function (k) {
    if (parsed[k] !== undefined && parsed[k] !== null) base[k] = parsed[k];
  });
  base.settings = Object.assign(blank().settings, parsed.settings || {});
  base.profile = Object.assign({ name: "" }, parsed.profile || {});
  base.auth = Object.assign(blank().auth, parsed.auth || {});
  if (!Array.isArray(base.cats) || !base.cats.length) base.cats = DEFAULT_CATS.slice();
  ["accounts", "apps", "tx", "goals", "bills", "views", "statements"].forEach(function (k) {
    if (!Array.isArray(base[k])) base[k] = [];
  });
  base.tx.forEach(function (t) {
    if (!t.status) t.status = "done";
    if (!Array.isArray(t.refunds)) t.refunds = [];
    if (t.deducted === undefined) t.deducted = 0;

/* =========================================================

}

  return null;
}

function liveAccounts(kind) {
  return db.accounts.filter(function (a) {
    if (a.archived) return false;
    if (kind === "spend") return a.kind !== "card";
    if (kind) return a.kind === kind;
    return true;
  });
}
function cashAcc() { return liveAccounts("cash")[0] || liveAccounts()[0] || null; }
function firstBank() {
  var pref = db.accounts.filter(function (a) { return !a.archived && a.kind === "bank" && a.primary; })[0];
  return pref || liveAccounts("bank")[0] || cashAcc();
}
function cats(kind) {
  var seen = {}, out = [];
  db.cats.forEach(function (c) {
    if (c.k !== kind) return;
    if (seen[c.n]) return;
    seen[c.n] = 1; out.push(c.n);

}
function usedCats(kind) {

  var cutIso = isoOf(cut);
  db.tx.forEach(function (t) {
    if (t.type !== kind || !t.cat || t.date < cutIso) return;
    count[t.cat] = (count[t.cat] || 0) + 1;

  return cats(kind).slice().sort(function (a, b) { return (count[b] || 0) - (count[a] || 0); });

/* =========================================================
   5. THE MONEY RULES  (one place, used by everything)
   ---------------------------------------------------------
   out   = money spent            in   = money received
   move  = moved between my own accounts (never spending)
   bill  = paying a credit card bill (never a new expense)
   ========================================================= */
function refundTotal(t) {
  return (t.refunds || []).reduce(function (s, r) { return s + Math.round(r.amt || 0); }, 0);
}
/** How much actually left the account for this transaction. */
function moneyOut(t) {
  if (t.type !== "out") return 0;
  if (t.status === "pending") return 0;
  if (t.status === "failed" || t.status === "cancelled") return Math.round(t.deducted || 0);
  return Math.round(t.amt || 0);
}
/** Real spending after refunds. Failed/cancelled money is not spending. */
function netSpend(t) {
  if (t.type !== "out") return 0;
  if (t.status === "pending" || t.status === "failed" || t.status === "cancelled") return 0;
  return Math.max(0, Math.round(t.amt || 0) - refundTotal(t));
}
function netIncome(t) {
  if (t.type !== "in") return 0;
  return t.status === "pending" ? 0 : Math.round(t.amt || 0);
}
/** Money taken by a failed/cancelled payment that hasn't come back yet. */
function stuck(t) {
  if (t.type !== "out") return 0;
  if (t.status !== "failed" && t.status !== "cancelled") return 0;
  return Math.max(0, Math.round(t.deducted || 0) - refundTotal(t));
}
function effectiveStatus(t) {
  if (t.type !== "out") return t.status || "done";
  var r = refundTotal(t);
  if (r > 0 && t.status === "done") return "refunded";
  return t.status || "done";
}
function balance(accountId) {
  var a = acc(accountId);
  if (!a) return 0;
  var bal = Math.round(a.open || 0);
  db.tx.forEach(function (t) {
    var amt = Math.round(t.amt || 0);
    if (t.type === "out" && t.acc === accountId) bal -= moneyOut(t);
    else if (t.type === "in" && t.acc === accountId) bal += netIncome(t);
    else if (t.type === "move" || t.type === "bill") {
      if (t.acc === accountId) bal -= amt;
      if (t.to === accountId) bal += amt;
    }
    (t.refunds || []).forEach(function (r) {
      if (r.to === accountId) bal += Math.round(r.amt || 0);
    });
  });
  return bal;
}
function netWorth() {
  return db.accounts.reduce(function (s, a) {
    return (a.archived || a.include === false) ? s : s + balance(a.id);
  }, 0);
}
function cardOutstanding(a) {
  var b = balance(a.id);
  return b < 0 ? -b : 0;
}
function cardInfo(a) {
  var used = cardOutstanding(a), limit = Math.round(a.limit || 0);
  return { used: used, limit: limit, left: limit - used, use: limit > 0 ? (used / limit) * 100 : 0 };
}
function totalsFor(list) {
  var out = 0, inc = 0, back = 0, held = 0;
  list.forEach(function (t) {
    out += netSpend(t);
    inc += netIncome(t);
    back += t.type === "out" ? refundTotal(t) : 0;
    held += stuck(t);
  });
  return { out: out, in: inc, back: back, stuck: held, net: inc - out };
}
function txOn(iso) { return db.tx.filter(function (t) { return t.date === iso; }); }
function txIn(mk) { return db.tx.filter(function (t) { return mOf(t.date) === mk; }); }
function sortTx(list) {
  return list.slice().sort(function (a, b) {
    return (b.date + "T" + (b.time || "12:00")).localeCompare(a.date + "T" + (a.time || "12:00"));
  });
}
function byCategory(list) {
  var m = {};
  list.forEach(function (t) {
    var v = netSpend(t);
    if (!v || !t.cat) return;
    m[t.cat] = (m[t.cat] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
function byHow(list) {
  var m = {};
  list.forEach(function (t) {
    var v = netSpend(t);
    if (!v) return;
    var label = t.how === "app" ? (appName(t.appId) || "Payment app") : (howLabel(t.how) || "Other");
    m[label] = (m[label] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
function howLabel(x) {
  for (var i = 0; i < HOWS.length; i++) if (HOWS[i].id === x) return HOWS[i].label;
  return "";
}
function howIcon(x) {
  for (var i = 0; i < HOWS.length; i++) if (HOWS[i].id === x) return HOWS[i].icon;
  return "•";
}
function budgetTotal() {
  if (Math.round(db.monthlyBudget || 0) > 0) return Math.round(db.monthlyBudget);
  return Object.keys(db.budgets).reduce(function (s, k) { return s + Math.round(db.budgets[k] || 0); }, 0);
}
function spentByCat(mk) {
  var m = {};
  txIn(mk).forEach(function (t) {
    var v = netSpend(t);
    if (v && t.cat) m[t.cat] = (m[t.cat] || 0) + v;
  });
  return m;
}
function upcomingBills() {
  return db.bills.filter(function (b) { return !b.off; }).map(function (b) {
    return { bill: b, days: daysToDay(b.day) };
  }).filter(function (x) { return x.days !== null; })
    .sort(function (a, b) { return a.days - b.days; });
}

/* Recurring bills that the user chose to auto-add. */
function runBills(quiet) {
  var now = new Date(), made = 0;
  db.bills.forEach(function (b) {
    if (b.off || !b.auto) return;
    var day = parseInt(b.day, 10) || 1;
    var from = b.last ? dateFrom(b.last) : null;
    var cursor = from ? new Date(from.getFullYear(), from.getMonth() + 1, 1)
                      : new Date(now.getFullYear(), now.getMonth(), 1);
    var guard = 0;
    while (cursor <= now && guard < 30) {
      guard++;
      var dim = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
      var due = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(day, dim));
      var dueIso = isoOf(due);
      if (due <= now && (!b.last || dueIso > b.last)) {
        db.tx.push({
          id: id("t"), type: b.type || "out", amt: Math.round(b.amt || 0),
          cat: b.cat || "Bills", acc: b.acc || (firstBank() && firstBank().id) || "",
          to: "", how: b.how || "bank", appId: "", date: dueIso, time: "09:00", noTime: false,
          note: b.name, status: "done", deducted: 0, refunds: [], billId: b.id,
          createdAt: stamp(), updatedAt: stamp()
        });
        b.last = dueIso;
        made++;
      }
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    }
  });
  if (made) { save(); if (!quiet) toast(made + " scheduled payment" + (made === 1 ? "" : "s") + " added"); }
  return made;
}

/* =========================================================
   6. THINGS WORTH TELLING THE USER
   ========================================================= */
function alerts() {
  var out = [], mk = mKey(new Date()), td = today();
  var month = txIn(mk), spent = spentByCat(mk);

  Object.keys(db.budgets).forEach(function (c) {
    var b = Math.round(db.budgets[c] || 0);
    if (b <= 0) return;
    var s = spent[c] || 0, p = (s / b) * 100;
    if (p > 100) out.push({ k:"bad", i:"🔴", t:"You've gone " + money(s - b) + " over your <b>" + esc(c) + "</b> budget." });
    else if (p >= 80) out.push({ k:"", i:"⚠️", t:"You've used " + Math.round(p) + "% of your <b>" + esc(c) + "</b> budget." });
  });

  db.tx.forEach(function (t) {
    var s = stuck(t);
    if (!s) return;
    var days = Math.round((dateFrom(td) - dateFrom(t.date)) / 86400000);
    out.push({
      k: days > 7 ? "bad" : "", i: "↩️",
      t: money(s) + " from " + esc(t.note || t.cat || "a payment") + " hasn't come back yet" +
         (days > 0 ? " (" + days + " day" + (days === 1 ? "" : "s") + " ago)" : "") + ".",
      go: t.id
    });
  });

  cardAlerts().forEach(function (x) { out.push(x); });

  upcomingBills().slice(0, 3).forEach(function (u) {
    if (u.days > 3) return;
    out.push({ k:"info", i:"📅", t:esc(u.bill.name) + " (" + money(u.bill.amt) + ") is due " +
      (u.days === 0 ? "today" : u.days === 1 ? "tomorrow" : "in " + u.days + " days") + "." });
  });

  var bt = budgetTotal(), spentAll = totalsFor(month).out;
  if (bt > 0 && spentAll < bt) out.push({ k:"ok", i:"🎯", t:money(bt - spentAll) + " left to spend this month." });

  var todaySpend = totalsFor(txOn(td)).out;
  if (todaySpend > 0) {
    var days = {};
    month.forEach(function (t) { var v = netSpend(t); if (v) days[t.date] = (days[t.date] || 0) + v; });
    var keys = Object.keys(days).filter(function (k) { return k !== td; });
    if (keys.length >= 3) {
      var avg = keys.reduce(function (s, k) { return s + days[k]; }, 0) / keys.length;
      if (avg > 0 && todaySpend > avg * 1.3) {
        out.push({ k:"", i:"📈", t:"Today is " + Math.round(((todaySpend - avg) / avg) * 100) + "% above your usual daily spending." });
      }
    }
  }
  return out;
}

function barList(items, total) {

      '<div class="bar"><i style="inline-size:' + w.toFixed(1) + "%;background:" + COLORS[i % COLORS.length] + '"></i></div></div>';

function columns(values, labels, title) {
  var W = 660, H = 180, pad = 20, count = values.length || 1;

  var bars = values.map(function (v, i) {
    var h = max > 0 ? (v / max) * (H - pad * 2) : 0;
    return '<rect x="' + (pad + i * bw + bw * 0.18).toFixed(1) + '" y="' + (H - pad - h).toFixed(1) +
      '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(h, v > 0 ? 2 : 0).toFixed(1) +
      '" rx="2" fill="var(--accent)" opacity="' + (v > 0 ? 0.9 : 0.25) + '"><title>' +
      esc(labels[i] || "") + ": " + money(v) + "</title></rect>";
  }).join("");
  var ticks = labels.map(function (l, i) {

  }).join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(title || "Chart") + '">' +
    '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="var(--border)"/>' +

  var total = items.reduce(function (s, i) { return s + i.value; }, 0);

  }).join("");
  return '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
    '<svg viewBox="0 0 120 120" style="inline-size:118px;flex:0 0 auto" role="img" aria-label="Share by payment method">' +

    date: date || today(), time: hm(new Date()), noTime: false, channel: "",

    how: t.how || "", appId: t.appId || "", acc: t.acc || "", to: t.to || "",
    date: t.date, time: t.time || "", noTime: !!t.noTime, channel: t.channel || "", note: t.note || "",
    more: true, createdAt: t.createdAt || "", status: t.status || "done",

/** Which account the money comes from, given the simple answers so far. */
function draftAccount(d) {
  if (d.acc) return d.acc;
  if (d.how === "cash") { var c = cashAcc(); return c ? c.id : ""; }
  if (d.how === "card") { var k = liveAccounts("card")[0]; return k ? k.id : ""; }
  if (d.how === "app") {
    var a = app(d.appId);
    if (!a) return "";
    var counts = {};
    db.tx.forEach(function (t) { if (t.appId === a.id && t.acc) counts[t.acc] = (counts[t.acc] || 0) + 1; });
    var best = "", bestN = -1;
    (a.src || []).forEach(function (x) { if ((counts[x] || 0) > bestN) { bestN = counts[x] || 0; best = x; } });
    return best || a.def || (a.src || [])[0] || "";
  }
  var b = firstBank();

}
function draftReady(d) {
  if (toMinor(d.amt) <= 0) return false;
  if (d.date > today()) return false;
  if (d.type === "move" || d.type === "bill") return !!(d.acc && d.to && d.acc !== d.to);
  if (!d.cat) return false;
  if (d.type === "in") return !!draftAccount(d);

}

function blankFilters() {
  return { q:"", from:"", to:"", type:"", cat:"", acc:"", how:"", status:"", min:"", max:"", sort:"new" };
}
function filtered() {
  var f = ui.filters || blankFilters();
  var q = f.q.trim().toLowerCase();
  var out = db.tx.filter(function (t) {
    if (f.type && t.type !== f.type) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.acc && t.acc !== f.acc && t.to !== f.acc) return false;
    if (f.how && t.how !== f.how) return false;
    if (f.status === "stuck") { if (!stuck(t)) return false; }
    else if (f.status === "back") { if (!refundTotal(t)) return false; }
    else if (f.status && effectiveStatus(t) !== f.status) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.min !== "" && Math.round(t.amt) < toMinor(f.min)) return false;
    if (f.max !== "" && Math.round(t.amt) > toMinor(f.max)) return false;
    if (q) {
      var hay = [t.note, t.cat, howLabel(t.how), appName(t.appId), accName(t.acc), accName(t.to), toMajor(t.amt)]
        .join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  if (f.sort === "old") out.sort(function (a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); });
  else if (f.sort === "high") out.sort(function (a, b) { return b.amt - a.amt; });
  else if (f.sort === "low") out.sort(function (a, b) { return a.amt - b.amt; });
  else out = sortTx(out);
  return out;
}

function row2(k, v) { return "<tr><th>" + esc(k) + '</th><td class="n"><b>' + esc(v) + "</b></td></tr>"; }
function cmp(label, before, after, upIsGood) {
  var text, klass = "";
  if (!before) text = after ? "no comparison (nothing last month)" : "no change";
  else {
    var d = ((after - before) / before) * 100;
    var up = d > 0.5, down = d < -0.5;
    var arrow = up ? "▲" : down ? "▼" : "▬";
    klass = (!up && !down) ? "" : (up === !!upIsGood ? "in" : "out");
    text = arrow + " " + Math.abs(Math.round(d)) + "%";
  }
  return "<tr><th>" + esc(label) + '</th><td class="n">' + money(before) + " → " + money(after) +
    ' <span class="' + klass + '">' + esc(text) + "</span></td></tr>";
}
function calendar(mk) {
  var dim = mDays(mk), a = mk.split("-");
  var lead = (new Date(+a[0], +a[1] - 1, 1).getDay() + 6) % 7;
  var vals = [], i;
  for (i = 1; i <= dim; i++) vals.push(totalsFor(txOn(mk + "-" + p2(i))).out);
  var max = Math.max.apply(null, vals.concat([1]));
  var cells = DOW.map(function (d) { return '<span class="dw">' + d + "</span>"; }).join("");
  for (i = 0; i < lead; i++) cells += '<span class="cd no"></span>';
  for (i = 1; i <= dim; i++) {
    var iso = mk + "-" + p2(i), v = vals[i - 1];
    var shade = v > 0 ? Math.round((0.15 + (v / max) * 0.6) * 100) : 0;
    cells += '<button type="button" class="cd' + (iso === today() ? " now" : "") + '" data-act="calDay" data-d="' + iso + '"' +
      (v > 0 ? ' style="background:color-mix(in srgb, var(--out) ' + shade + '%, var(--surface-2))"' : "") +
      ' aria-label="' + esc(fDate(iso) + ": " + money(v)) + '"><b>' + i + "</b><small>" + (v > 0 ? money(v) : "") + "</small></button>";
  }
  return '<div class="cal">' + cells + '</div><p class="sub" style="margin-block-start:8px">Darker means you spent more. Tap a day to see it.</p>';
}

        (a.kind === "card" ? '<br><span class="sub">' + money(cardOutstanding(a)) + " to pay</span>" : "") +
        '</td><td class="n">' + (hit ? money(hit.value) : "—") + "</td></tr>";
    }).join("") +
    '<tr><td><b>Total you have</b></td><td></td><td class="n"><b>' + money(netWorth()) + "</b></td><td></td></tr></table>" +
    '<div class="grid" style="margin-block-start:12px">' +

  h += '<div class="sec"><h2>What you spent it on</h2><div class="card">' + barList(R.cats, R.totals.out) +

  h += '<div class="sec"><h2>How you paid</h2><div class="card">' + donut(R.hows) + "</div></div>";

  if (R.apps.length) {

  /* over time */
  var months = monthsBetween(R.from, R.to);
  if (months.length > 1) {

    h += '<div class="sec"><h2>Month by month</h2><div class="card">' +

      }).join("") + "</table></div></div>";
  } else {
    var daily = [], labels = [], cursor = R.from, guard = 0;
    while (cursor <= R.to && guard < 62) {
      daily.push(totalsFor(R.list.filter(function (t) { return t.date === cursor; })).out);
      labels.push(String(parseInt(cursor.slice(8), 10)));

      guard++;
    }
    h += '<div class="sec"><h2>Day by day</h2><div class="card">' +
      columns(daily, labels, "Spending each day in this period") + "</div></div>";

  /* the numbers */
  h += '<div class="sec"><h2>The numbers</h2><div class="card"><table>' +
    row2("Period", R.name) +
    row2("Entries counted", String(R.count)) +
    row2("Money in", money(R.totals.in)) +
    row2("Real spending", money(R.totals.out)) +
    row2(R.totals.net >= 0 ? "Kept" : "Overspent by", money(Math.abs(R.totals.net))) +
    row2("Average per day", money(R.perDayAvg)) +
    row2("Average per purchase", money(R.avgSpend)) +
    row2("Biggest single day", R.busiest ? money(R.busiestAmt) + " on " + fDate(R.busiest) : "—") +
    row2("Biggest category", topCat ? topCat.label + " · " + money(topCat.value) : "—") +
    row2("Most-used account", topAcc ? topAcc.label + " · " + money(topAcc.value) : "—") +

  /* reconciliation for anything with a refund */
  var withRefunds = R.list.filter(function (t) { return refundTotal(t) > 0 || stuck(t) > 0; });
  if (withRefunds.length) {
    h += '<div class="sec"><h2>Refunds and payment issues</h2><div class="card"><table>' +
      '<tr><th scope="col">Payment</th><th scope="col" class="n">Originally paid</th>' +
      '<th scope="col" class="n">Came back</th><th scope="col" class="n">Kept / waiting</th>' +
      '<th scope="col" class="n">Really cost</th></tr>' +
      withRefunds.map(function (t) {
        var back = refundTotal(t), st = STATUS[effectiveStatus(t)] || STATUS.done;
        var held = t.status === "done" ? Math.max(0, Math.round(t.amt) - back) : stuck(t);
        var dates = (t.refunds || []).map(function (x) { return fDate(x.date); }).join(", ");
        return "<tr><td>" + esc(txTitle(t)) + '<br><span class="sub">paid ' + esc(fDate(t.date)) +
          (dates ? " · back " + esc(dates) : "") + " · " + esc(st.label) + '</span></td><td class="n">' +
          money(t.amt) + '</td><td class="n in">' + money(back) + '</td><td class="n">' + money(held) +
          '</td><td class="n"><b>' + money(netSpend(t)) + "</b></td></tr>";
      }).join("") + "</table>" +
      '<p class="sub">Original payments are never rewritten — each refund keeps its own date and amount.</p></div></div>';
  }

  /* biggest */
  var biggest = R.list.filter(function (t) { return netSpend(t) > 0; })
    .sort(function (a, b) { return netSpend(b) - netSpend(a); }).slice(0, 8);
  if (biggest.length) {
    h += '<div class="sec"><h2>Biggest single spends</h2><div class="card">' + biggest.map(txRow).join("") + "</div></div>";
  }
  return h;
}

/* =========================================================
   CREDIT CARD MANAGEMENT
   ---------------------------------------------------------
   Three different obligations, never merged into one number:
     current outstanding — everything owed on the card right now
     statement balance   — what the issuer billed for one cycle
     minimum due         — the least you must pay on that statement
   A billing cycle runs from the day after one closing date to
   the next closing date. Nothing is ever called "generated"
   until you confirm it, because this app has no link to your
   bank and cannot know what the issuer actually billed.
   ========================================================= */

/* How a card was used. This is only a label on the transaction —
   a RuPay card tapped through UPI is still the SAME card, with one
   limit, one outstanding balance and one bill. Never a second card. */
var CARD_CHANNELS = [
  { id:"swipe",  label:"Tapped or swiped", hint:"In a shop, on a card machine" },
  { id:"online", label:"Online",           hint:"Website or app checkout" },
  { id:"upi",    label:"Through UPI",      hint:"RuPay card linked in a UPI app" }
];
function channelLabel(x) {
  for (var i = 0; i < CARD_CHANNELS.length; i++) if (CARD_CHANNELS[i].id === x) return CARD_CHANNELS[i].label;
  return "";
}
/** Card spending split by how the card was used — one card, several channels. */
function channelSplit(cardId, fromIso, toIso) {
  var m = {};
  db.tx.forEach(function (t) {
    if (t.type !== "out" || t.acc !== cardId) return;
    if (fromIso && t.date < fromIso) return;
    if (toIso && t.date > toIso) return;
    var v = netSpend(t);
    if (!v) return;
    var k = channelLabel(t.channel) || (t.charge ? "Fees and interest" : "Not noted");
    m[k] = (m[k] || 0) + v;
  });
  return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}
var CHARGE_KINDS = [
  { id:"fee",      label:"Fee" },
  { id:"interest", label:"Interest" },
  { id:"emi",      label:"EMI instalment" },
  { id:"tax",      label:"Tax" },
  { id:"other",    label:"Other charge" }
];
var PAY_TYPES = [
  { id:"remaining", label:"Remaining statement amount" },
  { id:"full",      label:"Full statement balance" },
  { id:"min",       label:"Minimum amount due" },
  { id:"current",   label:"Current outstanding (everything)" },
  { id:"custom",    label:"Some other amount" }
];

function cards(includeArchived) {
  return db.accounts.filter(function (a) {
    return a.kind === "card" && (includeArchived || !a.archived);
  });
}
function isCard(x) { var a = acc(x); return !!(a && a.kind === "card"); }

/* ---------- dates ---------- */
/** The closing day for a given month, honouring "last day" and short months. */
function closingDay(card, year, monthIndex) {
  var dim = new Date(year, monthIndex + 1, 0).getDate();
  if (card.stmtDay === "last" || !card.stmtDay) return dim;
  var want = parseInt(card.stmtDay, 10);
  if (!want || want < 1) return dim;
  return Math.min(want, dim);
}
function closingDateFor(card, year, monthIndex) {
  return isoOf(new Date(year, monthIndex, closingDay(card, year, monthIndex)));
}
/** Was the configured day shortened to fit the month? */
function closingAdjusted(card, iso) {
  if (!card.stmtDay || card.stmtDay === "last") return false;
  var want = parseInt(card.stmtDay, 10);
  return !!want && parseInt(iso.slice(8), 10) !== want;
}
/** The next closing date strictly after the given day. */
function nextClosing(card, afterIso) {
  var base = dateFrom(afterIso || today());
  var y = base.getFullYear(), m = base.getMonth();
  for (var i = 0; i < 14; i++) {
    var candidate = closingDateFor(card, y, m + i);
    if (candidate > (afterIso || today())) return candidate;
  }
  return closingDateFor(card, y, m + 1);
}
/** The most recent closing date on or before today, whether or not it was confirmed. */
function lastExpectedClosing(card) {
  var base = new Date();
  for (var i = 0; i < 14; i++) {
    var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    var candidate = closingDateFor(card, d.getFullYear(), d.getMonth());
    if (candidate <= today()) return candidate;
  }
  return "";
}
function expectedDue(card, closeIso) {
  if (!closeIso) return "";
  if (card.dueRule === "days") {
    var n = parseInt(card.dueDays, 10) || 20;
    return isoOf(new Date(dateFrom(closeIso).getTime() + n * 86400000));
  }
  var want = parseInt(card.dueDay, 10);
  if (!want) return isoOf(new Date(dateFrom(closeIso).getTime() + 20 * 86400000));
  var c = dateFrom(closeIso);
  for (var i = 0; i < 3; i++) {
    var y = c.getFullYear(), m = c.getMonth() + i;
    var dim = new Date(y, m + 1, 0).getDate();
    var candidate = isoOf(new Date(y, m, Math.min(want, dim)));
    if (candidate > closeIso) return candidate;
  }
  return isoOf(new Date(c.getTime() + 20 * 86400000));
}
function daysBetweenIso(a, b) {
  return Math.round((dateFrom(b) - dateFrom(a)) / 86400000);
}
function dayPhrase(prefix, days, overduePrefix) {
  if (days === 0) return prefix + " today";
  if (days === 1) return prefix + " tomorrow";
  if (days > 1) return prefix + " in " + days + " days";
  var over = Math.abs(days);
  return (overduePrefix || "Overdue by") + " " + over + " day" + (over === 1 ? "" : "s");
}

/* ---------- statements ---------- */
function statementsOf(cardId) {
  return (db.statements || []).filter(function (s) { return s.cardId === cardId; })
    .sort(function (a, b) { return b.closeDate.localeCompare(a.closeDate); });
}
function statementById(x) {
  var all = db.statements || [];
  for (var i = 0; i < all.length; i++) if (all[i].id === x) return all[i];
  return null;
}
function latestStatement(cardId) { return statementsOf(cardId)[0] || null; }
/** Payments recorded against one statement. */
function statementPayments(stmtId) {
  return db.tx.filter(function (t) { return t.type === "bill" && t.stmtId === stmtId; });
}
function paidOnStatement(stmtId) {
  return statementPayments(stmtId).reduce(function (s, t) { return s + Math.round(t.amt || 0); }, 0);
}
/** Refunds that landed on the card after the statement closed reduce what you owe. */
function statementCredits(st) {
  var total = 0;
  db.tx.forEach(function (t) {
    (t.refunds || []).forEach(function (r) {
      if (r.to !== st.cardId) return;
      if (r.date > st.closeDate && (!st.dueDate || r.date <= st.dueDate)) total += Math.round(r.amt || 0);
    });
  });
  return total;
}
function statementRemaining(st) {
  return Math.max(0, Math.round(st.balance || 0) - paidOnStatement(st.id) - statementCredits(st));
}
function minStillDue(st) {
  var paid = paidOnStatement(st.id) + statementCredits(st);
  return Math.max(0, Math.round(st.minDue || 0) - paid);
}
function statementState(st) {
  var remaining = statementRemaining(st);
  var paid = paidOnStatement(st.id);
  if (remaining <= 0) return "paid";
  if (st.dueDate && st.dueDate < today()) return "overdue";
  return paid > 0 ? "partial" : "open";
}
function unpaidStatements(cardId) {
  return statementsOf(cardId).filter(function (s) { return statementRemaining(s) > 0; })
    .sort(function (a, b) { return a.closeDate.localeCompare(b.closeDate); });
}

/* ---------- card money ---------- */
/** Everything charged to the card between two dates (purchases + fees - refunds). */
function cardActivity(cardId, fromIso, toIso) {
  var charges = 0, refunds = 0, payments = 0, rows = [];
  db.tx.forEach(function (t) {
    var inRange = (!fromIso || t.date >= fromIso) && (!toIso || t.date <= toIso);
    if (t.type === "out" && t.acc === cardId && inRange) {
      var amount = moneyOut(t);
      if (amount) { charges += amount; rows.push(t); }
    }
    if ((t.type === "bill" || t.type === "move") && t.to === cardId && inRange) {
      payments += Math.round(t.amt || 0);
      rows.push(t);
    }
    (t.refunds || []).forEach(function (r) {
      if (r.to !== cardId) return;
      if ((!fromIso || r.date >= fromIso) && (!toIso || r.date <= toIso)) {
        refunds += Math.round(r.amt || 0);
        if (rows.indexOf(t) === -1) rows.push(t);
      }
    });
  });
  return { charges: charges, refunds: refunds, payments: payments, net: charges - refunds, rows: rows };
}
/** The cycle currently running: day after the last close, up to the next close. */
function currentCycle(card) {
  var last = latestStatement(card.id);
  var from = last ? isoOf(new Date(dateFrom(last.closeDate).getTime() + 86400000))
                  : (card.openedOn || "");
  var to = nextClosing(card, last ? last.closeDate : (lastExpectedClosing(card) || today()));
  if (!last) {
    var prev = lastExpectedClosing(card);
    to = prev && prev >= today() ? prev : nextClosing(card, prev || yesterday());
  }
  return { from: from, to: to };
}
function unbilled(card) {
  var last = latestStatement(card.id);
  if (!last) return cardOutstanding(card);
  var from = isoOf(new Date(dateFrom(last.closeDate).getTime() + 86400000));
  var a = cardActivity(card.id, from, "");
  return Math.max(0, a.net);
}
function cardMoney(card) {
  var limit = Math.round(card.limit || 0);
  var outstanding = cardOutstanding(card);
  var st = latestStatement(card.id);
  return {
    limit: limit,
    outstanding: outstanding,
    unbilled: unbilled(card),
    available: limit > 0 ? limit - outstanding : null,
    utilisation: limit > 0 ? (outstanding / limit) * 100 : null,
    statement: st,
    statementBalance: st ? Math.round(st.balance || 0) : 0,
    statementPaid: st ? paidOnStatement(st.id) + statementCredits(st) : 0,
    statementRemaining: st ? statementRemaining(st) : 0,
    minDue: st ? Math.round(st.minDue || 0) : 0,
    minRemaining: st ? minStillDue(st) : 0,
    pastDue: unpaidStatements(card.id).filter(function (s) {
      return st && s.id !== st.id;
    }).reduce(function (sum, s) { return sum + statementRemaining(s); }, 0)
  };
}
/** Which of the six states the tile should show. */
function cardState(card) {
  var st = latestStatement(card.id);
  var nextClose = st ? nextClosing(card, st.closeDate) : (lastExpectedClosing(card) >= today()
    ? lastExpectedClosing(card) : nextClosing(card, yesterday()));
  if (st && statementRemaining(st) > 0) {
    return { id: statementState(st), statement: st, nextClose: nextClose };
  }
  var expected = st ? nextClosing(card, st.closeDate) : lastExpectedClosing(card);
  if (st && statementRemaining(st) <= 0 && st.closeDate >= (lastExpectedClosing(card) || "")) {
    /* everything settled and no newer statement is due yet */
    if (expected && expected <= today()) return { id:"expected", expectedDate: expected, statement: st, nextClose: expected };
    return { id: "paid", statement: st, nextClose: expected };
  }
  if (expected && expected <= today()) {
    return { id: "expected", expectedDate: expected, statement: st, nextClose: expected };
  }
  return { id: "before", nextClose: nextClose || expected, statement: st };
}
function stateWords(id) {
  return { before:"Nothing billed yet", expected:"Statement expected", open:"Bill generated",
           partial:"Bill partly paid", paid:"Bill paid", overdue:"Payment overdue" }[id] || "";
}
function stateTag(id) {
  return { before:"", expected:"w", open:"w", partial:"w", paid:"g", overdue:"r" }[id] || "";
}

/* ---------- the card tile ---------- */
function cardTile(card) {
  var m = cardMoney(card), s = cardState(card);
  var h = '<div class="card"><div class="rowline"><b>💳 ' + esc(card.name) +
    (card.last4 ? ' <span class="sub">••' + esc(card.last4) + "</span>" : "") + "</b>" +
    '<span class="tag ' + stateTag(s.id) + '">' + esc(stateWords(s.id)) + "</span></div>";

  if (m.limit > 0) {
    var klass = m.utilisation > 70 ? "o" : m.utilisation > 30 ? "w" : "";
    h += '<div class="bar"><i class="' + klass + '" style="inline-size:' +
      Math.min(100, Math.max(0, m.utilisation)).toFixed(1) + '%"></i></div>' +
      '<p class="sub">' + m.utilisation.toFixed(1) + "% of your " + money(m.limit) +
      " limit used · " + money(m.available) + " still available</p>";
  } else {
    h += '<p class="sub">No credit limit saved, so no usage figure is shown.</p>';
  }

  h += "<table>";
  if (s.id === "before" || s.id === "expected") {
    h += row2("Current outstanding", money(m.outstanding)) +
      row2("Not yet billed", money(m.unbilled));
    if (m.limit > 0) h += row2("Available credit", money(m.available));
  } else {
    h += row2("Statement balance", money(m.statementBalance)) +
      row2("Amount paid", money(m.statementPaid)) +
      row2("Remaining amount", money(m.statementRemaining));
    if (m.minDue > 0) h += row2(s.id === "overdue" ? "Minimum still due" : "Minimum amount due",
      money(s.id === "paid" ? m.minDue : m.minRemaining));
    h += row2("Current outstanding", money(m.outstanding)) +
      row2("Of that, not yet billed", money(m.unbilled));
  }
  h += "</table>";

  if (s.id === "before") {
    var days = daysBetweenIso(today(), s.nextClose);
    h += '<p class="sub" style="margin-block-start:8px">' + esc(dayPhrase("Bill generates", days)) +
      " · expected " + esc(fDateLong(s.nextClose)) +
      (closingAdjusted(card, s.nextClose) ? " (moved to the last day of that month)" : "") + "</p>" +
      '<div class="btns" style="margin-block-start:8px">' +
      '<button type="button" class="btn g s" data-act="openCard" data-id="' + esc(card.id) + '">Open card</button>' +
      '<button type="button" class="btn g s" data-act="cardCycle" data-id="' + esc(card.id) + '">This billing cycle</button>' +
      (m.outstanding > 0 ? '<button type="button" class="btn g s" data-act="payCard" data-id="' + esc(card.id) +
        '">Pay early</button>' : "") + "</div>";
  } else if (s.id === "expected") {
    h += '<div class="note" style="margin-block-start:8px"><span aria-hidden="true">📄</span><div>' +
      "<b>Statement expected today</b> (" + esc(fDateLong(s.expectedDate)) + "). " +
      "This app has no link to your bank, so only you can confirm what was actually billed.</div></div>" +
      '<div class="btns">' +
      '<button type="button" class="btn s" data-act="confirmStmt" data-id="' + esc(card.id) + '">Confirm the bill</button>' +
      '<button type="button" class="btn g s" data-act="remindLater" data-id="' + esc(card.id) + '">Remind me later</button>' +
      '<button type="button" class="btn g s" data-act="openCard" data-id="' + esc(card.id) + '">Open card</button>' +
      (m.outstanding > 0 ? '<button type="button" class="btn g s" data-act="payCard" data-id="' + esc(card.id) +
        '">Pay now</button>' : "") + "</div>";
  } else {
    var st = s.statement;
    if (st && st.dueDate) {
      var dd = daysBetweenIso(today(), st.dueDate);
      h += '<p class="sub" style="margin-block-start:8px">Last date to pay: <b>' + esc(fDateLong(st.dueDate)) + "</b>" +
        (s.id === "paid" ? "" : " · " + esc(dayPhrase("Payment due", dd, "Payment overdue by"))) + "</p>";
    }
    if (s.id === "paid") {
      var lastPay = statementPayments(st.id).sort(function (a, b) { return b.date.localeCompare(a.date); })[0];
      if (lastPay) h += '<p class="sub">Paid on ' + esc(fDateLong(lastPay.date)) + "</p>";
    }
    h += '<div class="btns" style="margin-block-start:8px">' +
      (s.id === "paid" ? "" :
        '<button type="button" class="btn s" data-act="payCard" data-id="' + esc(card.id) + '">' +
        (s.id === "partial" ? "Pay the rest" : s.id === "overdue" ? "Record a payment" : "Pay bill") + "</button>") +
      '<button type="button" class="btn g s" data-act="openStmt" data-id="' + esc(st.id) + '">View statement</button>' +
      '<button type="button" class="btn g s" data-act="openCard" data-id="' + esc(card.id) + '">Open card</button></div>';
  }
  if (m.pastDue > 0) {
    h += '<div class="note bad" style="margin-block-start:8px"><span aria-hidden="true">⚠️</span><div>' +
      money(m.pastDue) + " from an earlier statement is still unpaid.</div></div>";
  }
  return h + "</div>";
}

/* ---------- the card page ---------- */
function pageCard() {
  var card = acc(ui.cardId);
  if (!card) { ui.view = "money"; return pageMoney(); }
  var m = cardMoney(card), s = cardState(card), cycle = currentCycle(card);
  var h = '<div class="sec" style="display:flex;align-items:center;gap:10px;margin-block:14px 6px">' +
    '<button type="button" class="ib" data-act="go" data-view="money" aria-label="Back to accounts">←</button>' +
    "<h2>" + esc(card.name) + "</h2></div>";

  h += cardTile(card);

  h += '<div class="sec"><h2>What you owe, split up</h2><div class="card"><table>' +
    row2("Current outstanding", money(m.outstanding)) +
    row2("Latest statement balance", m.statement ? money(m.statementBalance) : "No statement confirmed yet") +
    row2("Paid against that statement", m.statement ? money(m.statementPaid) : "—") +
    row2("Remaining on that statement", m.statement ? money(m.statementRemaining) : "—") +
    row2("Minimum amount due", m.statement && m.minDue ? money(m.minDue) : "—") +
    row2("Not yet billed (this cycle)", money(m.unbilled)) +
    row2("Earlier unpaid statements", money(m.pastDue)) +
    row2("Credit limit", m.limit > 0 ? money(m.limit) : "Not saved") +
    row2("Available credit", m.available === null ? "—" : money(m.available)) +
    row2("Credit utilisation", m.utilisation === null ? "—" : m.utilisation.toFixed(1) + "%") +
    '</table><p class="sub">These are different obligations. The statement is what the issuer billed for one cycle; ' +
    "the outstanding figure also includes anything you have spent since.</p></div></div>";

  /* current cycle */
  var act2 = cardActivity(card.id, cycle.from, cycle.to);
  h += '<div class="sec"><h2>Current billing cycle</h2><div class="card">' +
    '<p class="sub">' + (cycle.from ? esc(fDateLong(cycle.from)) : "Since you added the card") +
    " to " + esc(fDateLong(cycle.to)) +
    (closingAdjusted(card, cycle.to) ? " (closing day moved to fit that month)" : "") + "</p><table>" +
    row2("Purchases and charges", money(act2.charges)) +
    row2("Refunds received", money(act2.refunds)) +
    row2("Payments made", money(act2.payments)) +
    row2("Running cycle total", money(act2.net)) +
    "</table>" +
    (act2.rows.length ? '<div style="margin-block-start:10px">' +
      sortTx(act2.rows).slice(0, 8).map(txRow).join("") + "</div>" :
      '<p class="empty">Nothing on this card in this cycle yet.</p>') +
    (function () {
      var split = channelSplit(card.id, cycle.from, cycle.to);
      if (!split.length) return "";
      return '<div style="margin-block-start:12px"><span class="lbl">How the card was used</span>' +
        barList(split, split.reduce(function (n, x) { return n + x.value; }, 0)) +
        '<p class="sub">All of these are on this one card — a RuPay card used through a UPI app is not a separate card.</p></div>';
    })() +
    '<div class="btns" style="margin-block-start:10px">' +
    '<button type="button" class="btn g s" data-act="cardCycle" data-id="' + esc(card.id) + '">See all of them</button>' +
    '<button type="button" class="btn g s" data-act="addCharge" data-id="' + esc(card.id) + '">Add a fee, interest or EMI</button>' +
    '<button type="button" class="btn g s" data-act="cycleCsv" data-id="' + esc(card.id) + '">Download this cycle</button>' +
    "</div></div></div>";

  /* statements */
  var list = statementsOf(card.id);
  h += '<div class="sec"><h2>Statements</h2><div class="card">' +
    (list.length ? "<table><tr><th scope=\"col\">Closed on</th><th scope=\"col\" class=\"n\">Billed</th>" +
      '<th scope="col" class="n">Remaining</th><th scope="col">Status</th><th scope="col"></th></tr>' +
      list.map(function (st) {
        var state = statementState(st);
        return "<tr><td>" + esc(fDateLong(st.closeDate)) + '<br><span class="sub">due ' +
          esc(st.dueDate ? fDateLong(st.dueDate) : "not set") + "</span></td>" +
          '<td class="n">' + money(st.balance) + '</td><td class="n">' + money(statementRemaining(st)) + "</td>" +
          '<td><span class="tag ' + stateTag(state) + '">' + esc(stateWords(state)) + "</span></td>" +
          '<td class="n"><button type="button" class="btn g s" data-act="openStmt" data-id="' + esc(st.id) + '">Open</button></td></tr>';
      }).join("") + "</table>"
      : '<p class="empty">No statements confirmed yet.</p>') +
    '<div class="btns" style="margin-block-start:10px">' +
    '<button type="button" class="btn s" data-act="confirmStmt" data-id="' + esc(card.id) + '">Add or confirm a statement</button>' +
    '<button type="button" class="btn g s" data-act="editAcc" data-id="' + esc(card.id) + '">Card settings</button></div>' +
    '<p class="sub">Old statements are kept exactly as confirmed, even after you pay them.</p></div></div>';

  /* payments */
  var pays = db.tx.filter(function (t) { return t.type === "bill" && t.to === card.id; });
  h += '<div class="sec"><h2>Payments to this card</h2><div class="card">' +
    (pays.length ? sortTx(pays).map(function (t) {
      var st = t.stmtId ? statementById(t.stmtId) : null;
      return '<div class="tx"><span class="ic" aria-hidden="true">💳</span>' +
        '<button type="button" class="txmain" data-act="openTx" data-id="' + esc(t.id) + '">' +
        "<b>" + money(t.amt) + " from " + esc(accName(t.acc)) + "</b><span>" +
        esc(fDateLong(t.date) + (st ? " · towards the " + fDate(st.closeDate) + " statement" : " · not linked to a statement") +
          (t.ref ? " · ref " + t.ref : "")) + "</span></button></div>";
    }).join("") : '<p class="empty">No payments recorded yet.</p>') +
    '<div class="btns" style="margin-block-start:10px">' +
    '<button type="button" class="btn s" data-act="payCard" data-id="' + esc(card.id) + '">Pay this card</button></div></div></div>';

  /* reconciliation against the bank */
  h += '<div class="sec"><h2>Does this match your bank?</h2><div class="card">' +
    '<form data-form="cardCheck"><input type="hidden" name="id" value="' + esc(card.id) + '">' +
    '<div class="two"><div class="f"><label for="ccReal">Outstanding shown in your bank app</label>' +
    '<input id="ccReal" name="real" type="number" inputmode="decimal" step="0.01" placeholder="0"></div>' +
    '<div class="f"><label>&nbsp;</label><button type="submit" class="btn full">Compare</button></div></div></form>' +
    '<p class="sub">This app says <b>' + money(m.outstanding) + "</b>. If your bank shows something else, " +
    "the difference is usually a charge or refund that hasn't been recorded here yet. " +
    "Nothing is changed automatically.</p>" +
    (ui.cardCheck && ui.cardCheck.id === card.id
      ? '<div class="note ' + (ui.cardCheck.diff === 0 ? "ok" : "") + '"><span aria-hidden="true">' +
        (ui.cardCheck.diff === 0 ? "✅" : "⚠️") + "</span><div>" +
        (ui.cardCheck.diff === 0
          ? "They match exactly."
          : "Your bank shows " + money(ui.cardCheck.real) + ", this app shows " + money(m.outstanding) +
            " — a difference of <b>" + money(Math.abs(ui.cardCheck.diff)) + "</b>. " +
            "Add the missing charge or refund to bring them together.") + "</div></div>"
      : "") + "</div></div>";
  return h;
}

  h += '<div class="card"><p class="sub"><b>' + esc(card.name) + "</b><br>" +

    '<button type="button" class="btn g s" data-act="addCharge" data-id="' + esc(card.id) + '">Add a fee, interest or EMI</button>' +
    "</div></div>";

}

/* ---------- statement page ---------- */
function pageStatement() {
  var st = statementById(ui.stmtId);

  var card = acc(st.cardId);
  var state = statementState(st), pays = statementPayments(st.id);

    '<p class="sub">Closed on ' + esc(fDateLong(st.closeDate)) +

    (st.ref ? " · ref " + esc(st.ref) : "") + "</p><table>" +

    row2("Last date to pay", st.dueDate ? fDateLong(st.dueDate) : "Not set") +
    (st.dueDate && state !== "paid" ? row2("Time left", dayPhrase("Payment due", daysBetweenIso(today(), st.dueDate), "Payment overdue by")) : "") +
    row2("Confirmed by you on", st.confirmedAt ? fStamp(st.confirmedAt) : "—") +
    "</table>" +
    '<div class="btns" style="margin-block-start:10px">' +
    (state === "paid" ? "" : '<button type="button" class="btn s" data-act="payCard" data-id="' + esc(st.cardId) +
      '" data-stmt="' + esc(st.id) + '">Pay this statement</button>') +
    '<button type="button" class="btn g s" data-act="confirmStmt" data-id="' + esc(st.cardId) +
      '" data-stmt="' + esc(st.id) + '">Edit these figures</button>' +
    '<button type="button" class="btn g s" data-act="stmtCsv" data-id="' + esc(st.id) + '">Download</button>' +
    '<button type="button" class="btn d s" data-act="delStmt" data-id="' + esc(st.id) + '">Delete</button></div></div>';

  /* what the issuer said vs what this app worked out */
  var calc = st.calc || {};
  h += '<div class="sec"><h2>Your figures vs the tracked ones</h2><div class="card"><table>' +
    '<tr><th scope="col">Item</th><th scope="col" class="n">From your statement</th>' +
    '<th scope="col" class="n">Worked out here</th></tr>' +
    "<tr><td>Purchases in the cycle</td><td class=\"n\">" + money(st.purchases || 0) +
      '</td><td class="n">' + money(calc.charges || 0) + "</td></tr>" +
    "<tr><td>Fees, interest and EMI</td><td class=\"n\">" +
      money(Math.round(st.fees || 0) + Math.round(st.interest || 0) + Math.round(st.emi || 0)) +
      '</td><td class="n">' + money(calc.fees || 0) + "</td></tr>" +
    "<tr><td>Refunds and credits</td><td class=\"n\">" + money(st.credits || 0) +
      '</td><td class="n">' + money(calc.refunds || 0) + "</td></tr>" +
    "<tr><td>Previous balance carried over</td><td class=\"n\">" + money(st.prevBalance || 0) +
      '</td><td class="n">—</td></tr>' +
    "<tr><td><b>Statement total</b></td><td class=\"n\"><b>" + money(st.balance) +
      '</b></td><td class="n"><b>' + money(calc.total || 0) + "</b></td></tr>" +
    "</table>";
  var diff = Math.round(st.balance || 0) - Math.round(calc.total || 0);
  if (diff !== 0) {
    h += '<div class="note"><span aria-hidden="true">⚠️</span><div>The amount you entered differs from the amount ' +
      "worked out from your recorded transactions by <b>" + money(Math.abs(diff)) + "</b>. " +
      "Your statement is treated as correct — nothing was changed behind your back.</div>" +
      "</div>" +
      '<div class="btns"><button type="button" class="btn g s" data-act="cardCycle" data-id="' + esc(st.cardId) +
      '">Review the transactions</button>' +
      '<button type="button" class="btn g s" data-act="addCharge" data-id="' + esc(st.cardId) + '">Add a missing fee</button></div>';
  } else {
    h += '<div class="note ok"><span aria-hidden="true">✅</span><div>Your statement matches the transactions recorded here.</div></div>';
  }
  h += "</div></div>";

  h += '<div class="sec"><h2>Transactions in this statement</h2><div class="card">' +
    (function () {
      var rows = cardActivity(st.cardId, st.cycleFrom || "", st.closeDate).rows
        .filter(function (t) { return t.type === "out"; });
      return rows.length ? sortTx(rows).map(txRow).join("")
        : '<p class="empty">No card transactions recorded for this cycle.</p>';
    })() + "</div></div>";

  h += '<div class="sec"><h2>Payments against this statement</h2><div class="card">' +
    (pays.length ? sortTx(pays).map(function (t) {
      return '<div class="tx"><span class="ic" aria-hidden="true">💳</span>' +
        '<button type="button" class="txmain" data-act="openTx" data-id="' + esc(t.id) + '">' +
        "<b>" + money(t.amt) + " from " + esc(accName(t.acc)) + "</b><span>" +
        esc(fDateLong(t.date) + (t.ref ? " · ref " + t.ref : "")) + "</span></button></div>";
    }).join("") : '<p class="empty">Nothing paid against this statement yet.</p>') + "</div></div>";
  return h;
}

/* ---------- sheets ---------- */
function confirmStmtSheet(card, existing) {
  var cycle = currentCycle(card);
  var close = existing ? existing.closeDate : (lastExpectedClosing(card) || today());
  var from = existing ? (existing.cycleFrom || cycle.from) : cycle.from;
  var a = cardActivity(card.id, from, close);
  var fees = 0;
  db.tx.forEach(function (t) {
    if (t.acc === card.id && t.charge && t.date >= (from || "") && t.date <= close) fees += Math.round(t.amt || 0);
  });
  var calcTotal = a.charges - a.refunds;
  var due = existing ? existing.dueDate : expectedDue(card, close);
  return '<div class="shd"><h2>' + (existing ? "Edit this statement" : "Confirm your bill") + "</h2>" +
    '<button type="button" class="ib grow" data-act="closeSheet" aria-label="Close">✕</button></div>' +
    '<div class="note"><span aria-hidden="true">🔒</span><div>This app has no connection to your bank, so it can\'t ' +
    "know what was really billed. Copy the figures from your statement or bank app.</div></div>" +
    '<form data-form="statement"><input type="hidden" name="card" value="' + esc(card.id) + '">' +
    '<input type="hidden" name="id" value="' + esc(existing ? existing.id : "") + '">' +
    '<input type="hidden" name="cycleFrom" value="' + esc(from || "") + '">' +
    '<div class="two"><div class="f"><label for="stClose">Statement date (the day it closed)</label>' +
    '<input id="stClose" name="closeDate" type="date" max="' + today() + '" value="' + esc(close) + '" required></div>' +
    '<div class="f"><label for="stDue">Last date to pay</label>' +
    '<input id="stDue" name="dueDate" type="date" value="' + esc(due || "") + '" required></div></div>' +
    '<div class="two"><div class="f"><label for="stBal">Statement balance</label>' +
    '<input id="stBal" name="balance" type="number" inputmode="decimal" step="0.01" min="0" value="' +
      (existing ? toMajor(existing.balance) : toMajor(Math.max(0, calcTotal))) + '" required></div>' +
    '<div class="f"><label for="stMin">Minimum amount due</label>' +
    '<input id="stMin" name="minDue" type="number" inputmode="decimal" step="0.01" min="0" value="' +
      (existing ? toMajor(existing.minDue) : "") + '" placeholder="0"></div></div>' +
    "<details><summary style=\"cursor:pointer;font-weight:650;padding-block:8px\">More figures from the statement</summary>" +
    '<div class="two"><div class="f"><label for="stPrev">Previous balance carried over</label>' +
    '<input id="stPrev" name="prevBalance" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.prevBalance || 0) : "0") + '"></div>' +
    '<div class="f"><label for="stPur">New purchases</label>' +
    '<input id="stPur" name="purchases" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.purchases || 0) : toMajor(a.charges)) + '"></div></div>' +
    '<div class="two"><div class="f"><label for="stFees">Fees</label>' +
    '<input id="stFees" name="fees" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.fees || 0) : "0") + '"></div>' +
    '<div class="f"><label for="stInt">Interest</label>' +
    '<input id="stInt" name="interest" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.interest || 0) : "0") + '"></div></div>' +
    '<div class="two"><div class="f"><label for="stEmi">EMI charged</label>' +
    '<input id="stEmi" name="emi" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.emi || 0) : "0") + '"></div>' +
    '<div class="f"><label for="stCred">Refunds and credits</label>' +
    '<input id="stCred" name="credits" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.credits || 0) : toMajor(a.refunds)) + '"></div></div>' +
    '<div class="two"><div class="f"><label for="stPast">Past-due amount</label>' +
    '<input id="stPast" name="pastDue" type="number" inputmode="decimal" step="0.01" value="' +
      (existing ? toMajor(existing.pastDue || 0) : "0") + '"></div>' +
    '<div class="f"><label for="stRef">Statement reference (optional)</label>' +
    '<input id="stRef" name="ref" value="' + esc(existing ? existing.ref || "" : "") + '"></div></div>' +
    '<div class="f"><label for="stNote">Notes</label><input id="stNote" name="note" value="' +
      esc(existing ? existing.note || "" : "") + '"></div></details>' +
    '<div class="recap" style="margin-block-start:10px"><b>Worked out from your recorded transactions</b><br>' +
    "Purchases and charges: " + money(a.charges) + "<br>Of which fees, interest or EMI: " + money(fees) +
    "<br>Refunds received: " + money(a.refunds) +
    "<br>Calculated total: <b>" + money(Math.max(0, calcTotal)) + "</b>" +

    '<div class="btns"><button type="submit" class="btn" style="flex:1">' +

}
